[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omlx-model-deepseek-v41-flash"
version = "0.1.1"
description = "DeepSeek V4.1 Flash lossless SSD Cached-MoE Model Worker Package"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.optional-dependencies]
dev = ["ai2apps>=0.1.0.dev2,<0.2", "mlx==0.32.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
omlx_model_deepseek_v41_flash = ["assets/*.json"]
