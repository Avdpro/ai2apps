schema: ai2apps.service/v1
id: ai2apps.model.deepseek-v41-flash
name: DeepSeek V4.1 Flash
description: Lossless multimodal DeepSeek V4.1 Flash SSD Cached-MoE Worker.
version: 0.1.1
publisher:
  id: ai2apps
runtime:
  mode: process
  protocol: ai2apps-model-worker/v1
  provider: ai2apps.runtime.omlx
  adapter: src/worker_adapter.py:create_adapter
models:
- id: ai2apps.model.deepseek-v41-flash/deepseek-v41-flash
  display_name: DeepSeek V4.1 Flash
  model_type: vlm
  upstream_id: Avdpro/DeepSeek-V4.1-Flash-SSD
  capabilities:
  - work
  - conversation
  - image_recognition
  weights:
    provider: huggingface
    repo_id: Avdpro/DeepSeek-V4.1-Flash-SSD
    revision: efb7e03fd718ebbeb3e0d7e60ed037a920d8e441
    distribution_id: dist_ai2apps_deepseek_v41_flash_ssd_efb7e03f_v1
    preparation:
      recipe: ai2apps/cache-moe/v1
      install_id: deepseek-v41-flash
      family: deepseek_v41
      execution_modes:
      - cached
      default_execution_mode: cached
      storage_policies:
      - keep_source
      storage_estimates:
        source_gb: 510.4
        prepared_gb: 0
        keep_peak_gb: 510.4
      engine:
        id: deepseek-v41-ssd
        name: DeepSeek V4.1 SSD
        version: 1
        scope_asset: src/omlx_model_deepseek_v41_flash/assets/scope-profile.json
        scope_pack: src/omlx_model_deepseek_v41_flash/assets/scope-pack.json
      scope_name: standard
      conversion:
        format: ai2apps-ssd-checkpoint
        version: 1
        variant: dsv41-original-fp4-six-segment-v1
      main_slots: 40
      hot_slots: 8
      prefill_slots: 64
      memory_tiers:
      - id: standard
        label: Standard
        experts: 40
        estimated_gb: 65
  metadata:
    family: deepseek_v41
    quantization: original-fp4-fp8
    execution_modes:
    - cached
    default_execution_mode: cached
    preparation: ssd-checkpoint
    multimodal: true
    reasoning:
      schema: ai2apps.reasoning/v1
      mode: optional
      format: think_tags
      default_enabled: true
capabilities: []
requires:
  services:
  - id: ai2apps.runtime.omlx
    version: '>=1.7.5,<2.0.0'
    optional: false
    capabilities:
    - mlx
    - model-worker-v1
    - cached-moe
    - ssd-checkpoint-v1
    - vlm
  python: '>=3.11,<3.14'
permissions:
  network:
    outbound: false
  model_weights:
    huggingface_cache: read
    reason: Read the Host-selected pinned DeepSeek V4.1 SSD checkpoint.
  accelerator:
    metal: true
    reason: Run the lossless MLX Cached-MoE engine on Apple GPU.
compatibility:
  os:
  - macos
  architectures:
  - arm64
  minimum_os_version: '26.2'
health:
  path: /health
  startup_timeout_seconds: 30
restart:
  max_attempts: 2
  base_delay_seconds: 1
tools: []
