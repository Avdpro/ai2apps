schema: ai2apps.service/v1
id: ai2apps.model.liveportrait-cuda
name: LivePortrait CUDA
description: Official LivePortrait Torch animation with YuNet and 203-point landmarks
  on NVIDIA CUDA.
version: 0.1.0
publisher:
  id: ai2apps
license:
  name: MIT License
  id: MIT
  path: LICENSE
attribution:
  notice: META/NOTICE.md
  upstream: https://github.com/KwaiVGI/LivePortrait
  checkpoint: https://huggingface.co/Avdpro/LivePortrait-CUDA
runtime:
  mode: process
  protocol: ai2apps-model-worker/v1
  provider: ai2apps.runtime.cuda-torch
  adapter: src/worker_adapter.py:create_adapter
models:
- id: ai2apps.model.liveportrait-cuda/liveportrait
  display_name: LivePortrait CUDA
  model_type: video_generation
  upstream_id: KlingTeam/LivePortrait
  capabilities:
  - video_generation
  - portrait_animation
  - reference_image
  - driving_video
  - preserve_audio
  weights:
    provider: huggingface
    repo_id: Avdpro/LivePortrait-CUDA
    revision: f8dd1b0cf7ebd665c7f71ce12ecb8b0725183a83
    distribution_id: dist_ai2apps_liveportrait_cuda_f8dd1b0c_v1
    preparation:
      recipe: native
  metadata:
    family: liveportrait
    implementation: official-torch-cuda
    upstream_revision: 82a4fa6735ca58432b6ce39301b4b9ee066dea47
    upstream_code_revision: 9b294b3d0536135442ea73cb01e6cb3ca7029dd3
    checkpoint_layout: ai2apps.cuda-liveportrait-checkpoint/v2
    modelscope:
      repo_id: ai2apps/LivePortrait-CUDA
      revision: 001cf3c768341904d63f8563fcd1cbc459fe3831
      preferred: true
      allow_patterns:
      - LICENSE
      - NOTICE.md
      - README.md
      - YUNET_LICENSE
      - appearance_feature_extractor.safetensors
      - conversion-receipt.json
      - face_detection_yunet_2023mar.onnx
      - landmark.onnx
      - models.yaml
      - motion_extractor.safetensors
      - spade_generator.safetensors
      - stitching.safetensors
      - stitching_eye.safetensors
      - stitching_lip.safetensors
      - warping_module.safetensors
      - ai2apps-checkpoint.json
  video_capabilities:
    schema: ai2apps.video-capabilities/v1
    operations:
    - video_generation
    content_combinations:
    - id: reference_image_driving_video
      required:
      - type: image_url
        role: reference_image
        min: 1
        max: 1
      - type: video_url
        role: reference_video
        min: 1
        max: 1
      optional: []
      unsupported_roles:
      - prompt
      - negative_prompt
      - first_frame
      - last_frame
      - mask
      - source_video
      - reference_audio
      - driving_audio
      - soundtrack
    formats:
      image_input:
      - png
      - jpeg
      - webp
      audio_input: []
      video_input:
      - mp4
      - mov
      - webm
      video_output:
      - mp4
      video_codecs:
      - h264
      audio_codecs:
      - aac
    geometry:
      resolutions:
      - source
      ratios:
      - source
      framespersecond:
      - 10
      - 15
      - 24
      - 25
      - 30
      - 50
      - 60
      alpha: false
    duration:
      mode: driving_video
      minimum_seconds: 0.04
      maximum_seconds: null
      long_video: native
      native_window_frames: null
    audio:
      modes:
      - auto
      - none
      - preserve_driving_audio
      default_mode: auto
      generated_audio: false
    presets:
    - id: quality
      display_name: Quality FP32
      deterministic: true
      approximate: false
      cancellable: true
      resumable: unsupported
    - id: fast
      display_name: Fast BF16
      deterministic: true
      approximate: true
      cancellable: true
      resumable: unsupported
    defaults:
      resolution: source
      ratio: source
      framespersecond: 25
      preset: quality
      output_format: mp4
      audio_output_mode: auto
    execution:
      asynchronous: true
      streaming_preview: false
      progress: phase
      max_concurrency_per_device: 1
      memory_profiles:
        compact:
          minimum_unified_memory_gib: 16
          resolutions:
          - source
        standard:
          minimum_unified_memory_gib: 24
          resolutions:
          - source
capabilities:
- video-generation
requires:
  services:
  - id: ai2apps.runtime.cuda-torch
    version: '>=0.6.0,<1.0.0'
    optional: false
    capabilities:
    - cuda
    - model-worker-v1
    - liveportrait
    - video-generation
  python: '>=3.11,<3.14'
permissions:
  network:
    outbound: false
  model_weights:
    huggingface_cache: read
    reason: Read only the Host-selected pinned CUDA LivePortrait checkpoint.
  accelerator:
    cuda: true
    reason: Run official Torch portrait animation on CUDA.
compatibility:
  os:
  - linux
  architectures:
  - arm64
  - aarch64
health:
  path: /health
  startup_timeout_seconds: 120
restart:
  max_attempts: 2
  base_delay_seconds: 1
tools: []
