schema: ai2apps.service/v1
id: ai2apps.model.yue2-cuda
name: YuE2 CUDA
description: Song creation with the pinned official YuE2 CUDA pipeline, lyrics and
  optional ABC planning. Original model terms require confirmation before downloading.
version: 0.1.0
publisher:
  id: ai2apps
license:
  id: Apache-2.0
  name: Apache License 2.0
  path: LICENSE
attribution:
  notice: META/NOTICE.md
  source: https://github.com/multimodal-art-projection/YuE/tree/3d21f8f5d31be867f4c3b2e6beafb0f2e52f8c10
  checkpoint: https://huggingface.co/m-a-p/YuE2-3B/tree/c044757a011169583f363168348ae380946efff8
runtime:
  mode: process
  protocol: ai2apps-model-worker/v1
  provider: ai2apps.runtime.cuda-torch
  adapter: src/worker_adapter.py:create_adapter
models:
- id: ai2apps.model.yue2-cuda/default
  display_name: YuE2 Song Creation CUDA
  model_type: audio_generation
  upstream_id: m-a-p/YuE2-3B
  capabilities:
  - audio_generation
  metadata:
    family: yue2
    estimated_resident_bytes: 8589934592
    required_model_ids:
    - ai2apps.model.yue2-cuda/vae
    audio_generation:
      schema: ai2apps.audio-generation-capabilities/v1
      task: music
      minimum_duration: 1
      maximum_duration: 120
      lyrics: true
      output_formats:
      - wav
      workflow: ai2apps.song-generation/v1
      planning_modes:
      - full
      - melody
      - 'off'
      max_semantic_tokens: 3000
  weights:
    provider: huggingface
    repo_id: m-a-p/YuE2-3B
    revision: c044757a011169583f363168348ae380946efff8
    preparation:
      recipe: native
- id: ai2apps.model.yue2-cuda/vae
  display_name: YuE2 VAE (internal)
  model_type: llm
  upstream_id: m-a-p/YuE2-Vae
  capabilities:
  - audio_decoder
  metadata:
    family: yue2
    internal: true
  weights:
    provider: huggingface
    repo_id: m-a-p/YuE2-Vae
    revision: 152733a19ad43aa67e367f9b5503ef8075bb5126
    preparation:
      recipe: native
capabilities:
- audio-generation
requires:
  services:
  - id: ai2apps.runtime.cuda-torch
    version: '>=0.5.0,<1.0.0'
    optional: false
    capabilities:
    - cuda
    - torch
    - model-worker-v1
    - framework-profiles-v1
    - yue2
  python: '>=3.12,<3.13'
permissions:
  network:
    outbound: false
  model_weights:
    huggingface_cache: read
    reason: Read only the declared immutable audio generation checkpoint.
  accelerator:
    cuda: true
    reason: Run the official YuE2 pipeline on the GPU in an isolated Worker.
compatibility:
  os:
  - linux
  architectures:
  - arm64
  - aarch64
health:
  path: /health
  startup_timeout_seconds: 120
restart:
  max_attempts: 2
  base_delay_seconds: 1
tools: []
