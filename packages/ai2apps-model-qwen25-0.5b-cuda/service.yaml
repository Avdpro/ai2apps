schema: ai2apps.service/v1
id: ai2apps.model.qwen25-0.5b-cuda
name: Qwen2.5 0.5B Instruct CUDA
description: Isolated CUDA Transformers Worker for the pinned Qwen2.5 0.5B Instruct checkpoint.
version: 0.1.1

publisher:
  id: ai2apps

runtime:
  mode: process
  protocol: ai2apps-model-worker/v1
  provider: ai2apps.runtime.cuda-torch
  adapter: src/worker_adapter.py:create_adapter

models:
  - id: ai2apps.model.qwen25-0.5b-cuda/qwen2.5-0.5b-instruct
    display_name: Qwen2.5 0.5B Instruct CUDA
    model_type: llm
    upstream_id: Qwen/Qwen2.5-0.5B-Instruct
    capabilities: [work, conversation]
    context_window: 32768
    weights:
      provider: huggingface
      repo_id: Qwen/Qwen2.5-0.5B-Instruct
      revision: c89bee90d9f811437d9735454613c35b4a3c4dc8
      distribution_id: dist_ai2apps_qwen2_5_0_5b_instruct_c89bee90_v1
      preparation:
        recipe: native
    metadata:
      family: qwen2.5
      precision: bfloat16

capabilities: []

requires:
  services:
    - id: ai2apps.runtime.cuda-torch
      version: ">=0.1.0,<1.0.0"
      optional: false
      capabilities: [cuda, torch, transformers, model-worker-v1, llm]
  python: ">=3.12,<3.13"

permissions:
  network:
    outbound: false
  model_weights:
    huggingface_cache: read
    reason: Read only the Host-selected pinned Qwen checkpoint cache.
  accelerator:
    cuda: true
    reason: Run Transformers inference on the local NVIDIA GPU.

compatibility:
  os: [linux]
  architectures: [arm64, aarch64]

health:
  path: /health
  startup_timeout_seconds: 30

restart:
  max_attempts: 2
  base_delay_seconds: 1

tools: []
