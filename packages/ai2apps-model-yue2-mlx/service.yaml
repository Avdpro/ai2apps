schema: ai2apps.service/v1
id: ai2apps.model.yue2-mlx
name: YuE2 MLX
description: Local song creation with lyrics, melody and chord planning, optional
  ABC score, and native MLX synthesis. Original model terms require confirmation before
  downloading.
version: 0.1.0
publisher:
  id: ai2apps
license:
  id: Apache-2.0
  name: Apache License 2.0
  path: LICENSE
attribution:
  notice: META/NOTICE.md
  source: https://github.com/multimodal-art-projection/YuE/tree/3d21f8f5d31be867f4c3b2e6beafb0f2e52f8c10
  checkpoint: https://huggingface.co/m-a-p/YuE2-3B/tree/c044757a011169583f363168348ae380946efff8
runtime:
  mode: process
  protocol: ai2apps-model-worker/v1
  provider: ai2apps.runtime.omlx
  adapter: src/worker_adapter.py:create_adapter
models:
- id: ai2apps.model.yue2-mlx/default
  display_name: YuE2 Song Creation
  model_type: audio_generation
  upstream_id: m-a-p/YuE2-3B
  capabilities:
  - audio_generation
  metadata:
    family: yue2
    estimated_resident_bytes: 8589934592
    required_model_ids:
    - ai2apps.model.yue2-mlx/vae
    audio_generation:
      schema: ai2apps.audio-generation-capabilities/v1
      task: music
      minimum_duration: 1
      maximum_duration: 120
      lyrics: true
      output_formats:
      - wav
      workflow: ai2apps.song-generation/v1
      planning_modes:
      - full
      - melody
      - 'off'
      max_semantic_tokens: 3000
  weights:
    provider: huggingface
    repo_id: m-a-p/YuE2-3B
    revision: c044757a011169583f363168348ae380946efff8
    preparation:
      recipe: native
    distribution_id: dist_ai2apps_yue2_default_v1
- id: ai2apps.model.yue2-mlx/vae
  display_name: YuE2 VAE (internal)
  model_type: llm
  upstream_id: m-a-p/YuE2-Vae
  capabilities:
  - audio_decoder
  metadata:
    family: yue2
    internal: true
  weights:
    provider: huggingface
    repo_id: m-a-p/YuE2-Vae
    revision: 152733a19ad43aa67e367f9b5503ef8075bb5126
    preparation:
      recipe: native
    distribution_id: dist_ai2apps_yue2_vae_v1
capabilities:
- audio-generation
requires:
  services:
  - id: ai2apps.runtime.omlx
    version: '>=1.8.10,<2.0.0'
    optional: false
    capabilities:
    - mlx
    - model-worker-v1
    - metal
    - audio-generation-v1
    - audio-generation-workflow-v1
  python: '>=3.11,<3.14'
permissions:
  network:
    outbound: false
  model_weights:
    huggingface_cache: read
    reason: Read only the declared immutable audio generation checkpoint.
  accelerator:
    metal: true
    reason: Generate audio using native MLX on Apple GPU.
compatibility:
  os:
  - macos
  architectures:
  - arm64
  minimum_os_version: '26.2'
health:
  path: /health
  startup_timeout_seconds: 120
restart:
  max_attempts: 2
  base_delay_seconds: 1
tools: []
