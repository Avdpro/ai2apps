schema: ai2apps.service/v1
id: ai2apps.model.qwen-image-mlx
name: Qwen Image MLX
description: Unified Qwen Image 2.1 text-to-image and instruction-based editing with RGBA PNG and WebP output.
version: 0.1.3
publisher: {id: ai2apps}
license: {name: Apache License 2.0, id: Apache-2.0, path: LICENSE}
runtime:
  mode: process
  protocol: ai2apps-model-worker/v1
  provider: ai2apps.runtime.omlx
  adapter: src/worker_adapter.py:create_adapter
models:
  - id: ai2apps.model.qwen-image-mlx/2.1
    display_name: Qwen Image 2.1 MLX
    model_type: image_generation
    upstream_id: Qwen/Qwen-Image-2.1
    capabilities: [image_generation, image_edit, multi_reference, text_rendering, multilingual, local, mlx]
    weights:
      provider: huggingface
      repo_id: Qwen/Qwen-Image-2.1
      revision: d26bb61231c349cf6b7896fa83353113880e1ba3
      distribution_id: dist_ai2apps_mlx_qwen_image_21_d26bb612_v1
      preparation: {recipe: native}
    metadata:
      family: qwen-image
      variant: "2.1"
      implementation: mflux-mlx
      mflux_version: 0.24.0
      modelscope:
        repo_id: Qwen/Qwen-Image-2.1
        revision: 45ee13449c69593e1b7a10d7d1cba830c7ada657
        resolved_revision: 45ee13449c69593e1b7a10d7d1cba830c7ada657
        preferred: true
        allow_patterns: ["model_index.json", "processor/*", "scheduler/*", "text_encoder/*", "transformer/*", "vae/*"]
      device_recommendation: {minimum_memory_gib: 32, preferred_memory_gib: 64, quality_rank: 10}
    image_capabilities:
      schema: ai2apps.image-capabilities/v1
      operations: [image_generation, image_edit]
      inputs: {reference_images: {minimum: 1, maximum: 3}}
      formats: {input: [png, jpeg, webp], output: [png, jpeg, webp]}
      geometry:
        minimum: {width: 256, height: 256}
        maximum: {width: 2048, height: 2048}
        multiple_of: 32
        ratios: ["1:1", "4:3", "3:4", "16:9", "9:16", "3:2", "2:3"]
      defaults: {width: 1024, height: 1024, steps: 40, guidance: 1.0, output_format: png}
      execution: {quantizations: [q8, q4, bf16], compiled_denoiser: false, persistent_quantized_cache: false, single_pass_guidance_one: true, edit_kv_cache: true, max_concurrency_per_device: 1}
capabilities: [image-generation, image-edit, qwen-image]
requires:
  services:
    - id: ai2apps.runtime.omlx
      version: ">=1.8.17,<2.0.0"
      optional: false
      capabilities: [mlx, model-worker-v1, metal, image-generation, image-edit]
  python: ">=3.11,<3.14"
permissions:
  network: {outbound: false}
  model_weights: {huggingface_cache: read, reason: Read only Host-selected pinned Qwen Image checkpoints.}
  accelerator: {metal: true, reason: Run native MLX image generation and editing.}
compatibility: {os: [macos], architectures: [arm64], minimum_os_version: "26.2"}
health: {path: /health, startup_timeout_seconds: 300}
restart: {max_attempts: 2, base_delay_seconds: 2}
tools: []
