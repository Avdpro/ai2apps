schema: ai2apps.service/v1
id: ai2apps.model.punctuation-restorer
name: CT-Transformer Punctuation Restorer
description: Internal Chinese/English punctuation restoration dependency for local ASR Packages.
version: 0.1.0

publisher: {id: ai2apps}
license: {name: Apache License 2.0, id: Apache-2.0, path: META/licenses/Apache-2.0.txt}
attribution:
  notice: META/NOTICE.md
  original_model: https://modelscope.cn/models/iic/punc_ct-transformer_zh-cn-common-vocab272727-pytorch
  conversion: https://huggingface.co/ranger810/sherpa-onnx-punct-ct-transformer-zh-en-vocab272727-2024-04-12-int8

runtime:
  mode: process
  protocol: ai2apps-model-worker/v1
  provider: ai2apps.runtime.omlx
  adapter: src/worker_adapter.py:create_adapter

models:
  - id: ai2apps.model.punctuation-restorer/default
    display_name: CT-Transformer Punctuation Restorer
    model_type: llm
    upstream_id: ranger810/sherpa-onnx-punct-ct-transformer-zh-en-vocab272727-2024-04-12-int8
    capabilities: [punctuation_restoration]
    metadata:
      internal: true
      preserves_words: true
      languages: [zh, en]
    weights:
      provider: huggingface
      repo_id: ranger810/sherpa-onnx-punct-ct-transformer-zh-en-vocab272727-2024-04-12-int8
      revision: 5cccf43af83e4fc50d1d55b8410312e87709be70
      preparation: {recipe: native}

capabilities: [punctuation-restoration]
requires:
  services:
    - id: ai2apps.runtime.omlx
      version: ">=1.2.0,<2.0.0"
      optional: false
      capabilities: [model-worker-v1, text-punctuation, onnx]
  python: ">=3.11,<3.14"

permissions:
  network: {outbound: false}
  model_weights:
    huggingface_cache: read
    reason: Read only the Host-selected pinned CT-Transformer ONNX checkpoint.
  accelerator: {metal: false}

compatibility: {os: [macos], architectures: [arm64], minimum_os_version: "26.2"}
health: {path: /health, startup_timeout_seconds: 20}
restart: {max_attempts: 2, base_delay_seconds: 1}
tools: []
