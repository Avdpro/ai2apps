schema: ai2apps.app/v1
id: ai2apps.audio-generation-suite
name: Music and Sound Effects
description: Generate music, sound effects and songs locally in Voice Studio.
version: 0.2.4
publisher:
  id: ai2apps
instances:
  mode: singleton
  scope: user
entry:
  kind: sandbox
  resource: web/music.html
navigation:
  launcher: false
localizations:
  zh-CN:
    name: 音乐与音效
    description: 在语音工坊本地生成音乐、音效与歌曲。
mini_apps:
- schema: ai2apps.mini-app/v1
  id: ai2apps.audio-generation.music
  name: Music Generation
  version: 0.2.4
  kind: clip
  icon: music
  description: Create audio from a description. Results appear in the shared Preview
    & Output.
  localizations:
    zh-CN:
      name: 音乐生成
      description: 根据文字描述生成声音，结果进入共享预览与输出。
  catalog:
    categories:
    - audio
  entry:
    kind: sandbox
    resource: web/music.html
    placements:
    - inline
    - sidebar
  placements:
  - studio: ai2apps.readaloud
    category: audio-tools
    order: 10
  outputs:
  - id: audio
    kind: audio
    final: true
  requirements:
    capabilities:
    - capability: llm.text
      optional: true
    - audio.music_generation
  chat:
    schema: ai2apps.mini-app-chat/v1
    enabled: true
    system_prompt: Read and edit only declared current UI fields. Execute functions
      through the registered owner AaAT, never through a UI run button. Preserve task,
      model, material and shared output ownership.
    context:
      transport: studio-bridge
      maxBytes: 40000
    help:
      resource: help/music/help.md
      max_bytes: 32768
    tools:
    - name: update_current_draft
      description: Update declared UI draft fields without submitting work.
      input_schema:
        type: object
        properties:
          model:
            type: string
            maxLength: 8000
          prompt:
            type: string
            maxLength: 2000
          lyrics:
            type: string
            maxLength: 4096
          duration:
            type: number
            minimum: 1.0
            maximum: 120.0
          seed:
            type: number
            minimum: 0.0
            maximum: 4294967295.0
          steps:
            type: number
            minimum: 1.0
            maximum: 100.0
        additionalProperties: false
      confirmation: never
  aaat:
    schema: ai2apps.mini-app-host-exports/v1
    exports:
    - name: voice.generate_music
      host: ai2apps.readaloud
      inputSchema:
        type: object
        additionalProperties: false
        required:
        - model
        - prompt
        - duration
        properties:
          model:
            type: string
            minLength: 1
          prompt:
            type: string
            minLength: 1
            maxLength: 2000
          lyrics:
            type: string
            maxLength: 4096
          duration:
            type: number
            minimum: 1
            maximum: 120
          seed:
            type: integer
            minimum: 0
            maximum: 4294967295
          steps:
            type: integer
            minimum: 1
            maximum: 100
          schema:
            const: ai2apps.audio-generation/v1
      fields:
      - key: model
        label:
          zh: 模型
          en: Model
        type: text
      - key: prompt
        label:
          zh: 描述
          en: Description
        type: text
      - key: lyrics
        label:
          zh: 歌词
          en: Lyrics
        type: text
      - key: duration
        label:
          zh: 时长
          en: Duration
        type: number
      - key: seed
        label:
          zh: 随机种子
          en: Seed
        type: number
      - key: steps
        label:
          zh: 步数
          en: Steps
        type: number
      - key: schema
        label:
          zh: 请求版本
          en: Request version
        type: text
      displayName:
        zh: 生成音乐
        en: Generate audio
      summary:
        zh: 使用原语音队列生成并发布到共享输出。
        en: Generate using the original Voice queue and shared Output.
      agentContext:
        schema: ai2apps.aaat-declaration/v1
        instructions:
        - Use actual current Mini-App draft/model/material IDs. Never invent models
          or raw paths. Reuse the original durable Studio task and host shared Output;
          page closure is not cancellation. Missing models require Desktop configuration
          with inputs preserved. Unknown submission outcomes must not be replayed.
        result_semantics:
          artifact: Actual owner-published media or output references; UI snapshots
            are not generated artifacts.
          shared_output: Only a completed published owner task proves an output exists.
            Output references belong to the original Studio host.
      selectionRequired: false
      sdk: studio.audio-generation/v1
      options:
        capability: audio.music_generation
      interfaceVersion: 1.0.0
