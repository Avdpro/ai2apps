<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sound Effects</title><link rel="stylesheet" href="generator.css"><script defer src="generator.js"></script></head><body data-mode="sfx"><form id="form"><fieldset id="inputs"><div class="row"><div><label for="model" data-text="model">Model</label><select id="model" required></select></div><button type="button" id="install" data-text="install">Install model…</button></div><p class="hint" id="model-note"></p><label for="prompt" data-text="prompt">Description</label><textarea id="prompt" maxlength="2000" required></textarea><p class="hint" data-text="promptHint"></p><div id="lyrics-field" hidden><label for="lyrics" data-text="lyrics">Lyrics (optional)</label><textarea id="lyrics" maxlength="4096"></textarea><p class="hint" data-text="lyricsHint"></p></div><label for="duration" data-text="duration">Duration (seconds)</label><input id="duration" type="number" min="1" max="120" step="1" value="10" required><details><summary data-text="advanced">Advanced</summary><div class="row"><div><label for="seed" data-text="seed">Seed</label><input id="seed" type="number" min="0" max="4294967295" step="1" value="42" required></div><div><label for="steps" data-text="steps">Sampling steps</label><input id="steps" type="number" min="1" max="100" step="1" value="8" required></div></div></details></fieldset><div class="actions"><button id="generate" class="primary" type="submit" disabled data-text="generate">Generate</button><button id="cancel" type="button" disabled data-text="cancel">Cancel</button></div><p id="status" role="status" aria-live="polite"></p><p id="prepared-prompt" class="hint" aria-live="polite"></p><p id="error" role="alert"></p><p class="hint" data-text="outputHint">Results appear in the shared Preview &amp; Output.</p></form></body></html>
