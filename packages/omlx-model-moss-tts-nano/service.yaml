schema: ai2apps.service/v1
id: ai2apps.model.moss-tts-nano
name: MOSS TTS Nano (Experimental)
description: 'MOSS TTS Nano (Experimental): local speech and reference cloning. Experimental
  quality; emotion control is not enabled.'
version: 0.1.0
publisher:
  id: ai2apps
license:
  name: Apache License 2.0
  id: Apache-2.0
  path: META/licenses/LICENSE.txt
attribution:
  notice: META/NOTICE.md
  source: https://huggingface.co/mlx-community/MOSS-TTS-Nano-100M
runtime:
  mode: process
  protocol: ai2apps-model-worker/v1
  provider: ai2apps.runtime.omlx
  adapter: src/worker_adapter.py:create_adapter
models:
- id: ai2apps.model.moss-tts-nano/100m
  display_name: MOSS TTS Nano (Experimental)
  model_type: audio_tts
  upstream_id: mlx-community/MOSS-TTS-Nano-100M
  capabilities:
  - speech_generation
  - reference_voice
  - voice_cloning
  metadata:
    family: moss-tts-nano
    experimental: true
    quantization: bf16
    license_use: permissive
    required_model_ids:
    - ai2apps.model.moss-tts-nano/codec
  weights:
    provider: huggingface
    repo_id: mlx-community/MOSS-TTS-Nano-100M
    revision: 229a9c51bb0ffff6fd0dbe53b5bf0c441e438a79
    distribution_id: dist_ai2apps_moss_tts_nano_229a9c51_v1
    preparation:
      recipe: native
  audio_capabilities:
    schema: ai2apps.audio-capabilities/v1
    operations:
    - audio_speech
    languages:
    - auto
    - zh
    - en
    formats:
      input:
      - wav
      - pcm
      - mp3
      - m4a
      - aac
      - flac
      - ogg
      - opus
      - webm
      output:
      - wav
      - pcm
      - mp3
      - m4a
      - aac
      - flac
      - ogg
      - opus
      - webm
    streaming:
      mode: unsupported
      formats: []
    tts:
      named_voices:
        mode: unsupported
        voices: []
      speed:
        mode: unsupported
      emotion:
        mode: unsupported
        values: []
      instructions:
        mode: unsupported
      voice_profiles:
        mode: native
        reference_audio: true
        reference_transcript: optional
        transcript_effect: higher_fidelity
      multi_speaker:
        mode: unsupported
- id: ai2apps.model.moss-tts-nano/codec
  display_name: MOSS Audio Tokenizer Nano (internal)
  model_type: llm
  upstream_id: OpenMOSS-Team/MOSS-Audio-Tokenizer-Nano
  capabilities:
  - speech_tokenizer
  metadata:
    internal: true
    family: moss_audio_tokenizer_nano
  weights:
    provider: huggingface
    repo_id: OpenMOSS-Team/MOSS-Audio-Tokenizer-Nano
    revision: 6aa02b01e445cc585582cf0ba480bc3ea6c8dd68
    distribution_id: dist_ai2apps_moss_audio_tokenizer_nano_6aa02b01_v1
    preparation:
      recipe: native
capabilities: []
requires:
  services:
  - id: ai2apps.runtime.omlx
    version: '>=1.8.20,<2.0.0'
    optional: false
    capabilities:
    - mlx
    - model-worker-v1
    - audio-tts
    - audio-processing
    - audio-codecs
    - moss-tts-nano
  python: '>=3.11,<3.14'
permissions:
  network:
    outbound: false
  model_weights:
    huggingface_cache: read
    reason: Read only Host-selected pinned checkpoints.
  accelerator:
    metal: true
    reason: Run local MLX speech synthesis.
compatibility:
  os:
  - macos
  architectures:
  - arm64
  minimum_os_version: '26.2'
health:
  path: /health
  startup_timeout_seconds: 120
restart:
  max_attempts: 2
  base_delay_seconds: 1
tools: []
