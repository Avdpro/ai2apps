<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Web Reader</title><style>body{font:14px system-ui;color:#292524;margin:0;padding:24px}label{display:block;margin:16px 0}input,select,button{font:inherit;padding:10px;border:1px solid #d6d3d1;border-radius:8px}input{display:block;width:calc(100% - 24px);margin-top:8px}button{background:#18181b;color:white;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#fafaf9;padding:16px;border-radius:10px}</style><h1>Web Reader / 网页阅读器</h1><p>Extract links or read an SJX article. Tasks continue in the background.</p><form id="reader"><label>Capability / 能力 <select id="capability" aria-label="Capability"><option value="list">Extract links / 提取链接</option><option value="article">Read article / 阅读文章</option></select></label><label>Page URL / 网页地址<input id="url" type="url" value="https://watchesbysjx.com/" required></label><label id="limit-row">Maximum links / 最多链接数<input id="limit" type="number" min="1" max="100" value="20"></label><label>Browser Profile key / 浏览器分身<input id="profile" value="default" required></label><button id="run">Run / 运行</button></form><p role="status" id="status"></p><pre id="result"></pre><script src="web_agent_mini_app_sdk.js"></script><script src="reader.js"></script></html>
