          in Desktop and recheck. Do not claim output exists before the durable task
          succeeds.
        result_semantics:
          files: Actual generated output artifacts. Subtitle ZIP contains subtitles
            and transcript; burn_in additionally includes rendered video.
      selectionRequired: true
      sdk: studio.video-subtitles/v1
      options: {}
      interfaceVersion: 1.0.0
- schema: ai2apps.mini-app/v1
  id: ai2apps.media-voice.video-audio-translation
  name: Video Audio Translation
  version: 0.2.4
  kind: project
  icon: languages
  description: Translate a single narrator and dub with a Voice Studio Character or
    a temporary clone of the original voice.
  localizations:
    zh-CN:
      name: 视频音轨翻译
      description: 翻译单人旁白，并使用语音工坊角色或原始音色的临时克隆重新配音。
  catalog:
    categories:
    - audio
    - video
    - localization
  entry:
    kind: sandbox
    resource: web/video-audio-translation.html
    placements:
    - inline
    - sidebar
  placements:
  - studio: ai2apps.video-studio
    category: localization
    order: 50
  inputs:
  - id: source_video
    kind: video
    required: true
  - id: target_voice
    kind: voice-profile
    required: true
  outputs:
  - id: translated_video
    kind: video
    final: true
  executor:
    operation: video_audio_translation
  requirements:
    capabilities:
    - media.video_audio_translation
    - audio.detailed_transcription
    - llm.text
    - audio.source_separation
    - audio.speech_generation
    - capability: audio.voice_clone
      optional: true
    - media.audio.extract
    - media.video.audio_mux
  chat:
    schema: ai2apps.mini-app-chat/v1
    enabled: true
    system_prompt: Read and edit only declared current UI fields. Execute functions
      through the registered owner AaAT, never through a UI run button. Preserve task,
      model, material and shared output ownership.
    context:
      transport: studio-bridge
      maxBytes: 40000
    help:
      resource: help/video-audio-translation/help.md
      max_bytes: 32768
    tools:
    - name: update_current_draft
      description: Update declared UI draft fields without submitting work.
      input_schema:
        type: object
        properties:
          sourceLanguage:
            type: string
            maxLength: 8000
          targetLanguage:
            type: string
            maxLength: 8000
          voiceProfileId:
            type: string
            maxLength: 8000
          voiceCloneModelId:
            type: string
            maxLength: 8000
          asrVerification:
            type: boolean
        additionalProperties: false
      confirmation: never
  aaat:
    schema: ai2apps.mini-app-host-exports/v1
    exports:
    - name: video.dub
      host: ai2apps.video-studio
      inputSchema:
        type: object
        additionalProperties: false
        required:
        - video_id
        - target_language
        - voice_profile_id
        - single_narrator
        - consent
        properties:
          video_id:
            type: string
            minLength: 1
            maxLength: 256
            x-ai2apps-asset:
              storage: artifact
              accept: video/*
              references: true
          source_language:
            type: string
            maxLength: 32
            default: ''
          target_language:
            enum:
            - zh
            - en
            - ja
            - ko
          voice_profile_id:
            type: string
            minLength: 1
            maxLength: 256
          voice_clone_model_id:
            type: string
            minLength: 1
            maxLength: 512
          asr_verification:
            type: boolean
            default: true
          single_narrator:
            type: boolean
            const: true
            default: false
          consent:
            type: boolean
            const: true
            default: false
        allOf:
        - if:
            properties:
              voice_profile_id:
                const: __original_voice__
          then:
            required:
            - voice_clone_model_id
          else:
            not:
              required:
              - voice_clone_model_id
      fields:
      - key: video_id
        label:
          zh: 源视频
          en: Source video
        type: asset
        storage: artifact
        accept: video/*
        references: true
        multiple: false
        minItems: 0
        maxItems: 1
      - key: source_language
        label:
          zh: 源语言（空为自动）
          en: 'Source language (empty: auto)'
        type: text
        default: ''
      - key: target_language
        label:
          zh: 配音语言
          en: Dubbing language
        type: select
        options:
        - value: zh
          label:
            zh: 中文
            en: Chinese
        - value: en
          label:
            zh: 英文
            en: English
        - value: ja
          label:
            zh: 日文
            en: Japanese
        - value: ko
          label:
            zh: 韩文
            en: Korean
      - key: voice_profile_id
        label:
          zh: 语音角色编号或 __original_voice__
          en: Voice Character ID or __original_voice__
        type: text
      - key: voice_clone_model_id
        label:
          zh: 原声克隆模型（仅临时克隆）
          en: Clone model (original voice only)
        type: text
      - key: asr_verification
        label:
          zh: 回听核验
          en: ASR verification
        type: boolean
        default: true
      - key: single_narrator
        label:
          zh: 我确认按单旁白配音，不保留多角色音色
          en: I confirm single narration without preserving multiple voices
        type: boolean
        default: false
      - key: consent
        label:
          zh: 我确认拥有视频处理与声音使用权
          en: I confirm rights to process video and use the voice
        type: boolean
        default: false
      displayName:
        zh: 视频配音翻译
        en: Translate video narration
      summary:
        zh: 单旁白视频翻译配音，保留背景；确认声音来源与使用权后后台执行。
        en: Translate single narration with preserved background; confirm voice and
          rights before background execution.
      agentContext:
        schema: ai2apps.aaat-declaration/v1
        instructions:
        - Owned current Session attachment/artifact or Gallery IDs only; original
          source/reference paths are not copied. Reuse the existing durable Studio
          job and host shared Output. Return published Session artifact IDs for further
          processing.
        - Missing models retain parameters for Desktop ACPF; Mobile asks to configure
          Desktop. Client disconnect is not cancellation. Do not retry uncertain effectful
          execution through another capability.
        - Review descriptor characters and clone_models; use only actual ready owner-scoped
          IDs. Original voice uses __original_voice__ and one explicitly selected
          clone model. No saved Character is created.
        - Confirm single narrator and rights through the parameter form; never infer
          consent from attached media. Multi-speaker preservation requires a different
          workflow.
        result_semantics:
          files: Published dubbed MP4 from shared Video Studio output. No claim of
            subjective dubbing quality without listening.
      selectionRequired: true
      sdk: studio.narration-translation/v1
      options: {}
      interfaceVersion: 1.0.0
