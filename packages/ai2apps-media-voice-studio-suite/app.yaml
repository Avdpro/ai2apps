- schema: ai2apps.mini-app/v1
  id: ai2apps.media-voice.audio-speaker-replacement
  name: Audio Speaker Voice Replacement
  version: 0.2.4
  kind: project
  icon: audio-lines
  description: Replace one selected speaker in an audio recording with an authorized
    target voice.
  localizations:
    zh-CN:
      name: 录音角色换声
      description: 使用已获授权的目标声音替换录音中选定角色的声音。
  catalog:
    categories:
    - audio
  entry:
    kind: sandbox
    resource: web/audio-voice-replacement.html
    placements:
    - inline
    - sidebar
  placements:
  - studio: ai2apps.readaloud
    category: voice-tools
    order: 40
  inputs:
  - id: source_audio
    kind: audio
    required: true
  - id: target_voice
    kind: voice-profile
    required: true
  outputs:
  - id: replaced_audio
    kind: audio
    final: true
  executor:
    operation: speaker_voice_replacement
  requirements:
    capabilities:
    - audio.speaker_voice_replacement
    - audio.detailed_transcription
    - audio.speaker_diarization
    - audio.source_separation
    - audio.voice_conversion
  chat:
    schema: ai2apps.mini-app-chat/v1
    enabled: true
    system_prompt: Read and edit only declared current UI fields. Execute functions
      through the registered owner AaAT, never through a UI run button. Preserve task,
      model, material and shared output ownership.
    context:
      transport: studio-bridge
      maxBytes: 40000
    help:
      resource: help/audio-voice-replacement/help.md
      max_bytes: 32768
    tools:
    - name: update_current_draft
      description: Update declared UI draft fields without submitting work.
      input_schema:
        type: object
        properties:
          targetSpeaker:
            type: string
            maxLength: 8000
          voiceName:
            type: string
            maxLength: 8000
          conversionProfile:
            type: string
            maxLength: 8000
        additionalProperties: false
      confirmation: never
  aaat:
    schema: ai2apps.mini-app-host-exports/v1
    exports:
    - name: voice.replace_speaker
      host: ai2apps.readaloud
      inputSchema:
        type: object
        additionalProperties: false
        required:
        - media_id
        - action
        properties:
          media_id:
            type: string
            minLength: 1
            maxLength: 256
            x-ai2apps-asset:
              storage: artifact
              accept: audio/*
              references: true
          action:
            enum:
            - analyze
            - replace
            default: analyze
          analysis_id:
            type: string
            minLength: 1
            maxLength: 256
          target_speaker:
            type: string
            minLength: 1
            maxLength: 128
          reference_id:
            type: string
            minLength: 1
            maxLength: 256
            x-ai2apps-asset:
              storage: artifact
              accept: audio/*
              references: true
          conversion_profile:
            enum:
            - timbre_fast
            - timbre_quality
            - voice_quality
            default: timbre_fast
          consent:
            type: boolean
            default: false
        allOf:
        - if:
            properties:
              action:
                const: replace
          then:
            required:
            - analysis_id
            - target_speaker
            - reference_id
            - consent
            properties:
              consent:
                const: true
      fields:
      - key: media_id
        label:
          zh: 源录音
          en: Source recording
        type: asset
        storage: artifact
        accept: audio/*
        references: true
        multiple: false
        minItems: 0
        maxItems: 1
      - key: action
        label:
          zh: 处理阶段
          en: Stage
        type: select
        options:
        - value: analyze
          label:
            zh: 识别说话人
            en: Analyze speakers
        - value: replace
          label:
            zh: 替换指定角色声音
            en: Replace observed speaker
        default: analyze
      - key: analysis_id
        label:
          zh: 角色分析记录（仅换声）
          en: Analysis reference (replace only)
        type: text
      - key: target_speaker
        label:
          zh: 目标说话人编号（仅换声）
          en: Observed speaker ID (replace only)
        type: text
      - key: reference_id
        label:
          zh: 目标声音参考音频
          en: Reference voice audio
        type: asset
        storage: artifact
        accept: audio/*
        references: true
        multiple: false
        minItems: 0
        maxItems: 1
      - key: conversion_profile
        label:
          zh: 换声质量
          en: Conversion quality
        type: select
        options:
        - value: timbre_fast
          label:
            zh: 音色 · 快速
            en: Timbre · fast
        - value: timbre_quality
          label:
            zh: 音色 · 高质量
            en: Timbre · quality
        - value: voice_quality
          label:
            zh: 声音 · 高质量
            en: Voice · quality
        default: timbre_fast
      - key: consent
        label:
          zh: 我确认拥有处理源录音和使用参考声音的权利
          en: I confirm rights to process the recording and use the reference voice
        type: boolean
        default: false
      displayName:
        zh: 分析角色并换声
        en: Analyze and replace a speaker
      summary:
        zh: 先识别录音角色，再选择目标角色与参考声音并确认使用权。
        en: Analyze first; select the target and reference voice, then confirm usage
          rights.
      agentContext:
        schema: ai2apps.aaat-declaration/v1
        instructions:
        - Inputs are current Session attachment/artifact IDs or owned Gallery IDs,
          never raw paths. Original media is referenced without copying.
        - Use the existing durable Voice Studio job and host-owned Preview & Output.
          Do not claim completion until its published result exists. Missing models
          use Desktop ACPF; preserve materials and parameters. Client disconnect alone
          does not cancel submitted work.
        - First call action=analyze without a target or reference. Return observed
          speaker IDs and sample text; ask the user to identify the target. Analysis
          does not replace any voice.
        - For action=replace pass the returned analysis_id for this exact source in
          the same Session, one observed target_speaker and reference_id. Obtain explicit
          rights consent through the parameter form; consent defaults false and must
          never be inferred from reference availability.
        - Keep source and reference media unchanged. Missing or changed analysis is
          a preflight failure; analyze again only within user authorization.
        result_semantics:
          speakers: Observed diarization IDs with short text samples, not verified
            real identities. Empty speaker evidence cannot authorize replacement.
          files: Analysis JSON or the final mixed WAV, also published to host Output.
      selectionRequired: true
      sdk: studio.media-audio/v1
      options:
        mode: replace_audio
      interfaceVersion: 1.0.0
