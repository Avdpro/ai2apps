schema: ai2apps.app/v1
id: ai2apps.media-voice-studio-suite
name: Media Voice Studio Suite
description: Local-first transcription, separation, voice replacement, dubbing, and
  subtitle tools.
version: 0.2.4
publisher:
  id: ai2apps
instances:
  mode: singleton
  scope: user
entry:
  kind: sandbox
  resource: web/index.html
navigation:
  launcher: false
  category: Creative
  icon: audio-waveform
  order: 80
localizations:
  zh-CN:
    name: 音视频语音工作室套件
    description: 本地优先的转写、音轨分离、角色换声、视频配音和字幕工具。
    navigation:
      category: 创作
mini_apps:
- schema: ai2apps.mini-app/v1
  id: ai2apps.media-voice.source-separation
  name: Voice and Background Separation
  version: 0.2.4
  kind: clip
  icon: split
  description: Separate vocals or dialogue from music and background audio.
  localizations:
    zh-CN:
      name: 人声与背景音分离
      description: 从音乐和背景音中分离人声或对白，并保持原始时间线。
  catalog:
    categories:
    - audio
    - video
  entry:
    kind: sandbox
    resource: web/separation.html
    placements:
    - inline
    - sidebar
  placements:
  - studio: ai2apps.readaloud
    category: audio-tools
    order: 20
  - studio: ai2apps.video-studio
    category: audio
    order: 20
  inputs:
  - id: source_audio
    kind: audio
    required: true
  outputs:
  - id: vocals
    kind: audio
    final: true
  - id: background
    kind: audio
    final: true
  executor:
    operation: source_separation
  requirements:
    capabilities:
    - audio.source_separation
  chat:
    schema: ai2apps.mini-app-chat/v1
    enabled: true
    system_prompt: Read and edit only declared current UI fields. Execute functions
      through the registered owner AaAT, never through a UI run button. Preserve task,
      model, material and shared output ownership.
    context:
      transport: studio-bridge
      maxBytes: 40000
    help:
      resource: help/separation/help.md
      max_bytes: 32768
    tools:
    - name: update_current_draft
      description: Update declared UI draft fields without submitting work.
      input_schema:
        type: object
        properties:
          profile:
            type: string
            maxLength: 8000
        additionalProperties: false
      confirmation: never
  aaat:
    schema: ai2apps.mini-app-host-exports/v1
    exports:
    - name: voice.separate
      host: ai2apps.readaloud
      inputSchema:
        type: object
        additionalProperties: false
        required:
        - media_id
        properties:
          media_id:
            type: string
            minLength: 1
            maxLength: 256
            x-ai2apps-asset:
              storage: artifact
              accept: audio/*,video/*
              references: true
          profile:
            enum:
            - vocals_instrumental
            - dialogue_background
            - music_4stem
            default: vocals_instrumental
      fields:
      - key: media_id
        label:
          zh: 源音频或视频
          en: Source audio or video
        type: asset
        storage: artifact
        accept: audio/*,video/*
        references: true
        multiple: false
        minItems: 0
        maxItems: 1
      - key: profile
        label:
          zh: 分离音轨
          en: Separation tracks
        type: select
        options:
        - value: vocals_instrumental
          label:
            zh: 人声 / 伴奏
            en: Vocals / instrumental
        - value: dialogue_background
          label:
            zh: 对白 / 背景
            en: Dialogue / background
        - value: music_4stem
          label:
            zh: 鼓 / 贝斯 / 其他 / 人声
            en: Drums / bass / other / vocals
        default: vocals_instrumental
      displayName:
        zh: 分离人声和背景
        en: Separate voice and background
      summary:
        zh: 从音频或视频分离音轨，结果进入语音工坊共享输出。
        en: Separate audio tracks into the shared Voice Studio output.
      agentContext:
        schema: ai2apps.aaat-declaration/v1
        instructions:
        - Inputs are current Session attachment/artifact IDs or owned Gallery IDs,
          never raw paths. Original media is referenced without copying.
        - Use the existing durable Voice Studio job and host-owned Preview & Output.
          Do not claim completion until its published result exists. Missing models
          use Desktop ACPF; preserve materials and parameters. Client disconnect alone
          does not cancel submitted work.
        result_semantics:
          files: Published separation ZIP and Session-owned WAV references. The shared
            host Output remains the sole Studio media history; pass these file artifact
            IDs to subsequent compatible Apps.
      selectionRequired: true
      sdk: studio.media-audio/v1
      options: &id001
        mode: separate
      interfaceVersion: 1.0.0
    - name: voice.separate
      host: ai2apps.video-studio
      inputSchema:
        type: object
        additionalProperties: false
        required:
        - media_id
        properties:
          media_id:
            type: string
            minLength: 1
            maxLength: 256
            x-ai2apps-asset:
              storage: artifact
              accept: audio/*,video/*
              references: true
          profile:
            enum:
            - vocals_instrumental
            - dialogue_background
            - music_4stem
            default: vocals_instrumental
      fields:
      - key: media_id
        label:
          zh: 源音频或视频
          en: Source audio or video
        type: asset
        storage: artifact
        accept: audio/*,video/*
        references: true
        multiple: false
        minItems: 0
        maxItems: 1
      - key: profile
        label:
          zh: 分离音轨
          en: Separation tracks
        type: select
        options:
        - value: vocals_instrumental
          label:
            zh: 人声 / 伴奏
            en: Vocals / instrumental
        - value: dialogue_background
          label:
            zh: 对白 / 背景
            en: Dialogue / background
        - value: music_4stem
          label:
            zh: 鼓 / 贝斯 / 其他 / 人声
            en: Drums / bass / other / vocals
        default: vocals_instrumental
      displayName:
        zh: 分离人声和背景
        en: Separate voice and background
      summary:
        zh: 从音频或视频分离音轨，结果进入语音工坊共享输出。
        en: Separate audio tracks into the shared Voice Studio output.
      agentContext:
        schema: ai2apps.aaat-declaration/v1
        instructions:
        - Inputs are current Session attachment/artifact IDs or owned Gallery IDs,
          never raw paths. Original media is referenced without copying.
        - Use the existing durable Voice Studio job and host-owned Preview & Output.
          Do not claim completion until its published result exists. Missing models
          use Desktop ACPF; preserve materials and parameters. Client disconnect alone
          does not cancel submitted work.
        result_semantics:
          files: Published separation ZIP and Session-owned WAV references. The shared
            host Output remains the sole Studio media history; pass these file artifact
            IDs to subsequent compatible Apps.
      selectionRequired: true
      sdk: studio.media-audio/v1
      options: *id001
      interfaceVersion: 1.0.0
