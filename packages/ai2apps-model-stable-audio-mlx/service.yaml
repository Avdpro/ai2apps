schema: ai2apps.service/v1
id: ai2apps.model.stable-audio-mlx
name: Stable Audio 3 Small MLX
description: Native MLX text-to-music and sound effects, 1–120 seconds. Powered by
  Stability AI. Weight download requires acceptance of Stability AI and Gemma terms.
version: 0.1.1
publisher:
  id: ai2apps
license:
  id: MIT
  name: MIT License
  path: LICENSE
attribution:
  notice: META/NOTICE.md
  source: https://github.com/Stability-AI/stable-audio-3/tree/3a82c807b69cf4b7c5c05270011a5d5e47abac18
  checkpoint: https://huggingface.co/Avdpro/Stable-Audio-3-Small-MLX/tree/1e17940bc4eeb91b840ba686b99a67e8e36a907f
runtime:
  mode: process
  protocol: ai2apps-model-worker/v1
  provider: ai2apps.runtime.omlx
  adapter: src/worker_adapter.py:create_adapter
models:
- id: ai2apps.model.stable-audio-mlx/music
  display_name: Music / 音乐
  model_type: audio_generation
  upstream_id: sm-music
  capabilities:
  - audio_generation
  weights:
    provider: huggingface
    repo_id: Avdpro/Stable-Audio-3-Small-MLX
    revision: 1e17940bc4eeb91b840ba686b99a67e8e36a907f
    preparation:
      recipe: native
    distribution_id: dist_ai2apps_stable_audio3_small_music_mlx_v1
  metadata:
    family: stable-audio
    estimated_resident_bytes: 3221225472
    audio_generation:
      schema: ai2apps.audio-generation-capabilities/v1
      task: music
      minimum_duration: 1
      maximum_duration: 120
      preferred_prompt_language: en
      lyrics: false
      output_formats:
      - wav
      variant: sm-music
- id: ai2apps.model.stable-audio-mlx/sfx
  display_name: Sound Effects / 音效
  model_type: audio_generation
  upstream_id: sm-sfx
  capabilities:
  - audio_generation
  weights:
    provider: huggingface
    repo_id: Avdpro/Stable-Audio-3-Small-MLX
    revision: 1e17940bc4eeb91b840ba686b99a67e8e36a907f
    preparation:
      recipe: native
    distribution_id: dist_ai2apps_stable_audio3_small_sfx_mlx_v1
  metadata:
    family: stable-audio
    estimated_resident_bytes: 3221225472
    audio_generation:
      schema: ai2apps.audio-generation-capabilities/v1
      task: sound_effects
      minimum_duration: 1
      maximum_duration: 120
      preferred_prompt_language: en
      lyrics: false
      output_formats:
      - wav
      variant: sm-sfx
capabilities:
- audio-generation
requires:
  services:
  - id: ai2apps.runtime.omlx
    version: '>=1.8.9,<2.0.0'
    optional: false
    capabilities:
    - mlx
    - model-worker-v1
    - metal
    - audio-generation-v1
  python: '>=3.11,<3.14'
permissions:
  network:
    outbound: false
  model_weights:
    huggingface_cache: read
    reason: Read only the declared immutable audio generation checkpoint.
  accelerator:
    metal: true
    reason: Generate audio using native MLX on Apple GPU.
compatibility:
  os:
  - macos
  architectures:
  - arm64
  minimum_os_version: '26.2'
health:
  path: /health
  startup_timeout_seconds: 120
restart:
  max_attempts: 2
  base_delay_seconds: 1
tools: []
