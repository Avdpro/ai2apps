schema: ai2apps.service/v1
id: ai2apps.model.z-image-base-mlx
name: Z-Image Base MLX
description: Undistilled Z-Image text-to-image generation with CFG and negative prompts on Apple Silicon.
version: 0.1.0
publisher: {id: ai2apps}
license: {name: Apache License 2.0, id: Apache-2.0, path: LICENSE}
runtime:
  mode: process
  protocol: ai2apps-model-worker/v1
  provider: ai2apps.runtime.omlx
  adapter: src/worker_adapter.py:create_adapter
models:
  - id: ai2apps.model.z-image-base-mlx/base
    display_name: Z-Image Base MLX
    model_type: image_generation
    upstream_id: Tongyi-MAI/Z-Image
    capabilities: [image_generation, text_rendering, multilingual, local, mlx]
    weights:
      provider: huggingface
      repo_id: Tongyi-MAI/Z-Image
      revision: 04cc4abb7c5069926f75c9bfde9ef43d49423021
      distribution_id: dist_ai2apps_z_image_base_04cc4abb_v1
      preparation: {recipe: native}
    metadata:
      family: z-image
      variant: base
      implementation: mflux-native-cfg
      mflux_version: 0.19.0
    image_capabilities:
      schema: ai2apps.image-capabilities/v1
      operations: [image_generation]
      formats: {input: [png, jpeg, webp], output: [png, jpeg, webp]}
      geometry:
        minimum: {width: 256, height: 256}
        maximum: {width: 2048, height: 2048}
        multiple_of: 32
        ratios: ["1:1", "4:3", "3:4", "16:9", "9:16", "3:2", "2:3"]
      defaults: {width: 1024, height: 1024, steps: 30, guidance: 4.0, output_format: png}
      execution:
        quantizations: [q8, q4, bf16]
        compiled_denoiser: true
        persistent_quantized_cache: true
        metal_rms_adaln_fusion: false
        max_concurrency_per_device: 1
capabilities: [image-generation, z-image]
requires:
  services:
    - id: ai2apps.runtime.omlx
      version: ">=1.6.2,<2.0.0"
      optional: false
      capabilities: [mlx, model-worker-v1, metal, image-generation, z-image]
  python: ">=3.11,<3.14"
permissions:
  network: {outbound: false}
  model_weights: {huggingface_cache: read, reason: Read only the Host-selected pinned Z-Image checkpoint.}
  accelerator: {metal: true, reason: Run native MLX image generation.}
compatibility: {os: [macos], architectures: [arm64], minimum_os_version: "26.2"}
health: {path: /health, startup_timeout_seconds: 240}
restart: {max_attempts: 2, base_delay_seconds: 2}
tools: []
