schema: ai2apps.service/v1
id: ai2apps.model.fish-s2-cuda
name: Fish Audio S2 Pro CUDA
description: CUDA Fish S2 Pro reference cloning, expressive speech and up to five
  speakers. Built with Fish Audio.
version: 0.1.0
publisher:
  id: ai2apps
license:
  name: Fish Audio Research License
  id: LicenseRef-Fish-Audio-Research
  path: META/licenses/Fish-Audio-Research-License.md
attribution:
  notice: META/NOTICE.md
  source: https://github.com/fishaudio/fish-speech
runtime:
  mode: process
  protocol: ai2apps-model-worker/v1
  provider: ai2apps.runtime.cuda-torch
  adapter: src/worker_adapter.py:create_adapter
models:
- id: ai2apps.model.fish-s2-cuda/bf16
  display_name: Fish Audio S2 Pro BF16
  model_type: audio_tts
  upstream_id: fishaudio/s2-pro
  capabilities:
  - speech_generation
  - reference_voice
  - voice_cloning
  - voice_instructions
  - emotion
  - multi_speaker
  metadata:
    family: fish-s2
    variant: s2-pro-bf16
    license_use: research_noncommercial_only
    commercial_license_required: true
    attribution_display: Built with Fish Audio
    maximum_speakers: 5
    modelscope:
      repo_id: fishaudio/s2-pro
      revision: 25d17c7b8763aa4bab6ec86fd61e2a3f388f2d04
      preferred: true
      allow_patterns:
      - LICENSE.md
      - README.md
      - chat_template.jinja
      - codec.pth
      - config.json
      - model-00001-of-00002.safetensors
      - model-00002-of-00002.safetensors
      - model.safetensors.index.json
      - special_tokens_map.json
      - tokenizer.json
      - tokenizer_config.json
  weights:
    provider: huggingface
    repo_id: fishaudio/s2-pro
    revision: 1de9996b6be38b745688de084d87a5633f714e4e
    preparation:
      recipe: native
  audio_capabilities:
    schema: ai2apps.audio-capabilities/v1
    operations:
    - audio_speech
    languages:
    - auto
    - zh
    - en
    - ja
    - ko
    - es
    - pt
    - ar
    - ru
    - fr
    - de
    - sv
    - it
    - tr
    - 'no'
    - nl
    - cy
    - eu
    - ca
    - da
    - gl
    - ta
    - hu
    - fi
    - pl
    - et
    - hi
    - ur
    - th
    - vi
    - bn
    - cs
    - sw
    - he
    - ms
    - uk
    - id
    formats:
      input:
      - wav
      - pcm
      - mp3
      - m4a
      - aac
      - flac
      - ogg
      - opus
      - webm
      output:
      - wav
      - pcm
      - mp3
      - m4a
      - aac
      - flac
      - ogg
      - opus
      - webm
    streaming:
      mode: unsupported
      formats: []
    tts:
      named_voices:
        mode: unsupported
        voices: []
      speed:
        mode: native
        minimum: 0.5
        maximum: 2.0
      emotion:
        mode: native
        values:
        - neutral
        - happy
        - sad
        - angry
        - calm
        - excited
        - surprised
        - whisper
        - shouting
      instructions:
        mode: native
        control: inline_tags
      voice_profiles:
        mode: native
        reference_audio: true
        reference_transcript: optional
        transcript_effect: higher_fidelity
      multi_speaker:
        mode: native
        maximum_speakers: 5
        control: inline_speaker_tags
capabilities: []
requires:
  services:
  - id: ai2apps.runtime.cuda-torch
    version: '>=0.6.0,<1.0.0'
    optional: false
    capabilities:
    - cuda
    - model-worker-v1
    - fish-s2
  python: '>=3.12,<3.13'
permissions:
  network:
    outbound: false
  model_weights:
    huggingface_cache: read
    reason: Read only Host-selected pinned Fish S2 Pro checkpoints.
  accelerator:
    cuda: true
    reason: Run fixed official Fish S2 Pro on CUDA.
compatibility:
  os:
  - linux
  architectures:
  - arm64
health:
  path: /health
  startup_timeout_seconds: 90
restart:
  max_attempts: 2
  base_delay_seconds: 1
tools: []
