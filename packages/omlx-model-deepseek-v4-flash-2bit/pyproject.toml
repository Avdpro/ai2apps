[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omlx-model-deepseek-v4-flash-2bit"
version = "0.3.3"
description = "DeepSeek V4 Flash 2-bit isolated Model Worker Package"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.optional-dependencies]
dev = ["ai2apps>=0.1.0.dev2,<0.2", "mlx==0.32.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
omlx_model_deepseek_v4_flash_2bit = ["assets/*.json"]
