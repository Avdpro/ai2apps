schema: ai2apps.service/v1
id: ai2apps.model.flashhead-mlx
name: FlashHead Lite / Pro MLX
description: Native MLX image and audio driven avatar video generation; Lite recommended.
version: 0.1.0
publisher:
  id: ai2apps
license:
  name: Apache License 2.0
  id: Apache-2.0
  path: LICENSE.upstream
attribution:
  notice: META/NOTICE.md
  source: https://github.com/Soul-AILab/SoulX-FlashHead
runtime:
  mode: process
  protocol: ai2apps-model-worker/v1
  provider: ai2apps.runtime.omlx
  adapter: src/worker_adapter.py:create_adapter
models:
- id: ai2apps.model.flashhead-mlx/lite
  display_name: FlashHead Lite MLX
  model_type: video_generation
  upstream_id: SoulX-FlashHead-Lite-MLX
  capabilities:
  - video_generation
  - avatar_video
  - reference_image
  - driving_audio
  metadata:
    family: flashhead
    variant: lite
    implementation: native-mlx
    upstream_commit: 9bc03de06bb0de82cd6bc477804512ae06144bf2
    checkpoint_layout: ai2apps.flashhead-mlx-checkpoint/v1
    checkpoint_status: local-prepared-unpublished
  video_capabilities:
    schema: ai2apps.video-capabilities/v1
    operations:
    - video_generation
    content_combinations:
    - id: reference_image_driving_audio
      required:
      - type: image_url
        role: reference_image
        min: 1
        max: 1
      - type: audio_url
        role: driving_audio
        min: 1
        max: 1
      optional: []
      unsupported_roles:
      - negative_prompt
      - first_frame
      - last_frame
      - mask
      - reference_video
      - source_video
      - reference_audio
      - soundtrack
      - prompt
    formats:
      image_input:
      - png
      - jpeg
      - webp
      audio_input:
      - wav
      video_input: []
      video_output:
      - mp4
      video_codecs:
      - h264
      audio_codecs:
      - aac
    geometry:
      resolutions:
      - 512x512
      ratios:
      - '1:1'
      framespersecond:
      - 25
      alpha: false
    duration:
      mode: driving_audio
      minimum_seconds: 6.25e-05
      maximum_seconds: 60
      long_video: segmented
      native_window_frames: 33
    audio:
      modes:
      - preserve_driving_audio
      default_mode: preserve_driving_audio
      generated_audio: false
    presets:
    - id: standard
      display_name: Standard (4 steps)
      deterministic: false
      approximate: false
      cancellable: true
      resumable: unsupported
    defaults:
      resolution: 512x512
      ratio: '1:1'
      framespersecond: 25
      preset: standard
      seed: 0
      output_format: mp4
      audio_output_mode: preserve_driving_audio
    execution:
      asynchronous: true
      streaming_preview: false
      progress: step
      max_concurrency_per_device: 1
      memory_profiles:
        standard:
          minimum_unified_memory_gib: 32
          resolutions:
          - 512x512
- id: ai2apps.model.flashhead-mlx/pro
  display_name: FlashHead Pro MLX
  model_type: video_generation
  upstream_id: SoulX-FlashHead-Pro-MLX
  capabilities:
  - video_generation
  - avatar_video
  - reference_image
  - driving_audio
  metadata:
    family: flashhead
    variant: pro
    implementation: native-mlx
    upstream_commit: 9bc03de06bb0de82cd6bc477804512ae06144bf2
    checkpoint_layout: ai2apps.flashhead-mlx-checkpoint/v1
    checkpoint_status: local-prepared-unpublished
  video_capabilities:
    schema: ai2apps.video-capabilities/v1
    operations:
    - video_generation
    content_combinations:
    - id: reference_image_driving_audio
      required:
      - type: image_url
        role: reference_image
        min: 1
        max: 1
      - type: audio_url
        role: driving_audio
        min: 1
        max: 1
      optional: []
      unsupported_roles:
      - negative_prompt
      - first_frame
      - last_frame
      - mask
      - reference_video
      - source_video
      - reference_audio
      - soundtrack
      - prompt
    formats:
      image_input:
      - png
      - jpeg
      - webp
      audio_input:
      - wav
      video_input: []
      video_output:
      - mp4
      video_codecs:
      - h264
      audio_codecs:
      - aac
    geometry:
      resolutions:
      - 512x512
      ratios:
      - '1:1'
      framespersecond:
      - 25
      alpha: false
    duration:
      mode: driving_audio
      minimum_seconds: 6.25e-05
      maximum_seconds: 10
      long_video: segmented
      native_window_frames: 33
    audio:
      modes:
      - preserve_driving_audio
      default_mode: preserve_driving_audio
      generated_audio: false
    presets:
    - id: standard
      display_name: Standard (4 steps)
      deterministic: false
      approximate: false
      cancellable: true
      resumable: unsupported
    defaults:
      resolution: 512x512
      ratio: '1:1'
      framespersecond: 25
      preset: standard
      seed: 0
      output_format: mp4
      audio_output_mode: preserve_driving_audio
    execution:
      asynchronous: true
      streaming_preview: false
      progress: step
      max_concurrency_per_device: 1
      memory_profiles:
        standard:
          minimum_unified_memory_gib: 32
          resolutions:
          - 512x512
capabilities:
- video-generation
requires:
  services:
  - id: ai2apps.runtime.omlx
    version: '>=1.8.5,<2.0.0'
    optional: false
    capabilities:
    - mlx
    - model-worker-v1
    - metal
    - video-generation
    - video-codecs
    - audio-codecs
  python: '>=3.11,<3.14'
permissions:
  network:
    outbound: false
  model_weights:
    huggingface_cache: read
    reason: Read only Host-selected immutable FlashHead Lite/Pro checkpoints.
  accelerator:
    metal: true
    reason: Run native MLX avatar video generation.
compatibility:
  os:
  - macos
  architectures:
  - arm64
  minimum_os_version: '26.2'
health:
  path: /health
  startup_timeout_seconds: 120
restart:
  max_attempts: 2
  base_delay_seconds: 2
tools: []
