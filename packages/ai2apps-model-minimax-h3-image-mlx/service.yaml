schema: ai2apps.service/v1
id: ai2apps.model.minimax-h3-image
name: MiniMax H3-Image MLX
description: MiniMax-H3-Image text-to-image and multi-reference editing, running locally on Apple Silicon.
version: 0.1.1
publisher: {id: ai2apps}
license: {name: MiniMax-H3-Image Community License Agreement, id: LicenseRef-MiniMax-H3-Image, path: LICENSE}
runtime:
  mode: process
  protocol: ai2apps-model-worker/v1
  provider: ai2apps.runtime.omlx
  adapter: src/worker_adapter.py:create_adapter
models:
  - id: ai2apps.model.minimax-h3-image/default
    display_name: MiniMax H3-Image MLX
    model_type: image_generation
    upstream_id: MiniMaxAI/MiniMax-H3-Image
    capabilities: [image_generation, image_edit, local, mlx]
    weights:
      provider: huggingface
      repo_id: MiniMaxAI/MiniMax-H3-Image
      revision: 5f90473023975e6271b0ed1dd84c4e88e4bbc6d3
      distribution_id: dist_ai2apps_minimax_h3_image_5f904730_v1
      preparation: {recipe: native}
    metadata:
      family: minimax-h3-image
      implementation: native-mlx
      required_model_ids: [ai2apps.model.minimax-h3/fl2va-4bit]
      checkpoint_dependencies:
        - {service_id: ai2apps.model.minimax-h3, model_id: ai2apps.model.minimax-h3/fl2va-4bit}
      device_recommendation: {minimum_memory_gib: 128, preferred_memory_gib: 128}
    image_capabilities:
      schema: ai2apps.image-capabilities/v1
      operations: [image_generation, image_edit]
      inputs: {reference_images: {minimum: 1, maximum: 16}}
      formats: {input: [png, jpeg, webp], output: [png, jpeg, webp]}
      geometry:
        minimum: {width: 512, height: 512}
        maximum: {width: 2048, height: 2048}
        multiple_of: 32
        ratios: ["1:1", "4:3", "3:4", "16:9", "9:16", "3:2", "2:3"]
      defaults: {width: 2048, height: 2048, steps: 6, guidance: 1, output_format: png}
      execution: {quantizations: [bf16], single_pass_guidance_one: true, max_concurrency_per_device: 1, denoiser_idle_seconds: 60}
capabilities: [image-generation, image-edit, minimax-h3-image]
requires:
  services:
    - id: ai2apps.runtime.omlx
      version: ">=1.8.11,<2.0.0"
      optional: false
      capabilities: [mlx, metal, model-worker-v1, image-generation, image-edit]
    - id: ai2apps.model.minimax-h3
      version: "==0.11.0"
      optional: false
      capabilities: []
  python: ">=3.11,<3.14"
permissions:
  network: {outbound: false}
  model_weights: {huggingface_cache: read, reason: Read the Host-selected image checkpoint and its shared H3 text encoder.}
  accelerator: {metal: true, reason: Native MLX image inference.}
compatibility:
  os: [macos]
  architectures: [arm64]
  minimum_os_version: "26.2"
  features: [model.checkpoint-dependencies.v1]
health: {path: /health, startup_timeout_seconds: 300}
restart: {max_attempts: 2, base_delay_seconds: 2}
tools: []
