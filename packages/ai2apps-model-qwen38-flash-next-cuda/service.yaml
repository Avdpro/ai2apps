schema: ai2apps.service/v1
id: ai2apps.model.qwen38-flash-next-4bit
name: Qwen3.8 Flash Next CUDA (experimental)
description: Experimental affine Q4 disk-expert CUDA correctness baseline; parity
  and performance gates remain open.
version: 0.1.0
publisher:
  id: ai2apps
runtime:
  mode: process
  protocol: ai2apps-model-worker/v1
  provider: ai2apps.runtime.cuda-torch
  adapter: src/qwen38_flash_worker_adapter.py:create_adapter
models:
- id: ai2apps.model.qwen38-flash-next-4bit/qwen3.8-flash-next-mlx-4bit
  display_name: Qwen3.8 Flash Next CUDA (experimental)
  model_type: vlm
  upstream_id: Avdpro/Qwen3.8-Flash-Next-MLX-4bit-SSD
  capabilities:
  - work
  - conversation
  - image_recognition
  context_window: 8192
  weights:
    provider: huggingface
    repo_id: Avdpro/Qwen3.8-Flash-Next-MLX-4bit-SSD
    revision: 23c6ed09ef3ec9bec2f31039f0e23e94dfacd1b5
    distribution_id: dist_ai2apps_qwen38_flash_next_4bit_ssd_23c6ed09_v1
    preparation:
      recipe: native
  metadata:
    family: qwen4_exp
    quantization: affine-q4
    precision: bfloat16-dequantized
    execution_backend: cuda-transformers-disk-experts
    reasoning:
      schema: ai2apps.reasoning/v1
      mode: optional
      format: think_tags
      default_enabled: true
    development_status: experimental-parity-pending
capabilities: []
requires:
  services:
  - id: ai2apps.runtime.cuda-torch
    version: '>=0.2.0,<1.0.0'
    optional: false
    capabilities:
    - cuda
    - torch
    - transformers
    - model-worker-v1
    - vlm
    - qwen38-bf16
  python: '>=3.12,<3.13'
permissions:
  network:
    outbound: false
  model_weights:
    huggingface_cache: read
    reason: Read only the Host-selected pinned Qwen3.8 repository cache.
  accelerator:
    cuda: true
    reason: Run isolated inference on NVIDIA GB10.
compatibility:
  os:
  - linux
  architectures:
  - arm64
  - aarch64
health:
  path: /health
  startup_timeout_seconds: 30
restart:
  max_attempts: 2
  base_delay_seconds: 1
tools: []
