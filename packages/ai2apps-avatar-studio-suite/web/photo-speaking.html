<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>照片说话</title><link rel="stylesheet" href="avatar.css?v=slots-v2"><script defer src="avatar.js?v=slots-v2"></script></head>
<body><main><form id="avatar-form">
<label for="model">数字人模型</label><select id="model" disabled><option value="">请先配置模型</option></select>
<p id="model-limits">由工作室按需安装模型与权重。</p>
<div class="source-slots">
<section class="source-field" aria-labelledby="portrait-label">
<label id="portrait-label" for="portrait">人像图片</label>
<div class="source-slot" id="portrait-slot">
<button type="button" class="slot-pick" id="portrait-pick" aria-label="选择人像图片"><span class="slot-icon" aria-hidden="true">＋</span><strong>拖入人像图片</strong><span>或点击选择文件</span></button>
<img id="portrait-preview" alt="已选择的人像" hidden>
<input id="portrait" type="file" accept="image/png,image/jpeg,image/webp" hidden>
<button type="button" class="slot-clear" id="portrait-clear" aria-label="移除人像图片" hidden>移除</button>
</div>
<p id="portrait-name" class="source-name">Finder · Gallery · 图片 Output</p>
<p>单人正面照片，PNG / JPEG / WebP，最大 20 MiB。</p>
</section>
<section class="source-field" aria-labelledby="speech-label">
<label id="speech-label" for="speech">驱动音频</label>
<div class="source-slot" id="speech-slot">
<button type="button" class="slot-pick" id="speech-pick" aria-label="选择驱动音频"><span class="slot-icon" aria-hidden="true">♫</span><strong>拖入驱动音频</strong><span>或点击选择文件</span></button>
<input id="speech" type="file" accept="audio/*" hidden>
<button type="button" class="slot-clear" id="speech-clear" aria-label="移除驱动音频" hidden>移除</button>
</div>

<p id="speech-name" class="source-name">Finder · Gallery · 声音 Output</p>
<p>保留原音轨内容，自动转换音频格式，最大 100 MiB。</p>
</section>
</div>
<label for="preset">生成模式</label><select id="preset" disabled></select>
<label for="resolution">分辨率</label><select id="resolution" disabled></select>
<div class="actions"><button type="submit" id="generate" disabled>生成视频</button><button type="button" id="cancel" disabled>停止生成</button><button type="button" id="retry" disabled>重试任务</button></div>
<progress id="progress" max="100" value="0" aria-label="生成进度"></progress><p id="status" role="status" aria-live="polite">正在连接工作室…</p>
<p>提交后可切换 Mini-App，生成会在后台继续。视频保存在工作室的预览与输出中。</p>
</form></main></body></html>
