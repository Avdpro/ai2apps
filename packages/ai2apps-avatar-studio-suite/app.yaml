schema: ai2apps.app/v1
id: ai2apps.avatar-studio-suite
name: Avatar Studio Suite
version: 0.1.5
description: Create talking portrait videos locally.
publisher:
  id: ai2apps
instances:
  mode: singleton
  scope: user
entry:
  kind: sandbox
  resource: web/index.html
navigation:
  launcher: false
localizations:
  en:
    name: Avatar Studio Suite
    description: Open Talking Portrait in Video Studio.
  zh-CN:
    name: 数字人工作室套件
    description: 请在视频工坊中打开照片说话。
  zh-TW:
    name: 數位人工作室套件
    description: 請在影片工作室中開啟照片說話。
  ja:
    name: アバタースタジオ
    description: 動画スタジオで「写真を話させる」を開いてください。
  ko:
    name: 아바타 스튜디오
    description: 비디오 스튜디오에서 말하는 사진을 여세요.
  fr:
    name: Studio d’avatars
    description: Ouvrez Portrait parlant dans Video Studio.
  es:
    name: Estudio de avatares
    description: Abre Retrato parlante en Video Studio.
  pt-BR:
    name: Estúdio de avatares
    description: Abra Retrato falante no Video Studio.
  ru:
    name: Студия аватаров
    description: Откройте «Говорящий портрет» в Video Studio.
mini_apps:
- schema: ai2apps.mini-app/v1
  id: ai2apps.avatar.photo-speaking
  name: Talking Portrait
  version: 0.1.5
  kind: clip
  icon: user-round
  description: Animate a portrait with speech using a compatible local avatar model.
  catalog:
    categories:
    - video
  entry:
    kind: sandbox
    resource: web/photo-speaking.html
    placements:
    - inline
    - sidebar
  placements:
  - studio: ai2apps.video-studio
    category: avatar
    order: 60
  inputs:
  - id: reference_image
    kind: image
    required: true
  - id: driving_audio
    kind: audio
    required: true
  outputs:
  - id: video
    kind: video
    final: true
  executor:
    operation: video_generation
  requirements:
    capabilities:
    - video.avatar_generation
  localizations:
    en:
      name: Talking Portrait
      description: Choose a portrait and audio to begin.
    zh-CN:
      name: 照片说话
      description: 选择人像和音频开始生成。
    zh-TW:
      name: 照片說話
      description: 選擇人像與音訊以開始生成。
    ja:
      name: 写真を話させる
      description: 人物画像と音声を選択してください。
    ko:
      name: 말하는 사진
      description: 인물 이미지와 오디오를 선택하세요.
    fr:
      name: Portrait parlant
      description: Choisissez un portrait et un audio.
    es:
      name: Retrato parlante
      description: Elige un retrato y un audio.
    pt-BR:
      name: Retrato falante
      description: Escolha um retrato e um áudio.
    ru:
      name: Говорящий портрет
      description: Выберите портрет и аудио.
  chat:
    schema: ai2apps.mini-app-chat/v1
    enabled: true
    system_prompt: Read and edit only declared current UI fields. Execute functions
      through the registered owner AaAT, never through a UI run button. Preserve task,
      model, material and shared output ownership.
    context:
      transport: studio-bridge
      maxBytes: 40000
    help:
      resource: help/mini-chat/help.md
      max_bytes: 32768
    tools:
    - name: update_current_draft
      description: Update declared UI draft fields without submitting work.
      input_schema:
        type: object
        properties:
          model:
            type: string
            maxLength: 8000
          preset:
            type: string
            maxLength: 8000
          resolution:
            type: string
            maxLength: 8000
        additionalProperties: false
      confirmation: never
  aaat:
    schema: ai2apps.mini-app-host-exports/v1
    exports:
    - name: video.avatar
      host: ai2apps.video-studio
      inputSchema:
        type: object
        additionalProperties: false
        required:
        - image_id
        - audio_id
        - model_id
        - preset
        - resolution
        properties:
          image_id:
            type: string
            minLength: 1
            maxLength: 256
            x-ai2apps-asset:
              storage: artifact
              accept: image/*
              references: true
          audio_id:
            type: string
            minLength: 1
            maxLength: 256
            x-ai2apps-asset:
              storage: artifact
              accept: audio/*
              references: true
          model_id:
            type: string
            minLength: 1
          preset:
            type: string
            minLength: 1
          resolution:
            type: string
            minLength: 1
      fields:
      - key: image_id
        label:
          zh: 人像图片
          en: Portrait
        type: asset
        storage: artifact
        accept: image/*
        references: true
        multiple: false
        minItems: 0
        maxItems: 1
      - key: audio_id
        label:
          zh: 驱动音频
          en: Driving audio
        type: asset
        storage: artifact
        accept: audio/*
        references: true
        multiple: false
        minItems: 0
        maxItems: 1
      - key: model_id
        label:
          zh: 模型
          en: Model
        type: text
      - key: preset
        label:
          zh: 生成档位
          en: Preset
        type: text
      - key: resolution
        label:
          zh: 分辨率
          en: Resolution
        type: text
      displayName:
        zh: 照片说话
        en: Talking portrait
      summary:
        zh: 通过原视频队列生成照片说话，结果进入共享输出。
        en: Generate talking portraits through the original video queue and shared
          Output.
      agentContext:
        schema: ai2apps.aaat-declaration/v1
        instructions:
        - Use actual current Mini-App draft/model/material IDs. Never invent models
          or raw paths. Reuse the original durable Studio task and host shared Output;
          page closure is not cancellation. Missing models require Desktop configuration
          with inputs preserved. Unknown submission outcomes must not be replayed.
        result_semantics:
          artifact: Actual owner-published media or output references; UI snapshots
            are not generated artifacts.
          shared_output: Only a completed published owner task proves an output exists.
            Output references belong to the original Studio host.
      selectionRequired: false
      sdk: studio.talking-portrait/v1
      options: {}
      interfaceVersion: 1.0.0
