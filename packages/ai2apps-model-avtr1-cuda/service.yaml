schema: ai2apps.service/v1
id: ai2apps.model.avtr1-cuda
name: AVTR-1 CUDA
description: CUDA talking portrait with standard/fast inference and source-canvas
  composition.
version: 0.1.0
publisher:
  id: ai2apps
license:
  name: AVTR-1 Community and component licenses
  path: LICENSE.md
attribution:
  notice: ATTRIBUTION.md
  source: https://github.com/avaturn-live/avtr-1
runtime:
  mode: process
  protocol: ai2apps-model-worker/v1
  provider: ai2apps.runtime.cuda-torch
  adapter: src/worker_adapter.py:create_adapter
models:
- id: ai2apps.model.avtr1-cuda/default
  display_name: AVTR-1 CUDA
  model_type: video_generation
  upstream_id: ai2apps.model.avtr1-cuda/default
  capabilities:
  - video_generation
  - avatar_video
  - reference_image
  - driving_audio
  weights:
    provider: huggingface
    repo_id: Avdpro/AVTR-1-MLX
    revision: 57bfb656636e9fdb24646a2711a7bb606cbd7cb5
    distribution_id: dist_ai2apps_avtr1_cuda_57bfb656_v1
    preparation:
      recipe: native
  metadata:
    family: avtr1
    implementation: torch-cuda
    checkpoint_layout: ai2apps.avtr1-mlx-checkpoint/v1
    checkpoint_status: signed-candidate-publication-unverified
    modelscope:
      repo_id: ai2apps/AVTR-1-MLX
      revision: 17caeffa78ee672e36e22e6f3d798ccef90e7c45
      preferred: true
  video_capabilities:
    schema: ai2apps.video-capabilities/v1
    operations:
    - video_generation
    content_combinations:
    - id: reference_image_driving_audio
      required:
      - type: image_url
        role: reference_image
        min: 1
        max: 1
      - type: audio_url
        role: driving_audio
        min: 1
        max: 1
      optional: []
      unsupported_roles:
      - negative_prompt
      - first_frame
      - last_frame
      - mask
      - reference_video
      - source_video
      - reference_audio
      - soundtrack
      - prompt
    formats:
      image_input:
      - png
      - jpeg
      - webp
      audio_input:
      - wav
      video_input: []
      video_output:
      - mp4
      video_codecs:
      - h264
      audio_codecs:
      - aac
    geometry:
      resolutions:
      - 512x512
      ratios:
      - '1:1'
      framespersecond:
      - 25
      alpha: false
    duration:
      mode: driving_audio
      minimum_seconds: 0.2
      maximum_seconds: 60
      long_video: segmented
      native_window_frames: 5
    audio:
      modes:
      - preserve_driving_audio
      default_mode: preserve_driving_audio
      generated_audio: false
    presets:
    - id: standard
      display_name: Quality (FP32)
      deterministic: false
      approximate: false
      cancellable: true
      resumable: unsupported
    - id: fast
      display_name: Fast (mixed precision)
      deterministic: false
      approximate: true
      cancellable: true
      resumable: unsupported
    defaults:
      resolution: 512x512
      ratio: '1:1'
      framespersecond: 25
      preset: standard
      seed: 42
      output_format: mp4
      audio_output_mode: preserve_driving_audio
    execution:
      asynchronous: true
      streaming_preview: false
      progress: step
      max_concurrency_per_device: 1
      memory_profiles:
        standard:
          minimum_unified_memory_gib: 16
          resolutions:
          - 512x512
        fast:
          minimum_unified_memory_gib: 16
          resolutions:
          - 512x512
capabilities:
- video-generation
requires:
  services:
  - id: ai2apps.runtime.cuda-torch
    version: '>=0.6.0,<1.0.0'
    optional: false
    capabilities:
    - cuda
    - model-worker-v1
    - video-generation
    - avtr
  python: '>=3.11,<3.14'
permissions:
  network:
    outbound: false
  model_weights:
    huggingface_cache: read
    reason: Read only the Host-selected immutable AVTR-1 MLX checkpoint.
  accelerator:
    cuda: true
    reason: Run AVTR talking portrait on CUDA.
compatibility:
  os:
  - linux
  architectures:
  - arm64
  - aarch64
health:
  path: /health
  startup_timeout_seconds: 120
restart:
  max_attempts: 2
  base_delay_seconds: 2
tools: []
