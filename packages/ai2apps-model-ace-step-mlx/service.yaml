      recipe: native
    distribution_id: dist_ai2apps_ace_step15_turbo_mlx_v1
  metadata:
    family: ace-step
    estimated_resident_bytes: 38654705664
    audio_generation:
      schema: ai2apps.audio-generation-capabilities/v1
      task: music
      minimum_duration: 10
      maximum_duration: 120
      lyrics: true
      output_formats:
      - wav
      variant: ace-step-1.5-turbo
capabilities:
- audio-generation
requires:
