schema: ai2apps.service/v1
id: ai2apps.model.ace-step-mlx
name: ACE-Step 1.5 Turbo MLX
description: Native MLX music generation with optional lyrics, 10–120 seconds; 10.09
  GB checkpoint.
version: 0.1.0
publisher:
  id: ai2apps
license:
  id: MIT
  name: MIT License
  path: LICENSE
attribution:
  notice: META/NOTICE.md
  source: https://github.com/Blaizzy/mlx-audio/tree/1e8264a487dd74d4ea327a8250c071558a7cd8f4
  checkpoint: https://huggingface.co/Avdpro/ACE-Step-1.5-Turbo-MLX/tree/ea6bb1523660feb518563f203314528294880d1f
runtime:
  mode: process
  protocol: ai2apps-model-worker/v1
  provider: ai2apps.runtime.omlx
  adapter: src/worker_adapter.py:create_adapter
models:
- id: ai2apps.model.ace-step-mlx/turbo
  display_name: ACE-Step 1.5 Turbo
  model_type: audio_generation
  upstream_id: ace-step-1.5-turbo
  capabilities:
  - audio_generation
  weights:
