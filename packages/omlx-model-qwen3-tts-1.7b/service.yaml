    metadata: {family: qwen3-tts, variant: custom_voice}
    weights:
      provider: huggingface
      repo_id: mlx-community/Qwen3-TTS-12Hz-1.7B-CustomVoice-8bit
      revision: 41d3337e8b7f2843a75841595fc14e4b9a7a4b96
      distribution_id: dist_ai2apps_qwen3_tts_1_7b_custom_voice_8bit_41d3337e_v1
      preparation: {recipe: native}
    audio_capabilities:
      schema: ai2apps.audio-capabilities/v1
      operations: [audio_speech]
      languages: [auto, zh, en, de, it, pt, es, ja, ko, fr, ru]
      formats: {input: [], output: [wav, pcm, mp3, m4a, aac, flac, ogg, opus, webm]}
      streaming: {mode: unsupported, formats: []}
      tts:
        named_voices: {mode: native, voices: [serena, vivian, uncle_fu, ryan, aiden, ono_anna, sohee, eric, dylan]}
        speed: {mode: fallback, minimum: 0.5, maximum: 2.0, control: instruction}
        emotion: {mode: native, values: [neutral, happy, sad, angry, calm, excited]}
        instructions: {mode: native}
        voice_profiles: {mode: unsupported}
