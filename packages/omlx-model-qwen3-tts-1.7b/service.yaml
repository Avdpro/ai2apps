      tts:
        named_voices: {mode: unsupported, voices: []}
        speed: {mode: unsupported}
        emotion: {mode: unsupported, values: []}
        instructions: {mode: unsupported}
        voice_profiles: {mode: native, reference_audio: true, reference_transcript: optional, transcript_effect: higher_fidelity}
        multi_speaker: {mode: unsupported}

