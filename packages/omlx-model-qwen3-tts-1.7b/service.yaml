schema: ai2apps.service/v1
id: ai2apps.model.qwen3-tts-1.7b
name: Qwen3 TTS 1.7B
description: High-quality Qwen3-TTS CustomVoice, reference-voice Base, and VoiceDesign Workers.
version: 0.1.1

publisher: {id: ai2apps}
license: {name: Apache License 2.0, id: Apache-2.0, path: META/licenses/Apache-2.0.txt}
