        instructions: {mode: native, required: true}
        voice_profiles: {mode: unsupported}
        multi_speaker: {mode: unsupported}

capabilities: []
requires:
  services:
    - id: ai2apps.runtime.omlx
      version: ">=1.3.0,<2.0.0"
      optional: false
      capabilities: [mlx, model-worker-v1, audio-tts, audio-processing, audio-codecs]
  python: ">=3.11,<3.14"
permissions:
  network: {outbound: false}
  model_weights: {huggingface_cache: read, reason: Read only Host-selected pinned Qwen3-TTS checkpoints.}
  accelerator: {metal: true, reason: Run high-quality speech synthesis with MLX.}
compatibility: {os: [macos], architectures: [arm64], minimum_os_version: "26.2"}
health: {path: /health, startup_timeout_seconds: 60}
restart: {max_attempts: 2, base_delay_seconds: 1}
tools: []
