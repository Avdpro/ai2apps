schema: ai2apps.service/v1
id: ai2apps.model.fish-s2-pro
name: Fish Audio Drama 3 4-bit
description: 'Fish Audio Drama 3 4-bit: local speech and reference cloning. Built
  with Fish Audio. Replaces Fish S2 Pro as the general TTS engine.'
version: 0.2.0
publisher:
  id: ai2apps
license:
  name: Fish Audio Community License
  id: LicenseRef-Fish-Audio-Community
  path: META/licenses/LICENSE.txt
attribution:
  notice: META/NOTICE.md
  source: https://huggingface.co/mlx-community/fish-audio-drama-3-4bit
runtime:
  mode: process
  protocol: ai2apps-model-worker/v1
  provider: ai2apps.runtime.omlx
  adapter: src/worker_adapter.py:create_adapter
models:
- id: ai2apps.model.fish-s2-pro/bf16
  display_name: Fish Audio Drama 3 4-bit
  model_type: audio_tts
  upstream_id: mlx-community/fish-audio-drama-3-4bit
  capabilities:
  - speech_generation
  - reference_voice
  - voice_cloning
  - emotion
  - voice_instructions
  metadata:
    family: fish-drama3
    experimental: false
    quantization: 4bit
    license_use: community_commercial_conditional
    attribution_display: Built with Fish Audio
    legacy_identifier_note: Stable /bf16 identifier retained for existing bindings;
      actual checkpoint is Drama 3 mixed 4/8-bit, not BF16.
  weights:
    provider: huggingface
    repo_id: mlx-community/fish-audio-drama-3-4bit
    revision: 2b0c8028998533972e77359cce56b8bf1c5d6d4a
    distribution_id: dist_ai2apps_fish_s2_pro_2b0c8028_v1
    preparation:
      recipe: native
  audio_capabilities:
    schema: ai2apps.audio-capabilities/v1
    operations:
    - audio_speech
    languages:
    - auto
    - zh
    - en
    formats:
      input:
      - wav
      - pcm
      - mp3
      - m4a
      - aac
      - flac
      - ogg
      - opus
      - webm
      output:
      - wav
      - pcm
      - mp3
      - m4a
      - aac
      - flac
      - ogg
      - opus
      - webm
    streaming:
      mode: unsupported
      formats: []
    tts:
      named_voices:
        mode: unsupported
        voices: []
      speed:
        mode: unsupported
      emotion:
        mode: native
        values:
        - neutral
        - happy
        - scared
        - angry
      instructions:
        mode: native
        control: inline_tags
      voice_profiles:
        mode: native
        reference_audio: true
        reference_transcript: optional
        transcript_effect: higher_fidelity
      multi_speaker:
        mode: unsupported
capabilities: []
requires:
  services:
  - id: ai2apps.runtime.omlx
    version: '>=1.8.20,<2.0.0'
    optional: false
    capabilities:
    - mlx
    - model-worker-v1
    - audio-tts
    - audio-processing
    - audio-codecs
    - fish-drama3
  python: '>=3.11,<3.14'
permissions:
  network:
    outbound: false
  model_weights:
    huggingface_cache: read
    reason: Read only Host-selected pinned checkpoints.
  accelerator:
    metal: true
    reason: Run local MLX speech synthesis.
compatibility:
  os:
  - macos
  architectures:
  - arm64
  minimum_os_version: '26.2'
health:
  path: /health
  startup_timeout_seconds: 120
restart:
  max_attempts: 2
  base_delay_seconds: 1
tools: []
