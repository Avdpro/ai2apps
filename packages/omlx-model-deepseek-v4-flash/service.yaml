schema: ai2apps.service/v1
id: ai2apps.model.deepseek-v4-flash
name: DeepSeek V4 Flash
description: Isolated full and Cached-MoE Worker for DeepSeek V4 Flash.
version: 0.3.1
publisher: {id: ai2apps}
runtime:
  mode: process
  protocol: ai2apps-model-worker/v1
  provider: ai2apps.runtime.omlx
  adapter: src/worker_adapter.py:create_adapter
models:
  - id: ai2apps.model.deepseek-v4-flash/deepseek-v4-flash
    display_name: DeepSeek V4 Flash
    model_type: llm
    upstream_id: deepseek-ai/DeepSeek-V4-Flash
    capabilities: [work, conversation]
    weights:
      provider: huggingface
      repo_id: deepseek-ai/DeepSeek-V4-Flash
      revision: 60d8d70770c6776ff598c94bb586a859a38244f1
      preparation:
        recipe: ai2apps/cache-moe/v1
        install_id: deepseek-v4-flash
        family: deepseek_v4
        execution_modes: [cached, full]
        storage_policies: [keep_source, delete_after, stream_reclaim]
        storage_estimates: {source_gb: 148, prepared_gb: 143, keep_peak_gb: 291, stream_peak_gb: 155}
        engine:
          id: deepseek-v4-flesh
          name: DeepSeek V4 Flesh
          version: 1
          scope_asset: src/omlx_model_deepseek_v4_flash/assets/scope-profile.json
          scope_pack: src/omlx_model_deepseek_v4_flash/assets/scope-pack.json
        scope_name: general
        conversion: {format: omlx-moe-expert-major-set, version: 1, variant: deepseek-v4-expert-major-v1}
        memory_tiers:
          - {id: lean, label: Lean, experts: 20, estimated_gb: 33}
          - {id: compact, label: Compact, experts: 40, estimated_gb: 43}
          - {id: optimal, label: Optimal, experts: 60, estimated_gb: 54}
    metadata:
      family: deepseek_v4
      execution_modes: [cached, full]
      preparation: cache-moe
capabilities: []
requires:
  services:
    - id: ai2apps.runtime.omlx
      version: ">=1.0.1,<2.0.0"
      optional: false
      capabilities: [mlx, model-worker-v1, cached-moe]
  python: ">=3.11,<3.14"
permissions:
  network: {outbound: false}
  model_weights:
    huggingface_cache: read
    reason: Read only the Host-selected pinned DeepSeek repository cache.
  accelerator: {metal: true, reason: Run oMLX on Apple GPU.}
compatibility: {os: [macos], architectures: [arm64], minimum_os_version: "26.2"}
health: {path: /health, startup_timeout_seconds: 30}
restart: {max_attempts: 2, base_delay_seconds: 1}
tools: []
