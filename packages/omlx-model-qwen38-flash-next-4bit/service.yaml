        experts: 160
        estimated_gb: 44
      - id: performance
        label: Performance
        experts: 224
        estimated_gb: 50
      storage_estimates:
        source_gb: 111.6
        prepared_gb: 0
        keep_peak_gb: 111.6
  metadata:
    family: qwen4_exp
    quantization: 4bit
