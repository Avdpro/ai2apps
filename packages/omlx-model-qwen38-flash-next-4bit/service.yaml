    outbound: false
  model_weights:
    huggingface_cache: read
    reason: Read only the Host-selected pinned Qwen3.8 Flash Next checkpoint.
  accelerator:
    metal: true
    reason: Run oMLX on Apple GPU.
compatibility:
  os:
  - macos
  architectures:
  - arm64
  minimum_os_version: '26.2'
health:
