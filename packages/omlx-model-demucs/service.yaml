schema: ai2apps.service/v1
id: ai2apps.model.demucs-mlx
name: MLX Demucs
description: Native MLX HTDemucs music and dialogue/background source separation.
version: 0.1.0

publisher: {id: ai2apps}
license: {name: Apache License 2.0, id: Apache-2.0, path: LICENSE}
attribution:
  notice: META/NOTICE.md
  upstream: https://github.com/facebookresearch/demucs
  checkpoint: https://huggingface.co/mlx-community/demucs-mlx

runtime:
  mode: process
  protocol: ai2apps-model-worker/v1
  provider: ai2apps.runtime.omlx
  adapter: src/worker_adapter.py:create_adapter

models:
  - id: ai2apps.model.demucs-mlx/default
    display_name: MLX Demucs HTDemucs
    model_type: audio_processing
    upstream_id: mlx-community/demucs-mlx
    capabilities: [source_separation, music_4stem, vocals_instrumental, dialogue_background]
    weights:
      provider: huggingface
      repo_id: mlx-community/demucs-mlx
      revision: d4519e24ddc2dd4a11d56a193092433d852c3961
      distribution_id: dist_ai2apps_mlx_demucs_htdemucs_d4519e24_v1
      preparation: {recipe: native}
    metadata:
      family: demucs
      architecture: htdemucs
      checkpoint_files: [htdemucs.safetensors, htdemucs_config.json]
      modelscope:
        repo_id: mlx-community/demucs-mlx
        revision: 3e2b356248c71ec999090ca6e5eebc65654b8893
        preferred: true
        allow_patterns: &demucs_files [htdemucs.safetensors, htdemucs_config.json]
    audio_capabilities:
      schema: ai2apps.audio-capabilities/v1
      operations: [audio_process]
      languages: []
      formats: {input: [wav, pcm, mp3, m4a, aac, flac, ogg, opus, webm], output: [wav]}
      streaming: {mode: unsupported, formats: []}
      processing:
        separation:
          mode: native
          native_stems: [drums, bass, other, vocals]
          default_profile: dialogue_background
          unsupported_profile_policy: reject
          preserves_timeline: true
          max_input_channels: 2
          sample_rates: [44100]
          profiles:
            - {id: music_4stem, mode: native, stems: [drums, bass, other, vocals]}
            - id: vocals_instrumental
              mode: pipeline
              stems: [vocals, instrumental]
              derivation: {vocals: vocals, instrumental: mixture_minus_vocals}
            - id: dialogue_background
              mode: pipeline
              stems: [dialogue, background]
              derivation: {dialogue: vocals, background: mixture_minus_dialogue}
              limitations: [dialogue_is_approximated_by_the_vocals_stem]
        voice_conversion: {mode: unsupported, target_sources: [], profiles: [], controls: []}
        voice_training: {mode: unsupported, input_sources: [], controls: [], output: null}

capabilities: [audio-processing]
requires:
  services:
    - id: ai2apps.runtime.omlx
      version: ">=1.6.2,<2.0.0"
      optional: false
      capabilities: [mlx, model-worker-v1, audio-processing, audio-codecs]
  python: ">=3.11,<3.14"
permissions:
  network: {outbound: false}
  model_weights: {huggingface_cache: read, reason: Read only the Host-selected pinned MLX HTDemucs checkpoint.}
  accelerator: {metal: true, reason: Run source separation locally with MLX on Apple Silicon.}
compatibility: {os: [macos], architectures: [arm64], minimum_os_version: "26.2"}
health: {path: /health, startup_timeout_seconds: 120}
restart: {max_attempts: 2, base_delay_seconds: 1}
tools: []
