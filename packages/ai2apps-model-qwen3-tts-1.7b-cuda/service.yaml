    - cuda
    - model-worker-v1
    - audio-tts
    - qwen3-tts
  python: '>=3.11,<3.14'
permissions:
  network:
    outbound: false
  model_weights:
    huggingface_cache: read
    reason: Read only the Host-selected pinned Qwen3 TTS checkpoint cache.
  accelerator:
    cuda: true
    reason: Run BF16 CUDA speech inference.
compatibility:
