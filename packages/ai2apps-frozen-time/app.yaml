schema: ai2apps.app/v1
id: ai2apps.frozen-time
name: Frozen Time
version: 0.1.3
description: Local camera motion from a still image.
publisher:
  id: ai2apps
instances:
  mode: singleton
  scope: user
entry:
  kind: sandbox
  resource: web/index.html
navigation:
  launcher: false
localizations:
  en:
    name: Frozen Time
    description: Open Frozen Time in Imagine Studio.
  zh-CN:
    name: 静止时间
    description: 在创意画坊中打开静止时间。
mini_apps:
- schema: ai2apps.mini-app/v1
  id: ai2apps.imagine.frozen-time
  name: Frozen Time
  version: 0.1.3
  kind: clip
  icon: orbit
  description: Turn a still photo into a camera journey, interactive HTML or Live
    Photo.
  catalog:
    categories:
    - image
    - video
  entry:
    kind: sandbox
    resource: web/frozen-time.html
    placements:
    - inline
    - sidebar
  placements:
  - studio: ai2apps.imagine-studio
    category: image
    order: 130
  inputs:
  - id: image
    kind: image
    required: true
  - id: audio
    kind: audio
    required: false
  outputs:
  - id: video
    kind: video
    final: true
  - id: html
    kind: document
    final: true
  - id: live_photo
    kind: archive
    final: true
  executor:
    operation: video_generation
  requirements:
    capabilities:
    - capability: image.frozen_time.vggt
      optional: true
    - capability: image.frozen_time.da
      optional: true
  localizations:
    en:
      name: Frozen Time
      description: Live Photo, interactive orbit and camera-motion video.
    zh-CN:
      name: 静止时间
      description: 将照片转换为实况照片、交互环绕或运镜视频。
  chat:
    schema: ai2apps.mini-app-chat/v1
    enabled: true
    system_prompt: Read and edit only declared current UI fields. Execute functions
      through the registered owner AaAT, never through a UI run button. Preserve task,
      model, material and shared output ownership.
    context:
      transport: studio-bridge
      maxBytes: 40000
    help:
      resource: help/mini-chat/help.md
      max_bytes: 32768
    tools:
    - name: update_current_draft
      description: Update declared UI draft fields without submitting work.
      input_schema:
        type: object
        properties:
          depth:
            type: string
            maxLength: 8000
          output:
            type: string
            maxLength: 8000
          mode:
            type: string
            maxLength: 8000
          amplitude:
            type: string
            maxLength: 8000
          long_edge:
            type: string
            maxLength: 8000
          seed:
            type: number
            minimum: -1.0
            maximum: 4294967295.0
          reference-speedup:
            type: boolean
          convert-format:
            type: string
            maxLength: 8000
        additionalProperties: false
      confirmation: never
  aaat:
    schema: ai2apps.mini-app-host-exports/v1
    exports:
    - name: image.frozen_time
      host: ai2apps.imagine-studio
      inputSchema:
        type: object
        additionalProperties: false
        required:
        - image_id
        - trajectory
        properties:
          image_id:
            type: string
            minLength: 1
            maxLength: 256
            x-ai2apps-asset:
              storage: artifact
              accept: image/*
              references: true
          trajectory:
            type: object
          depth:
            enum:
            - da
            - vggt
            default: vggt
          output:
            enum:
            - html
            - mp4
            - live-photo
            default: mp4
          long_edge:
            enum:
            - 512
            - 768
            default: 768
          reference_speedup:
            type: boolean
            default: true
          seed:
            type: integer
            minimum: -1
            maximum: 4294967295
            default: -1
          audio_id:
            type: string
            minLength: 1
            maxLength: 256
            x-ai2apps-asset:
              storage: artifact
              accept: audio/*
              references: true
      fields:
      - key: image_id
        label:
          zh: 图片
          en: Image
        type: asset
        storage: artifact
        accept: image/*
        references: true
        multiple: false
        minItems: 0
        maxItems: 1
      - key: trajectory
        label:
          zh: 镜头帧计划
          en: Camera frame plan
        type: json
      - key: depth
        label:
          zh: 几何模型
          en: Geometry model
        type: select
        options:
        - value: da
          label: da
        - value: vggt
          label: vggt
        default: vggt
      - key: output
        label:
          zh: 输出格式
          en: Output format
        type: select
        options:
        - value: html
          label: html
        - value: mp4
          label: mp4
        - value: live-photo
          label: live-photo
        default: mp4
      - key: long_edge
        label:
          zh: 分辨率长边
          en: Long edge
        type: select
        options:
        - value: 512
          label: '512'
        - value: 768
          label: '768'
        default: 768
      - key: reference_speedup
        label:
          zh: 参考视频提速
          en: Reference speedup
        type: boolean
        default: true
      - key: seed
        label:
          zh: 随机种子
          en: Seed
        type: number
        default: -1
      - key: audio_id
        label:
          zh: MP4 音轨
          en: MP4 soundtrack
        type: asset
        storage: artifact
        accept: audio/*
        references: true
        multiple: false
        minItems: 0
        maxItems: 1
      displayName:
        zh: 静止时间
        en: Frozen Time
      summary:
        zh: 使用当前镜头轨迹生成静止时间，结果进入共享输出。
        en: Generate Frozen Time with the current camera plan and shared Output.
      agentContext:
        schema: ai2apps.aaat-declaration/v1
        instructions:
        - Use actual current Mini-App draft/model/material IDs. Never invent models
          or raw paths. Reuse the original durable Studio task and host shared Output;
          page closure is not cancellation. Missing models require Desktop configuration
          with inputs preserved. Unknown submission outcomes must not be replayed.
        result_semantics:
          artifact: Actual owner-published media or output references; UI snapshots
            are not generated artifacts.
          shared_output: Only a completed published owner task proves an output exists.
            Output references belong to the original Studio host.
      selectionRequired: false
      sdk: studio.camera-motion/v1
      options: {}
      interfaceVersion: 1.0.0
