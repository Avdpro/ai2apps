schema: ai2apps.service/v1
id: ai2apps.model.ornith15-35b-a3b-4bit-vision
name: Ornith 1.5 35B A3B 4-bit Vision
description: Multimodal Ornith 1.5 Worker with full and exact Cached-MoE execution.
version: 0.1.0
publisher: {id: ai2apps}
runtime:
  mode: process
  protocol: ai2apps-model-worker/v1
  provider: ai2apps.runtime.omlx
  adapter: src/worker_adapter.py:create_adapter
models:
  - id: ai2apps.model.ornith15-35b-a3b-4bit-vision/ornith-1.5-35b-a3b-mlx-4bit-vision
    display_name: Ornith 1.5 35B A3B 4-bit Vision
    model_type: vlm
    upstream_id: Avdpro/Ornith-1.5-35B-A3B-MLX-4bit-Vision
    capabilities: [work, conversation, image_recognition]
    weights:
      provider: huggingface
      repo_id: Avdpro/Ornith-1.5-35B-A3B-MLX-4bit-Vision
      revision: 31428ce8829c277f9255c59662b8efab58898ecf
      distribution_id: dist_ai2apps_ornith1_5_35b_a3b_mlx_4bit_vision_31428ce8_v1
      preparation:
        recipe: ai2apps/cache-moe/v1
        install_id: ornith-1.5-35b-a3b-mlx-4bit-vision
        family: qwen3_6
        execution_modes: [full, cached]
        default_execution_mode: full
        storage_policies: [keep_source]
        engine:
          id: ornith1.5-qwen3.6-vlm
          name: Ornith 1.5 Qwen3.6 VLM
          version: 1
          scope_asset: src/omlx_model_ornith15_35b_a3b_4bit_vision/assets/scope-profile.json
          scope_pack: src/omlx_model_ornith15_35b_a3b_4bit_vision/assets/scope-pack.json
          scope_env: OMLX_QWEN36_SCOPE_PROFILE
        scope_name: general
        conversion: {format: omlx-moe-expert-major-set, version: 1, variant: qwen3.6-affine-q4-gate-up-fused-direct-v3}
        arena_tail_slots: 32
        memory_tiers:
          - {id: compact, label: Compact, experts: 160, estimated_gb: 20}
          - {id: performance, label: Performance, experts: 192, estimated_gb: 22}
    metadata:
      family: qwen3_6
      quantization: 4bit-affine
      execution_modes: [full, cached]
      default_execution_mode: full
      preparation: cache-moe
      multimodal: true
capabilities: []
requires:
  services:
    - id: ai2apps.runtime.omlx
      version: ">=1.5.6,<2.0.0"
      optional: false
      capabilities: [mlx, model-worker-v1, cached-moe, vlm]
  python: ">=3.11,<3.14"
permissions:
  network: {outbound: false}
  model_weights:
    huggingface_cache: read
    reason: Read only the Host-selected pinned Ornith checkpoint and prepared expert store.
  accelerator: {metal: true, reason: Run the oMLX multimodal engine on Apple GPU.}
compatibility: {os: [macos], architectures: [arm64], minimum_os_version: "26.2"}
health: {path: /health, startup_timeout_seconds: 30}
restart: {max_attempts: 2, base_delay_seconds: 1}
tools: []
