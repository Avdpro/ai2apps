schema: ai2apps.service/v1
id: ai2apps.model.flux2-klein-mlx
name: FLUX.2 Klein MLX
description: Optimized local FLUX.2 Klein text-to-image and multi-reference editing on MLX.
version: 0.1.3
publisher: {id: ai2apps}
license: {name: Apache License 2.0, id: Apache-2.0, path: LICENSE}
runtime:
  mode: process
  protocol: ai2apps-model-worker/v1
  provider: ai2apps.runtime.omlx
  adapter: src/worker_adapter.py:create_adapter
models:
  - id: ai2apps.model.flux2-klein-mlx/4b
    display_name: FLUX.2 Klein 4B MLX
    model_type: image_generation
    upstream_id: black-forest-labs/FLUX.2-klein-4B
    capabilities: [image_generation, image_edit, multi_reference, local, mlx]
    weights:
      provider: huggingface
      repo_id: black-forest-labs/FLUX.2-klein-4B
      revision: e7b7dc27f91deacad38e78976d1f2b499d76a294
      distribution_id: dist_ai2apps_flux2_klein_4b_e7b7dc27_v1
      preparation: {recipe: native}
    metadata:
      family: flux2-klein
      variant: 4b
      implementation: mflux-mlx-optimized
      mflux_version: 0.19.0
      modelscope:
        repo_id: black-forest-labs/FLUX.2-klein-4B
        revision: 2bc2e0f64332317d1315dbc51d536f05b75df847
        preferred: true
        allow_patterns: ["vae/*", "transformer/*", "text_encoder/*", "tokenizer/**", added_tokens.json, chat_template.jinja, model_index.json]
      device_recommendation: {minimum_memory_gib: 16, preferred_memory_gib: 24, quality_rank: 4}
    image_capabilities: &image_capabilities
      schema: ai2apps.image-capabilities/v1
      operations: [image_generation, image_edit]
      formats: {input: [png, jpeg, webp], output: [png, jpeg, webp]}
      geometry:
        minimum: {width: 256, height: 256}
        maximum: {width: 2048, height: 2048}
        multiple_of: 32
        ratios: ["1:1", "4:3", "3:4", "16:9", "9:16"]
      defaults: {width: 1024, height: 1024, steps: 4, guidance: 1.0, output_format: png}
      execution: {quantizations: [q8, bf16, q4], compiled_denoiser: true, persistent_quantized_cache: true, edit_kv_cache: true, max_concurrency_per_device: 1}
capabilities: [image-generation, image-edit, flux2-klein]
requires:
  services:
    - id: ai2apps.runtime.omlx
      version: ">=1.5.0,<2.0.0"
      optional: false
      capabilities: [mlx, model-worker-v1, metal, image-generation, image-edit, flux2-klein]
  python: ">=3.11,<3.14"
permissions:
  network: {outbound: false}
  model_weights: {huggingface_cache: read, reason: Read only the Host-selected pinned FLUX.2 checkpoint.}
  accelerator: {metal: true, reason: Run native MLX image generation and editing.}
compatibility: {os: [macos], architectures: [arm64], minimum_os_version: "26.2"}
health: {path: /health, startup_timeout_seconds: 180}
restart: {max_attempts: 2, base_delay_seconds: 2}
tools: []
