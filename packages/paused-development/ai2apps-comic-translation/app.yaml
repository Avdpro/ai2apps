schema: ai2apps.app/v1
id: ai2apps.comic-translation
name: Comic Translation
version: 0.1.3
description: Translate and typeset comic pages.
publisher: {id: ai2apps}
instances: {mode: singleton, scope: user}
entry: {kind: sandbox, resource: web/index.html}
navigation: {launcher: false}
localizations:
  zh-CN: {name: 漫画翻译, description: 批量翻译漫画并导出离线双语阅读器。}
mini_apps:
  - schema: ai2apps.mini-app/v1
    id: ai2apps.imagine.comic-translation
    name: Comic Translation
    version: 0.1.3
    kind: project
    icon: languages
    description: Translate comic pages, review dialogue, and export PNGs or an offline reader.
    catalog: {categories: [image]}
    entry: {kind: sandbox, resource: web/index.html, placements: [inline, sidebar]}
    placements: [{studio: ai2apps.imagine-studio, category: edit, order: 145}]
    inputs: [{id: pages, kind: image, multiple: true}]
    outputs: [{id: page, kind: image, final: true}, {id: reader, kind: file, final: true}]
    requirements: {capabilities: [comic.translation]}
    localizations:
      zh-CN: {name: 漫画翻译, description: 批量识别和翻译气泡文字，导出 PNG 或离线翻页 HTML。}
    aaat:
      schema: ai2apps.mini-app-host-exports/v1
      exports:
        - name: imagine.translate_comic
          interfaceVersion: 1.0.0
          host: ai2apps.imagine-studio
          sdk: studio.comic-translation/v1
          displayName: {zh: 翻译漫画, en: Translate comic pages}
          summary: {zh: 识别并翻译漫画对白，排版后导出 PNG 或离线双语阅读器。, en: Translate and typeset comic pages as PNGs or an offline bilingual reader.}
          selectionRequired: false
          options: {}
          inputSchema:
            type: object
            additionalProperties: false
            required: [image_ids]
            properties:
              image_ids:
                type: array
                minItems: 1
                maxItems: 50
                uniqueItems: true
                items:
                  type: string
                  pattern: '^(art|attc|gala)_[A-Za-z0-9_-]+$'
                  maxLength: 200
                  x-ai2apps-asset: {storage: artifact, accept: 'image/png,image/jpeg,image/webp', references: true}
              language: {type: string, enum: [en, zh, ja, ko, es, fr], default: en}
              format: {type: string, enum: [png, html], default: png}
              direction: {type: string, enum: [auto, vertical, horizontal], default: auto}
              auto_crop: {type: boolean, default: true}
              page_context: {type: boolean, default: true}
              profile: {type: string, minLength: 1, maxLength: 80}
              model_id: {type: string, minLength: 1, maxLength: 255}
          fields:
            - {key: image_ids, label: {zh: 漫画页, en: Comic pages}, type: asset, storage: artifact, accept: 'image/png,image/jpeg,image/webp', references: true, multiple: true, minItems: 1, maxItems: 50}
            - {key: language, label: {zh: 目标语言, en: Target language}, type: select}
            - {key: format, label: {zh: 导出格式, en: Output format}, type: select}
            - {key: direction, label: {zh: 原文方向, en: Source layout}, type: select}
            - {key: auto_crop, label: {zh: 自动裁切, en: Auto-crop}, type: boolean}
            - {key: page_context, label: {zh: 参考前后页, en: Use adjacent pages}, type: boolean}
            - {key: profile, label: {zh: 译名 Profile, en: Translation profile}, type: text}
            - {key: model_id, label: {zh: 翻译模型, en: Translation model}, type: model}
          agentContext:
            schema: ai2apps.aaat-declaration/v1
            instructions:
              - Use verified image attachment or artifact references from the current session or explicitly selected owned Gallery images in reading order.
              - Use the requested target language or infer it from the request. Default to English when no translation destination is indicated.
              - Use PNG, automatic direction and cropping, and adjacent-page context by default. Use HTML for a requested offline reader.
              - Omit the optional model and profile unless requested. If images are already supplied, invoke directly. Open material selection only when image references are missing or ambiguous.
              - Respect permission or configuration errors. Surface layout warnings with their page numbers and reuse completed outputs.
            result_semantics:
              files: Finished media attached to the caller session and retained in Imagine Studio Output.
              warnings: Pages or regions left with original content when detection or typesetting could not place a translation.
