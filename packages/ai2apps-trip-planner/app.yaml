                  "arguments": {
                    "preparation_only": true,
                    "goal": "Confirm the hotel destination search includes the requested hotel_area landmark/neighborhood in the requested city, not only the whole city. Select its matching autocomplete suggestion and submit Search if needed. Verify the exact check-in/check-out dates and adult count. Do not choose unrelated locations, hotel rooms, reservations or any booking/payment control. If already applied, inspect the criteria before completing.",
