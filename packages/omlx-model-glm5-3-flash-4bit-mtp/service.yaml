    display_name: GLM-5.3 Flash 4-bit MTP
    model_type: vlm
    upstream_id: Vontra/GLM-5.3-Flash-MLX-4bit-MTP
    capabilities: [work, conversation, image_recognition]
    weights:
      provider: huggingface
      repo_id: Vontra/GLM-5.3-Flash-MLX-4bit-MTP
