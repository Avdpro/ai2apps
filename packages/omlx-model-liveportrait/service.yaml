schema: ai2apps.service/v1
id: ai2apps.model.liveportrait-mlx
name: MLX LivePortrait
description: Native MLX reference-portrait and driving-video animation on Apple Silicon.
version: 0.1.0
publisher: {id: ai2apps}
license: {name: MIT License, id: MIT, path: LICENSE}
attribution:
  notice: META/NOTICE.md
  upstream: https://github.com/KwaiVGI/LivePortrait
  checkpoint: https://huggingface.co/Avdpro/MLX-LivePortrait
runtime:
  mode: process
  protocol: ai2apps-model-worker/v1
  provider: ai2apps.runtime.omlx
  adapter: src/worker_adapter.py:create_adapter
models:
  - id: ai2apps.model.liveportrait-mlx/default
    display_name: MLX LivePortrait
    model_type: video_generation
    upstream_id: Avdpro/MLX-LivePortrait
    capabilities: [video_generation, portrait_animation, reference_image, driving_video, preserve_audio]
    weights:
      provider: huggingface
      repo_id: Avdpro/MLX-LivePortrait
      revision: 2bccacd9a89eb4b9d41d3664adc88011a3d5abfb
      distribution_id: dist_ai2apps_mlx_liveportrait_2bccacd9_v1
      preparation: {recipe: native}
    metadata:
      family: liveportrait
      implementation: native-mlx
      upstream_revision: 82a4fa6735ca58432b6ce39301b4b9ee066dea47
      native_port_commit: d5361f4806c14fe2051eecb1dd5a89930f46db0d
      checkpoint_layout: ai2apps.mlx-liveportrait-checkpoint/v1
      modelscope:
        repo_id: ai2apps/MLX-LivePortrait
        revision: 998f93495e933df9bd5eff2d612662c2e4c195a7
        preferred: true
        allow_patterns: &liveportrait_files
          - LICENSE
          - YUNET_LICENSE
          - NOTICE.md
          - README.md
          - ai2apps-checkpoint.json
          - conversion-receipt.json
          - models/face_detection_yunet_2023mar.omlx/bundle.json
          - models/face_detection_yunet_2023mar.omlx/graph.json
          - models/face_detection_yunet_2023mar.omlx/weights.safetensors
          - weights/appearance_feature_extractor.npz
          - weights/motion_extractor.npz
          - weights/spade_generator.npz
          - weights/warping_module.npz
          - weights/stitching.npz
          - weights/stitching_eye.npz
          - weights/stitching_lip.npz
    video_capabilities:
      schema: ai2apps.video-capabilities/v1
      operations: [video_generation]
      content_combinations:
        - id: reference_image_driving_video
          required:
            - {type: image_url, role: reference_image, min: 1, max: 1}
            - {type: video_url, role: reference_video, min: 1, max: 1}
          optional: []
          unsupported_roles: [prompt, negative_prompt, first_frame, last_frame, mask, source_video, reference_audio, driving_audio, soundtrack]
      formats:
        image_input: [png, jpeg, webp]
        audio_input: []
        video_input: [mp4, mov, webm]
        video_output: [mp4]
        video_codecs: [h264]
        audio_codecs: [aac]
      geometry: {resolutions: [source], ratios: [source], framespersecond: [10, 15, 24, 25, 30, 50, 60], alpha: false}
      duration: {mode: driving_video, minimum_seconds: 0.04, maximum_seconds: null, long_video: native, native_window_frames: null}
      audio: {modes: [auto, none, preserve_driving_audio], default_mode: auto, generated_audio: false}
      presets:
        - {id: quality, display_name: Quality FP32, deterministic: true, approximate: false, cancellable: true, resumable: unsupported}
        - {id: fast, display_name: Fast BF16, deterministic: true, approximate: true, cancellable: true, resumable: unsupported}
      defaults: {resolution: source, ratio: source, framespersecond: 25, preset: quality, output_format: mp4, audio_output_mode: auto}
      execution:
        asynchronous: true
        streaming_preview: false
        progress: phase
        max_concurrency_per_device: 1
        memory_profiles:
          compact: {minimum_unified_memory_gib: 16, resolutions: [source]}
          standard: {minimum_unified_memory_gib: 24, resolutions: [source]}
capabilities: [video-generation]
requires:
  services:
    - id: ai2apps.runtime.omlx
      version: ">=1.6.2,<2.0.0"
      optional: false
      capabilities: [mlx, model-worker-v1, metal, video-generation, video-codecs, audio-codecs]
  python: ">=3.11,<3.14"
permissions:
  network: {outbound: false}
  model_weights: {huggingface_cache: read, reason: Read only the Host-selected pinned MLX LivePortrait checkpoint.}
  accelerator: {metal: true, reason: Run native portrait animation locally with MLX.}
compatibility: {os: [macos], architectures: [arm64], minimum_os_version: "26.2"}
health: {path: /health, startup_timeout_seconds: 120}
restart: {max_attempts: 2, base_delay_seconds: 1}
tools: []
