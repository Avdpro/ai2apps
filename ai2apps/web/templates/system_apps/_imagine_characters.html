<section class="is-character-library" x-show="currentMiniApp.needsImages && !isAdjustMode && !isUpscaleMode" x-cloak x-effect="if(isCharacterMode && !characterLoaded && !characterBusy) loadCharacters()">
    <details x-show="!isCharacterMode" x-effect="if(!isCharacterMode&&!characterSharedLoaded&&!characterSharedBusy)loadSharedCharacterDefinitions()">
        <summary x-text="characterText('选择角色／形象','Choose character / appearance')"></summary>
        <p class="is-character-hint" x-text="characterText('使用已定稿形象的一张定义图和说明。','Use one finalized definition image and its guide.')"></p>
        <div class="is-character-grid"><label class="vs-field"><span x-text="characterText('角色','Character')"></span><select x-model="sharedCharacterId" @change="selectSharedCharacter()"><template x-for="c in characterSharedItems" :key="c.id"><option :value="c.id" x-text="c.name"></option></template></select></label><label class="vs-field"><span x-text="characterText('形象','Appearance')"></span><select x-model="sharedAppearanceId"><template x-for="a in (sharedCharacter?.appearances||[])" :key="a.id"><option :value="a.id" x-text="a.name"></option></template></select></label></div>
        <template x-if="sharedAppearance"><div class="is-character-shared-preview"><img :src="'/v1/platform/gallery/assets/'+encodeURIComponent(sharedAppearance.definition_image_id)+'/content'" :alt="sharedAppearance.name"><p x-text="sharedAppearance.summary"></p></div></template>
        <p x-show="characterSharedLoaded&&!characterSharedItems.length" class="is-character-hint" x-text="characterText('还没有已定稿形象，请先在角色设计中选择定义图、填写说明并定稿。','No finalized appearance. Choose a definition image, write a guide and finalize in Character Design first.')"></p>
        <div class="is-character-row"><button class="vs-button" type="button" @click="loadSharedCharacterDefinitions()" :disabled="characterSharedBusy" x-text="characterText('刷新角色库','Refresh character library')"></button><button class="vs-button" type="button" @click="useSharedCharacterDefinition()" :disabled="!sharedAppearance||generating||characterSharedBusy" x-text="characterText('使用此形象','Use this appearance')"></button></div>
    </details>
    <details :open="isCharacterMode" x-show="isCharacterMode">
        <summary x-text="characterText('共享角色库','Shared character library')"></summary>
        <p class="is-character-hint" x-text="characterText('同一角色可以保存日常、大头卡通、超级英雄等多套形象。保存后可在其它绘图 Mini-App 中引用。','Save multiple looks for one identity, then reuse them in other image Mini-Apps.')"></p>
        <div class="is-character-row">
            <label class="vs-field"><span x-text="characterText('角色','Character')"></span><select x-model="characterId" @change="chooseCharacter()" :disabled="characterSlotSwitching||characterBusy"><option value="" x-text="characterText('选择角色','Choose character')"></option><template x-for="c in characterItems" :key="c.id"><option :value="c.id" x-text="c.name"></option></template></select></label>
            <button class="vs-button" type="button" @click="newCharacter()" :disabled="characterSlotSwitching||characterBusy" x-text="characterText('新建角色','New character')"></button>
            <button class="vs-button" type="button" @click="loadCharacters()" :disabled="characterBusy" x-text="characterText('刷新','Refresh')"></button>
        </div>
        <div class="is-character-row">
            <input x-ref="characterArchiveInput" type="file" accept=".zip,application/zip" hidden @change="inspectCharacterArchive($event.target.files[0]);$event.target.value=''">
            <button class="vs-button" type="button" @click="$refs.characterArchiveInput.click()" :disabled="characterArchiveBusy||characterBusy||generating" x-text="characterText('导入角色 ZIP','Import character ZIP')"></button>
            <button class="vs-button" type="button" @click="exportCharacterArchive()" :disabled="!characterDraft||characterArchiveBusy||characterBusy||generating" x-text="characterText('导出角色 ZIP','Export character ZIP')"></button>
            <button class="vs-button" type="button" @click="exportCharacterArchive(true)" :disabled="!characterAppearance||characterArchiveBusy||characterBusy||generating" x-text="characterText('导出当前形象 ZIP','Export appearance ZIP')"></button>
        </div>
        <dialog class="is-character-import-dialog" x-ref="characterImportDialog" @cancel="characterArchiveFile=null;characterArchivePreview=null">
            <h2 x-text="characterText('导入角色','Import character')"></h2>
            <template x-if="characterArchivePreview"><div><h3 x-text="characterArchivePreview.name"></h3><p x-text="characterArchivePreview.appearance_count+characterText(' 个形象，',' appearances, ')+characterArchivePreview.image_count+characterText(' 张图片',' images')"></p><div class="is-character-generated-grid"><template x-for="(thumb,i) in characterArchivePreview.thumbnails" :key="i"><figure><img :src="thumb.image" :alt="thumb.name"><figcaption x-text="thumb.name"></figcaption></figure></template></div></div></template>
            <p x-text="characterText('将创建独立副本；同名自动添加后缀，不覆盖已有角色。','Creates an independent copy. Duplicate names get a suffix; existing characters are preserved.')"></p>
            <div class="is-character-row"><button type="button" class="vs-button" @click="cancelCharacterImport()" :disabled="characterArchiveBusy" x-text="characterText('取消','Cancel')"></button><button type="button" class="vs-button" @click="importCharacterArchive()" :disabled="characterArchiveBusy" x-text="characterText('导入为副本','Import as a copy')"></button></div>
        </dialog>
        <template x-if="characterDraft"><div class="is-character-editor">
            <div class="is-character-grid">
                <label class="vs-field"><span x-text="characterText('角色名称','Character name')"></span><input maxlength="100" x-model="characterDraft.name"></label>
                <label class="vs-field"><span x-text="characterText('别名（逗号分隔）','Aliases (comma separated)')"></span><input :value="characterDraft.aliases.join(', ')" @change="characterDraft.aliases=$event.target.value.split(/[,，]/).map(s=>s.trim()).filter(Boolean).slice(0,20)"></label>
            </div>
            <label class="vs-field"><span x-text="characterText('身份与不变特征','Identity and distinguishing features')"></span><textarea rows="3" maxlength="4000" x-model="characterDraft.description"></textarea></label>
            <div class="is-character-row"><label class="vs-field"><span x-text="characterText('形象设定','Appearance')"></span><select :value="appearanceId" @change="selectCharacterAppearance($event.target.value); $event.target.value=appearanceId" :disabled="characterDeriving||characterSlotSwitching||characterBusy"><option value="__new__" :disabled="characterDraft.appearances.length>=50" x-text="characterText('创建新形象','Create new appearance')"></option><template x-for="a in characterDraft.appearances" :key="a.id"><option :value="a.id" x-text="a.name || characterText('未命名形象','Untitled appearance')"></option></template></select></label><button class="vs-button" type="button" @click="deriveCharacterAppearance()" :disabled="characterDraft.appearances.length>=50||characterDeriving||characterSlotSwitching||characterBusy||!characterDerivationImage" x-text="characterText('派生形象','Derive appearance')"></button></div>
            <template x-if="characterAppearance"><div class="is-character-editor">
                <template x-if="isCharacterMode">{% include "system_apps/_imagine_reference_slots.html" %}</template>
                <div class="is-character-grid">
                    <label class="vs-field"><span x-text="characterText('形象名称','Appearance name')"></span><input maxlength="100" x-model="characterAppearance.name"></label>
                    <div class="vs-field"><span x-text="characterText('风格','Style')"></span><div class="is-character-style-field"><input :aria-label="characterText('风格','Style')" maxlength="2000" :value="characterStyleLabel" @input="characterAppearance.style=$event.target.value;characterAppearance.style_id=''" :placeholder="characterText('例如：大头卡通','e.g. chibi illustration')"><button type="button" class="vs-button" @click="openStyleDialog('character')" :aria-label="characterText('选择形象风格','Choose appearance style')" :title="characterText('选择形象风格','Choose appearance style')">...</button></div></div>
                    <div class="vs-field"><span x-text="characterText('身形比例','Body proportions')"></span><div class="is-character-proportions"><input :aria-label="characterText('身形比例','Body proportions')" maxlength="500" x-model="characterAppearance.proportions" :placeholder="characterText('输入自定义比例，或选择预设','Enter custom proportions or choose a preset')"><select :aria-label="characterText('比例预设','Proportion presets')" @change="if($event.target.value)characterAppearance.proportions=$event.target.value; $event.target.value=''" :value="''"><option value="" x-text="characterText('选择预设…','Choose preset…')"></option><template x-for="preset in characterProportionPresets" :key="preset"><option :value="preset" x-text="preset"></option></template></select></div></div>
                </div>
                <label class="vs-field"><span x-text="characterText('衣着与装备','Outfit and equipment')"></span><textarea rows="2" maxlength="2000" x-model="characterAppearance.outfit"></textarea></label>
                <label class="vs-field"><span x-text="characterText('其它形象要求','Appearance details')"></span><textarea rows="2" maxlength="4000" x-model="characterAppearance.description"></textarea></label>
                <label class="vs-field"><span x-text="characterText('形象说明（可编辑）','Appearance guide (editable)')"></span><textarea rows="5" maxlength="6000" x-model="characterAppearance.summary"></textarea></label>
                <div class="is-character-row"><button class="vs-button" type="button" @click="generateCharacterDescription()" :disabled="characterTextBusy || !characterDraft.name.trim() || !characterAppearance.name.trim()" x-text="characterTextBusy?characterText('正在生成说明…','Writing guide…'):characterText('AI 生成说明','Generate guide with AI')"></button><span class="is-character-hint" x-text="characterText('首次绘制会自动生成说明；也可手动生成或编辑，保存后随 JSON 导出。参数变更后可重新生成。','The first rendering writes a guide automatically. You can also generate or edit it here; save for JSON export. Regenerate after parameter changes.')"></span></div>
                <label class="vs-field"><span x-text="characterText('形象定义图（导出使用此图）','Appearance definition image (used for export)')"></span></label>
                <div class="is-image-slot" x-init="$nextTick(()=>AI2AppsAssetSlot.bind($el,{select:file=>setCharacterDefinitionFile(file),clear:()=>{characterAppearance.definition_image_id='';characterAppearance.approved=false},drop:event=>dropCharacterDefinition(event),error:error=>fail(error)}))" x-effect="const state={preview:characterAppearance.definition_image_id?'/v1/platform/gallery/assets/'+encodeURIComponent(characterAppearance.definition_image_id)+'/content':'',disabled:characterBusy,label:characterText('形象定义图','Appearance definition image'),clearLabel:tr('remove')};$nextTick(()=>$el.assetSlot?.update(state))"><input type="file" accept="image/png,image/jpeg,image/webp"><img hidden alt=""><span data-slot-empty><i data-lucide="image-plus"></i><strong x-text="characterText('选择或拖入一张形象定义图','Choose or drop one appearance definition image')"></strong></span><button hidden type="button" :aria-label="tr('remove')"><i data-lucide="x"></i></button></div>
                <details x-show="characterAppearance.generated_images?.length"><summary x-text="characterText('已生成的形象图','Generated appearance images')+' ('+(characterAppearance.generated_images?.length||0)+')'"></summary><div class="is-character-generated-grid"><template x-for="image in (characterAppearance.generated_images||[])" :key="image.artifact_id"><div><img loading="lazy" :src="'/v1/platform/gallery/assets/'+encodeURIComponent(image.asset_id)+'/content'" :alt="characterAppearance.name"><small x-text="characterText('来源形象版本：','Source appearance revision: ')+image.appearance_revision"></small><button class="vs-button" type="button" @click="useGeneratedCharacterImage(image)" x-text="characterText('设为形象定义图','Use as appearance definition')"></button><button class="vs-button" type="button" @click="removeGeneratedCharacterImage(image)" :disabled="characterBusy" :title="characterText('移除此形象图关联，保留 Output 和 Gallery 原文件','Unlink this image; keep original Output and Gallery files')" x-text="characterText('删除','Delete')"></button></div></template></div></details>
                <p class="is-character-hint" x-show="characterCollectError" x-text="characterCollectError"></p><button x-show="characterCollectError" class="vs-button" type="button" @click="retryCharacterCollection()" x-text="characterText('重试关联图片（不重新生成）','Retry image attachment (no regeneration)')"></button>
                <p class="is-character-hint" x-text="characterText('参考图数量：','References: ')+characterAppearance.reference_ids.length+' · '+characterText('形象版本：','Appearance revision: ')+(characterAppearance.revision||0)"></p>
                <div class="is-character-row">
                    <button class="vs-button" type="button" @click="rememberCharacterReferences()" :disabled="characterBusy || !referenceFiles.some(Boolean)" x-text="characterText('将当前素材槽保存为参考图','Save current Slots as references')"></button>
                    <button class="vs-button" type="button" @click="useCharacterAppearance()" :disabled="!characterAppearance.definition_image_id&&!characterAppearance.reference_ids.length" x-text="characterText('使用此形象','Use this appearance')"></button>
                    <button class="vs-button" type="button" @click="saveCharacterOutput()" :disabled="characterBusy || activeArtifact?.kind!=='image'" x-text="characterText('将 Output 选中图片设为形象定义图','Use selected Output image as definition')"></button>
                </div>
                <label class="is-character-check"><input type="checkbox" x-model="characterAppearance.approved" x-effect="if(!characterAppearance.definition_image_id||!characterAppearance.summary?.trim())characterAppearance.approved=false" :disabled="!characterAppearance.definition_image_id||!characterAppearance.summary?.trim()"><span x-text="characterText('已定稿，可供 App、Mini-App 和 Bot 等使用','Finalized for use by Apps, Mini-Apps, Bots and more')"></span></label>
                <label class="is-character-check"><input type="checkbox" :checked="characterDraft.default_appearance_id===appearanceId" @change="if($event.target.checked)characterDraft.default_appearance_id=appearanceId"><span x-text="characterText('设为角色默认形象','Default appearance')"></span></label>
            </div></template>
            <button class="vs-button" type="button" @click="exportCharacterSettings()" :disabled="characterBusy" x-text="characterText('输出形象设定 JSON（一张图与描述）','Export appearance JSON (one image and description)')"></button>
            <button class="vs-button primary" type="button" @click="saveCharacter()" :disabled="characterBusy" x-text="characterText('保存角色与形象','Save character and appearances')"></button>
            <p class="is-character-hint" x-show="isCharacterMode" x-text="characterText('下方选择参考素材与绘图模型，点击生成制作多视角设定图；完成后选择一张生成图片作为形象定义图；输入参考图保留。修改已保存形象后需重新确认。','Choose references and an image model below to generate a reference sheet. Then save the selected Output as its reference. Changed appearances need confirmation again.')"></p>
        </div></template>
    </details>
</section>
