<section x-show="composerOpen" x-cloak class="knowledge-dialog knowledge-composer-dialog" role="dialog" aria-modal="true" aria-labelledby="knowledge-composer-title" @click.self="closeComposer()" @keydown.escape.window="composerOpen&&closeComposer()" @dragover.prevent="fileDrag=true" @dragleave.self="fileDrag=false" @drop.prevent.stop="fileDrag=false;draft.mode='file';addComposerFiles($event.dataTransfer.files)">
<form @submit.prevent="createItem()" :class="fileDrag&&'file-dragging'">
<header><div class="knowledge-composer-heading"><div><span class="knowledge-kicker">Knowledge Core</span><h2 id="knowledge-composer-title">{{ t('knowledge.composer.title') }}</h2></div><button type="button" @click="closeComposer()" aria-label="{{ t('knowledge.cancel') }}"><i data-lucide="x"></i></button></div><div class="knowledge-view-switch"><button type="button" :class="draft.mode==='file'&&'active'" @click="draft.mode='file'">{{ t('knowledge.composer.files') }}</button><button type="button" :class="draft.mode==='webpage'&&'active'" @click="draft.mode='webpage'">{{ t('knowledge.kind.webpage') }}</button><button type="button" :class="draft.mode==='note'&&'active'" @click="draft.mode='note'">{{ t('knowledge.kind.note') }}</button></div></header>
<div class="knowledge-composer-body">
<div x-show="draft.mode==='file'" class="knowledge-file-area"><label class="knowledge-checkbox"><input type="checkbox" x-model="mergeFiles"><span>{{ t('knowledge.composer.merge') }}</span></label><label x-show="mergeFiles" class="knowledge-checkbox"><input type="checkbox" x-model="detectOverlap"><span>{{ t('knowledge.composer.overlap') }}</span></label><label x-show="mergeFiles"><span>{{ t('knowledge.field.title') }}</span><input x-model.trim="groupTitle" maxlength="500" :placeholder="tr('knowledge.composer.merge_title')"></label><p x-show="mergeFiles" class="knowledge-field-help">{{ t('knowledge.composer.merge_help') }}</p><label class="knowledge-file-drop"><input type="file" multiple @change="addComposerFiles($event.target.files);$event.target.value=''" :disabled="busy"><i data-lucide="files"></i><strong>{{ t('knowledge.composer.drop') }}</strong><span>{{ t('knowledge.composer.formats') }}</span></label><div class="knowledge-file-previews"><template x-for="preview in composerPreviews" :key="preview.id"><article><img x-show="preview.url" :src="preview.url" :alt="preview.file.name"><pre x-show="preview.text" x-text="preview.text"></pre><i x-show="!preview.url&&!preview.text" data-lucide="file-text"></i><strong x-text="preview.file.name"></strong><small x-text="formatBytes(preview.file.size)"></small><button type="button" @click="removeComposerFile(preview.id)" :aria-label="tr('knowledge.composer.remove')"><i data-lucide="x"></i></button></article></template><div x-show="!composerPreviews.length" class="knowledge-preview-placeholder">{{ t('knowledge.composer.preview') }}</div></div><p class="knowledge-field-help">{{ t('knowledge.ocr.policy') }}</p></div>
<label x-show="draft.mode!=='file'"><span>{{ t('knowledge.field.title') }}</span><input x-ref="title" x-model.trim="draft.title" maxlength="500" :required="draft.mode==='note'"></label><label x-show="draft.mode==='note'"><span>{{ t('knowledge.field.text') }}</span><textarea x-model.trim="draft.text" maxlength="2000000" rows="8" :required="draft.mode==='note'"></textarea></label>
<label x-show="draft.mode==='webpage'"><span>{{ t('knowledge.field.source_url') }}</span><input x-model.trim="draft.sourceUrl" type="url" placeholder="https://" :disabled="draft.mode!=='webpage'" :required="draft.mode==='webpage'"></label><div x-show="draft.mode==='webpage'" class="knowledge-web-options"><label><span>{{ t('knowledge.web.fetch_mode') }}</span><select x-model="draft.fetchMode"><option value="auto">{{ t('knowledge.web.fetch_auto') }}</option><option value="acefox">{{ t('knowledge.web.fetch_acefox') }}</option><option value="static">{{ t('knowledge.web.fetch_static') }}</option></select></label><label class="knowledge-checkbox"><input type="checkbox" x-model="draft.autoAcceptCookies"><span>{{ t('knowledge.web.auto_cookies') }}</span></label><p class="knowledge-field-help">{{ t('knowledge.web.acefox_help') }}</p></div>
<div class="knowledge-form-row"><label><span>{{ t('knowledge.field.bucket') }}</span><select x-model="draft.bucketId"><option value="auto">{{ t('knowledge.composer.auto') }}</option><template x-for="bucket in buckets" :key="bucket.id"><option :value="bucket.id" x-text="bucketName(bucket)"></option></template></select></label><label x-show="draft.mode!=='file'"><span>{{ t('knowledge.field.tags') }}</span><input x-model="draft.tags" placeholder="{{ t('knowledge.tags.placeholder') }}"></label></div><p x-show="draft.bucketId==='auto'" class="knowledge-field-help">{{ t('knowledge.composer.auto_help') }}</p>
</div><footer><button type="button" @click="closeComposer()">{{ t('knowledge.cancel') }}</button><button class="knowledge-primary" type="submit" :disabled="busy||!draft.bucketId||(draft.mode==='file'?!composerFiles.length:draft.mode==='webpage'?!draft.sourceUrl:(!draft.title||!draft.text))"><i data-lucide="database-zap"></i>{{ t('knowledge.save') }}</button></footer>
</form></section>
