    <section x-show="previewAsset" x-cloak x-ref="previewDialog" tabindex="-1" class="gallery-preview-dialog" role="dialog" aria-modal="true" aria-label="{{ t('gallery.preview.aria') }}" @click.self="closePreview()">
        <header class="gallery-preview-head">
            <div class="gallery-preview-title">
                <span class="gallery-preview-type" x-text="kindLabel(previewAsset?.kind)"></span>
                <div x-show="!previewRenaming"><strong x-text="previewAsset?.name"></strong><button type="button" x-show="!previewReadOnly" @click="beginPreviewRename()" title="{{ t('gallery.action.rename') }}"><i data-lucide="pencil"></i></button></div>
                <form x-show="previewRenaming" @submit.prevent="savePreviewName()"><input x-ref="previewNameInput" x-model.trim="previewName" maxlength="512" aria-label="{{ t('gallery.preview.filename') }}"><button type="submit" :disabled="previewSavingName||!previewName"><i data-lucide="check"></i></button><button type="button" @click="previewRenaming=false"><i data-lucide="x"></i></button></form>
                <small><span x-text="previewPosition"></span><span> · </span><span x-text="formatSize(previewAsset?.size_bytes)"></span></small>
            </div>
            <div class="gallery-preview-tools">
                <template x-if="previewAsset?.kind==='image'"><div class="gallery-zoom-tools"><button type="button" @click="changePreviewZoom(-.25)" :disabled="previewZoom<=.25" title="{{ t('gallery.action.zoom_out') }}"><i data-lucide="zoom-out"></i></button><output x-text="Math.round(previewZoom*100)+'%'"></output><button type="button" @click="changePreviewZoom(.25)" :disabled="previewZoom>=6" title="{{ t('gallery.action.zoom_in') }}"><i data-lucide="zoom-in"></i></button><button type="button" @click="resetPreviewTransform()" title="{{ t('gallery.action.reset') }}"><i data-lucide="scan"></i></button></div></template>
                <a :href="previewAsset?contentUrl(previewAsset,true):'#'" download @click="downloadAsset($event,previewAsset)" title="{{ t('gallery.action.save_as') }}"><i data-lucide="download"></i><span>{{ t('gallery.action.download') }}</span></a>
                <button type="button" @click="closePreview()" title="{{ t('gallery.action.close') }}"><i data-lucide="x"></i></button>
            </div>
        </header>

        <div class="gallery-preview-stage">
            <button type="button" class="gallery-preview-nav previous" @click="movePreview(-1)" :disabled="!hasPreviousPreview" title="{{ t('gallery.action.previous') }}"><i data-lucide="chevron-left"></i></button>
            <div class="gallery-preview-media" :class="previewAsset?.kind">
                <template x-if="previewAsset?.kind==='image'"><img x-ref="previewImage" :src="contentUrl(previewAsset)" :alt="previewAsset.name" :style="previewImageTransform" draggable="false" @dblclick.prevent="togglePreviewZoom()" @wheel.prevent="wheelPreview($event)" @pointerdown="startPreviewPan($event)" @pointermove="movePreviewPan($event)" @pointerup="endPreviewPan($event)" @pointercancel="endPreviewPan($event)"></template>
                <template x-if="previewAsset?.kind==='video'"><video x-ref="previewVideo" :src="contentUrl(previewAsset)" controls playsinline autoplay></video></template>
                <template x-if="previewAsset?.kind==='audio'"><div class="gallery-audio-preview"><span><i data-lucide="audio-lines"></i></span><strong x-text="previewAsset.name"></strong><audio x-ref="previewAudio" :src="contentUrl(previewAsset)" controls autoplay></audio></div></template>
                <template x-if="previewAsset&&!['image','video','audio'].includes(previewAsset.kind)"><div class="gallery-generic-preview"><span><i :data-lucide="assetIcon(previewAsset)"></i></span><strong x-text="previewAsset.name"></strong><p>{{ t('gallery.preview.unavailable') }}</p></div></template>
            </div>
            <button type="button" class="gallery-preview-nav next" @click="movePreview(1)" :disabled="!hasNextPreview" title="{{ t('gallery.action.next') }}"><i data-lucide="chevron-right"></i></button>
        </div>
    </section>
