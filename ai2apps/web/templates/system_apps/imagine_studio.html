{% extends app_base_template|default("base.html") %}

{% block title %}Imagine Studio - AI2Apps{% endblock %}
{% block head %}<link rel="stylesheet" href="{{ static('css/video_studio.css') }}"><link rel="stylesheet" href="{{ static('css/imagine_studio.css') }}">{% endblock %}

{% block content %}
<div class="vs-app is-app" x-data="imagineStudioApp()" x-init="init()" data-app-id="ai2apps.imagine-studio" data-client-environment="{{ client_environment|default('browser') }}">
    <header class="vs-header">
        <div class="vs-brand"><span class="vs-logo is-logo"><i data-lucide="palette"></i></span><div><h1 x-text="tr('appName')"></h1><p x-text="tr('appSubtitle')"></p></div></div>
        <div class="vs-header-actions"><span class="vs-local" :class="usingLocalModel?'':'is-cloud'"><i :data-lucide="usingLocalModel?'hard-drive':'cloud'"></i><span x-text="generationModeLabel"></span></span><button x-show="!hasLocalModels" x-cloak class="vs-button" @click="configureLocalModel()" :disabled="configuringLocal"><span class="vs-state-icon" :class="{spin:configuringLocal}"><i :data-lucide="configuringLocal?'loader-circle':'package-plus'"></i></span><span x-text="tr(configuringLocal?'configuringLocal':'configureLocal')"></span></button><button class="vs-button" @click="refresh()" :disabled="refreshing"><span class="vs-state-icon" :class="{spin:refreshing}"><i data-lucide="refresh-cw"></i></span><span x-text="tr('refresh')"></span></button></div>
    </header>

    <div x-show="notice" x-cloak class="vs-notice" :class="noticeTone"><span x-text="notice"></span><button @click="notice=''"><i data-lucide="x"></i></button></div>

    <main class="vs-shell" @dragenter="handleWorkspaceDrag($event)" @dragover="handleWorkspaceDrag($event)" @dragleave="handleDragLeave($event)" @drop.prevent="handleGalleryDrop($event)">
        <nav class="vs-studio-sidebar" :aria-label="tr('workspaceNav')">
            <div class="vs-sidebar-switch" role="tablist" :aria-label="tr('pipelineAssets')">
                <button type="button" :class="leftView==='pipelines'&&'active'" @click="showLeftView('pipelines')" role="tab" :aria-selected="leftView==='pipelines'"><i data-lucide="workflow"></i><span>Pipeline</span></button>
                <button type="button" :class="leftView==='assets'&&'active'" @click="showLeftView('assets')" role="tab" :aria-selected="leftView==='assets'"><i data-lucide="images"></i><span x-text="tr('assets')"></span></button>
            </div>

            <section x-show="leftView==='pipelines'" class="vs-sidebar-panel vs-pipeline-list" :aria-label="tr('pipelineList')">
                <div class="vs-sidebar-heading"><span x-text="tr('installed')"></span><small x-text="pipelines.length"></small></div>
                <template x-for="pipeline in pipelines" :key="pipeline.id"><button type="button" class="vs-pipeline-card" :class="currentPipeline.id===pipeline.id&&'active'" @click="selectPipeline(pipeline.id)"><span class="vs-pipeline-icon"><i :data-lucide="pipeline.icon"></i></span><span><strong x-text="pipeline.name"></strong><small x-text="pipeline.summary"></small></span><i data-lucide="check" class="ready"></i></button></template>
                <div class="vs-sidebar-heading roadmap"><span x-text="tr('specializedPipeline')"></span><small x-text="tr('coming')"></small></div>
                <article class="vs-pipeline-card planned"><span class="vs-pipeline-icon"><i data-lucide="user-round-cog"></i></span><span><strong x-text="tr('characterDesign')"></strong><small x-text="tr('characterDesignSummary')"></small></span></article>
                <article class="vs-pipeline-card planned"><span class="vs-pipeline-icon"><i data-lucide="shopping-bag"></i></span><span><strong x-text="tr('productPhoto')"></strong><small x-text="tr('productPhotoSummary')"></small></span></article>
                <article class="vs-pipeline-card planned"><span class="vs-pipeline-icon"><i data-lucide="panels-top-left"></i></span><span><strong x-text="tr('comicStoryboard')"></strong><small x-text="tr('comicStoryboardSummary')"></small></span></article>
                <p class="vs-sidebar-note"><i data-lucide="code-2"></i><span x-text="tr('coderNote')"></span></p>
            </section>

            <section x-show="leftView==='assets'" x-cloak class="vs-sidebar-panel vs-assets-panel" :aria-label="tr('galleryAssets')">
                <div class="vs-sidebar-heading"><span>Gallery</span><button type="button" @click="openGallery()" :title="tr('openGallery')"><i data-lucide="external-link"></i></button></div>
                <div x-show="galleryMiniLoading" class="vs-gallery-state"><span class="vs-state-icon spin"><i data-lucide="loader-circle"></i></span><p x-text="tr('loadingGallery')"></p></div>
                <div x-show="galleryMiniError" class="vs-gallery-state error"><i data-lucide="image-off"></i><p x-text="galleryMiniError"></p><button class="vs-button" type="button" @click="mountGalleryMini(true)" x-text="tr('retry')"></button></div>
                <iframe x-ref="galleryMini" x-show="galleryMiniUrl&&!galleryMiniError" class="vs-gallery-mini" :src="galleryMiniUrl" title="Gallery Mini Entry" loading="lazy"></iframe>
                <p class="vs-gallery-help"><i data-lucide="grip"></i><span x-text="tr('galleryHelp')"></span></p>
            </section>
        </nav>

        <section class="vs-pipeline-workspace" :aria-label="tr('pipelineWebUI')">
            <header class="vs-pipeline-header"><div><span class="eyebrow" x-text="tr('currentPipeline')"></span><h2 x-text="currentPipeline.name"></h2><p x-text="tr('builtInPipeline')+' · '+currentPipeline.description"></p></div><span class="vs-pipeline-ready ready"><i :data-lucide="usingLocalModel?'hard-drive':'cloud-check'"></i><span x-text="generationModeLabel"></span></span></header>
            <section class="vs-create">
                <div class="vs-section-title"><div><span class="eyebrow" x-text="tr('create')"></span><h2 x-text="currentPipeline.actionTitle"></h2></div><span class="vs-model-state ready"><i data-lucide="circle"></i><span x-text="tr('modelReady')"></span></span></div>

                <div x-show="currentPipeline.needsImages" x-cloak class="is-reference-grid" :style="currentPipeline.maxImages===1?'grid-template-columns:1fr':''">
                    <template x-for="slot in currentPipeline.maxImages" :key="slot"><label class="vs-drop is-image-slot" :class="{'has-preview':referencePreviews[slot-1],'drag-target':gallerySlotTarget===slot-1}" :style="referenceSlotStyle(slot-1)" @dragenter.stop.prevent="enterGallerySlot(slot-1)" @dragover.stop.prevent="enterGallerySlot(slot-1)" @dragleave.stop="leaveGallerySlot($event,slot-1)" @drop.stop.prevent="handleGalleryDrop($event,slot-1)"><input type="file" accept="image/png,image/jpeg,image/webp" @change="setReference(slot-1,$event.target.files[0])"><img x-show="referencePreviews[slot-1]" :src="referencePreviews[slot-1]" :alt="tr('referenceAlt')" style="object-fit:contain;background:#111"><span x-show="!referencePreviews[slot-1]"><i data-lucide="image-plus"></i><strong x-text="slot===1?tr('primaryImage'):tr('referenceImage')+' '+slot"></strong><small x-text="slot===1&&currentPipeline.requiresImage?tr('required'):tr('optional')"></small></span><button x-show="referencePreviews[slot-1]" type="button" @click.prevent="clearReference(slot-1)"><i data-lucide="x"></i></button></label></template>
                </div>
                <p x-show="currentPipeline.needsImages" x-cloak class="is-cloud-disclosure"><i data-lucide="shield-check"></i><span x-text="tr(usingLocalModel?'localDisclosure':'cloudDisclosure')"></span></p>

                <label class="vs-field vs-prompt"><span><span x-text="tr('prompt')"></span> <small x-text="prompt.length+' / 32000'"></small></span><textarea x-model="prompt" maxlength="32000" :placeholder="currentPipeline.placeholder"></textarea></label>
                <div class="vs-controls is-controls">
                    <label class="vs-field"><span x-text="tr('model')"></span><select x-model="modelId"><template x-for="model in compatibleModels" :key="model.id"><option :value="model.id" x-text="model.label"></option></template></select><small x-text="tr('modelHint')"></small></label>
                    <label class="vs-field"><span x-text="tr('canvasSize')"></span><select x-model="size"><template x-for="option in sizeOptions" :key="option.value"><option :value="option.value" x-text="option.label"></option></template></select><small x-text="currentPipeline.mode==='edit'&&referenceDimensions[0]?tr('sourceImage')+' '+referenceDimensions[0].width+'×'+referenceDimensions[0].height+' · '+tr('matchedRatio'):modelSizeHint"></small></label>
                    <label class="vs-field"><span x-text="tr('quality')"></span><select x-model="quality"><option value="auto">Auto</option><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select></label>
                </div>
                <div x-show="size==='custom'" x-cloak class="is-custom-size">
                    <label class="vs-field"><span x-text="tr('width')"></span><input type="number" x-model.number="customWidth" :min="sizeCapability.width.min" :max="sizeCapability.width.max" :step="sizeCapability.width.multipleOf"><small x-text="tr('multipleOf',{value:sizeCapability.width.multipleOf})"></small></label>
                    <button type="button" @click="swapCustomSize()" :title="tr('swapSize')"><i data-lucide="arrow-left-right"></i></button>
                    <label class="vs-field"><span x-text="tr('height')"></span><input type="number" x-model.number="customHeight" :min="sizeCapability.height.min" :max="sizeCapability.height.max" :step="sizeCapability.height.multipleOf"><small x-text="tr('multipleOf',{value:sizeCapability.height.multipleOf})"></small></label>
                </div>
                <p x-show="sizeError" x-cloak class="is-size-message error"><i data-lucide="triangle-alert"></i><span x-text="sizeError"></span></p>
                <p x-show="!sizeError&&experimentalSize" x-cloak class="is-size-message warning"><i data-lucide="flask-conical"></i><span x-text="tr('experimentalSize')"></span></p>
                <details class="vs-advanced"><summary><span><i data-lucide="sliders-horizontal"></i><span x-text="tr('advanced')"></span></span><i data-lucide="chevron-down"></i></summary><div class="vs-advanced-grid"><label class="vs-field"><span x-text="tr('visualStyle')"></span><select x-model="style"><option value="" x-text="tr('unspecified')"></option><option value="photorealistic" x-text="tr('photorealistic')"></option><option value="illustration" x-text="tr('illustration')"></option><option value="anime" x-text="tr('anime')"></option><option value="ink" x-text="tr('ink')"></option><option value="product" x-text="tr('product')"></option></select></label><label class="vs-field"><span x-text="tr('outputFormat')"></span><select x-model="format"><template x-for="value in formatOptions" :key="value"><option :value="value" x-text="value.toUpperCase()"></option></template></select></label></div></details>
                <div class="vs-submit"><div><strong x-text="generationModeLabel"></strong><small x-text="submitHint"></small></div><button class="vs-generate" @click="generate()" :disabled="generating||!canGenerate"><span class="vs-state-icon" :class="{spin:generating}"><i :data-lucide="generating?'loader-circle':'sparkles'"></i></span><span x-text="generating?tr('generating'):tr('startGenerate')"></span></button></div>
            </section>
        </section>

        <aside class="vs-results vs-render-workspace" :aria-label="tr('renderWorkspace')">
            <div class="vs-result-head"><div><span class="eyebrow" x-text="tr('output')"></span><h2 x-text="tr('results')"></h2></div><button class="vs-icon-button" @click="clearResults()" :title="tr('clearHistory')"><i data-lucide="archive-x"></i></button></div>
            <div class="vs-preview is-image-preview" :class="!activeResult&&'empty'">
                <template x-if="activeResult"><img :src="activeResult.imageUrl" :alt="activeResult.prompt" :draggable="activeResult.status==='succeeded'" @dragstart="dragGeneratedImage($event,activeResult)" :title="tr('dragToGallery')"></template>
                <div x-show="!activeResult"><span><i data-lucide="image"></i></span><h3 x-text="tr('waiting')"></h3><p x-text="tr('waitingHint')"></p></div>
                <div x-show="activeResult" class="vs-preview-actions"><span class="vs-artifact-drag" :draggable="activeResult?.status==='succeeded'" @dragstart="dragGeneratedImage($event,activeResult)" :title="tr('dragToGallery')"><i data-lucide="grip-vertical"></i></span><button type="button" @click="addResultToGallery(activeResult)" :disabled="activeResult?.adding||activeResult?.galleryAssetId"><i :data-lucide="activeResult?.galleryAssetId?'check':'gallery-vertical-end'"></i><span x-text="activeResult?.galleryAssetId?tr('addedGallery'):tr('addGallery')"></span></button><a :href="activeDownloadUrl" :download="activeFilename" @click="downloadResult($event)"><i data-lucide="download"></i><span x-text="tr('download')"></span></a></div>
            </div>
            <div class="vs-queue-head"><div><h3 x-text="tr('generationHistory')"></h3><small x-text="tr('resultCount',{count:results.length})"></small></div><span x-show="generating" class="vs-live"><i></i><span x-text="tr(usingLocalModel?'localGenerating':'cloudGenerating')"></span></span></div>
            <div class="vs-queue is-image-queue"><div x-show="!results.length&&!generating" class="vs-empty"><i data-lucide="images"></i><h3 x-text="tr('noResults')"></h3><p x-text="tr('noResultsHint')"></p></div><template x-for="result in results" :key="result.id"><article class="vs-task" :class="result.status" :draggable="result.status==='succeeded'&&Boolean(result.imageUrl)" @dragstart="dragGeneratedImage($event,result)" @click="selectedResultId=result.id"><span class="vs-task-thumb is-result-thumb"><img x-show="result.imageUrl" :src="result.imageUrl" alt=""><i x-show="!result.imageUrl" :data-lucide="result.status==='failed'?'triangle-alert':'loader-circle'"></i></span><div class="vs-task-main"><div><strong x-text="result.title"></strong><span x-text="result.status==='succeeded'?tr('completed'):result.status==='failed'?tr('failed'):tr('generating')"></span></div><p x-text="result.prompt"></p><small x-text="result.size+' · '+result.modelLabel"></small><div x-show="result.error" class="vs-task-error" x-text="result.error"></div></div><button type="button" class="vs-task-cancel" @click.stop="removeResult(result.id)" :title="result.historyId?tr('deleteHistory'):tr('remove')"><i data-lucide="x"></i></button></article></template></div>
        </aside>
        <div x-show="galleryDragActive" x-cloak class="vs-gallery-drop-overlay"><span><i data-lucide="download"></i><strong x-text="tr('dropIntoSlot')"></strong><small x-text="tr('dropIntoSlotHint')"></small></span></div>
    </main>
</div>
{% endblock %}

{% block scripts %}<script src="{{ static('js/capability_provisioning.js') }}"></script><script src="{{ static('js/imagine_studio.js') }}"></script>{% endblock %}
