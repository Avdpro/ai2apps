<div x-show="currentMiniApp.needsImages" x-cloak class="is-reference-grid" :class="'is-adapter-'+currentMiniApp.adapter" :style="referenceSlotCount===1?'grid-template-columns:1fr':''"><template x-for="slot in referenceSlotCount" :key="slot"><div class="is-image-slot" x-init="$nextTick(()=>AI2AppsAssetSlot.bind($el,{select:file=>setReference(slot-1,file),clear:()=>clearReference(slot-1),drop:event=>handleGalleryDrop(event,slot-1),error:error=>fail(error)}))" x-effect="const slotState={preview:referencePreviews[slot-1],disabled:generating,label:referenceSlotLabel(slot-1),clearLabel:tr('remove')}; $nextTick(()=>$el.assetSlot?.update(slotState))"><input type="file" accept="image/png,image/jpeg,image/webp"><img hidden :alt="tr('referenceAlt')"><span data-slot-empty><i data-lucide="image-plus"></i><strong x-text="referenceSlotLabel(slot-1)"></strong><small x-text="referenceSlotRequirement(slot-1)"></small></span><button hidden type="button" :aria-label="tr('remove')"><i data-lucide="x"></i></button></div></template></div>
