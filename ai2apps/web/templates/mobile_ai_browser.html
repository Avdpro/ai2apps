{% extends "mobile_app_base.html" %}
{% block title %}AI Browser - AI2Apps{% endblock %}
{% block head %}<link rel="stylesheet" href="{{ static('css/ai_browser.css') }}?v=mobile-mini-shell-7"><script src="{{ static('js/ai_browser_mobile_i18n.js') }}?v=task-human-pause-20261015"></script>{% endblock %}
{% block content %}
<section class="aib-app aib-mobile sm-mobile" x-data="aiBrowserApp()" x-init="init()" :data-mobile-surface="mobileSurface">
<header class="aib-header"><button class="aib-icon-button" x-show="['workspace','task'].includes(mobileSurface)" @click="mobileBack()" :aria-label="tr('ai_browser.mobile.back')"><i data-lucide="chevron-left"></i></button><div class="aib-brand"><span class="aib-logo"><i data-lucide="globe-2"></i></span><h1 x-text="tr('ai_browser.title')"></h1></div><div class="aib-mobile-header-actions"><button class="aib-icon-button aib-mobile-task-button" x-show="!['tasks','task'].includes(mobileSurface)" @click="openMobileTasks()" :aria-label="tr('ai_browser.workspace.tasks')"><i data-lucide="list-checks"></i><span x-show="activeTasks.length" class="aib-mobile-task-count" x-text="activeTasks.length"></span></button><button class="aib-icon-button" x-show="['tasks','task'].includes(mobileSurface)" @click="closeMobileTasks()" :aria-label="tr('ai_browser.close')"><i data-lucide="x"></i></button><button class="aib-icon-button" @click="refreshAll()" :disabled="refreshing||refreshAllBusy" :aria-label="tr('ai_browser.workspace.refresh')"><i data-lucide="refresh-cw"></i></button></div></header>
<div x-show="notice" x-cloak class="aib-notice" role="status"><span x-text="notice"></span><button @click="clearNotice()" :aria-label="tr('ai_browser.workspace.close_notice')">×</button></div>
<div class="aib-workspace">
<nav class="aib-nav is-app-library" x-show="mobileSurface==='apps'"><div id="aib-apps-panel"><p class="aib-muted" role="status" x-cloak x-show="miniAppsState==='loading'&&!miniApps.length" x-text="tr('ai_browser.workspace.loading_mini_app')"></p><p class="aib-muted" x-cloak x-show="miniAppsState==='ready'&&!miniApps.length" x-text="tr('ai_browser.workspace.no_mini_apps')"></p><div class="aib-mini-app-list"><template x-for="item in miniApps" :key="item.id"><button class="aib-mini-app-card" :class="mobileSurface==='workspace'&&miniAppId===item.id&&'is-selected'" @click="openMiniApp(item)" :disabled="miniAppLoading"><span class="aib-mini-app-icon"><i :data-lucide="item.icon||'blocks'"></i></span><span class="aib-mini-app-copy"><strong x-text="item.name||item.title"></strong><small x-text="item.summary||item.description"></small></span><i data-lucide="chevron-right"></i></button></template></div><p class="aib-muted aib-mobile-hint" x-text="tr('ai_browser.mobile.install_hint')"></p></div></nav>
<main class="aib-main" x-show="['workspace','task'].includes(mobileSurface)"><div id="aib-frames"></div><div class="aib-main-content" x-show="!frameVisible"><p x-show="miniAppLoading" role="status" x-text="tr('ai_browser.workspace.loading_mini_app')"></p><template x-if="mobileSurface==='task'&&currentTask"><div><h2 x-text="currentTask.name"></h2><p x-text="statusLabel(currentTask.status,currentTask)"></p><p x-text="localTaskText(currentTask.message)"></p><p class="aib-muted" x-show="humanInteractions.some(i=>i.request.control==='browser_user_assistance')" x-text="tr('ai_browser.mobile.assistance_hint')"></p><template x-for="interaction in humanInteractions" :key="interaction.id"><div class="aib-card"><p x-text="interaction.prompt"></p><button @click="respondTask(interaction)" x-text="tr(interaction.request.control==='agent_confirmation'?'ai_browser.workspace.confirm_execute':'ai_browser.workspace.handled_continue')"></button><button x-show="interaction.request.control==='agent_confirmation'" @click="respondTask(interaction,false)" x-text="tr('ai_browser.workspace.reject')"></button></div></template><button x-show="currentTask.status==='interrupted'&&currentTask.run_id" @click="resumeTask(currentTask)" x-text="tr('ai_browser.workspace.resume_checked')"></button><button x-show="!terminal(currentTask.status)" @click="cancelTask(currentTask)" x-text="tr('ai_browser.workspace.cancel_task')"></button><template x-for="child in currentTask.children||[]" :key="child.id"><button class="aib-item" @click="openTask(child)"><strong x-text="child.name"></strong><span x-text="statusLabel(child.status,child)"></span></button></template><pre x-text="taskResult"></pre></div></template></div></main>
<aside class="aib-tasks" x-show="mobileSurface==='tasks'"><h2 x-text="tr('ai_browser.workspace.tasks')"></h2><div class="aib-tabs"><button @click="taskTab='active'" :class="taskTab==='active'&&'is-selected'" x-text="tr('ai_browser.workspace.current_tasks')"></button><button @click="taskTab='recent'" :class="taskTab==='recent'&&'is-selected'" x-text="tr('ai_browser.workspace.recent_tasks')"></button></div><p x-show="!(taskTab==='active'?activeTasks:recentTasks).length" class="aib-muted" x-text="tr('ai_browser.workspace.no_tasks')"></p><template x-for="task in taskTab==='active'?activeTasks:recentTasks" :key="task.id"><div class="aib-task"><button @click="openTask(task)"><strong x-text="task.name"></strong><span x-text="statusLabel(task.status,task)"></span><small x-text="profileName(task.profile_key)"></small><small x-text="localTaskText(task.message)"></small></button><button x-show="!terminal(task.status)" @click="cancelTask(task)" x-text="tr('ai_browser.workspace.cancel')"></button></div></template></aside>
</div>
</section>
{% endblock %}
{% block scripts %}<script src="{{ static('js/studio_mini_apps.js') }}?v=trip-device-location-20261022"></script><script src="{{ static('js/mini_app_chat.js') }}?v=package-chat-20261027"></script><script src="{{ static('js/app_chat.js') }}?v=package-chat-20261027"></script><script src="{{ static('js/studio_app_chat.js') }}?v=package-chat-20261027"></script><script src="{{ static('js/ai_browser.js') }}?v=internal-candidates-20261028"></script>{% endblock %}
