<!doctype html>
<html lang="{{ current_lang }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <title>{% block title %}AI2Apps Mobile{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ mobile_static('favicon.svg') }}">
    <link rel="stylesheet" href="{{ mobile_static('fonts/inter/inter.css') }}">
    <script src="{{ mobile_static('js/lucide.min.js') }}"></script>
    {% if owner_home %}<link rel="stylesheet" href="{{ mobile_static('css/mobile_app.css') }}?v=owner-recovery-20261009-1">{% endif %}
    {% block head %}{% endblock %}
</head>
<body{% if owner_home %} data-owner-home="true"{% endif %}>
    {% block content %}{% endblock %}
    {% if owner_home %}<script src="{{ mobile_static('js/owner_session.js') }}?v=owner-recovery-20261009-1"></script>{% endif %}
    {% block scripts %}{% endblock %}
</body>
</html>
