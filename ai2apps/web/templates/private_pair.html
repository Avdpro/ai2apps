<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI2Apps · 配对手机</title><style>body{font:16px system-ui;background:#f7f7f8;color:#222;margin:0;padding:24px}main{max-width:440px;margin:10vh auto;background:white;padding:32px;border-radius:24px;border:1px solid #ddd}button,input{font:inherit;padding:12px;border-radius:10px;border:1px solid #ccc;box-sizing:border-box;width:100%;margin:8px 0}button{background:#222;color:white}#code{font-size:36px;letter-spacing:6px}p{line-height:1.6}</style><main><small>AI2APPS</small><h1>配对你的 Desktop</h1><p id="message">为手机命名，在 Desktop 确认后即可访问。不需要 AI2Apps 帐号。</p><input id="name" maxlength="80" placeholder="例如：我的 iPhone"><button id="pair">开始配对</button><strong id="code"></strong></main><script>
const token=location.hash.slice(1);history.replaceState(null,'','/pair');
const message=document.getElementById('message'),button=document.getElementById('pair');
async function post(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const value=await r.json();if(!r.ok)throw Error(typeof value.detail==='string'?value.detail:'配对失败，请重新扫码');return value;}
button.onclick=async()=>{button.disabled=true;try{const result=await post('/pair/request',{token,name:document.getElementById('name').value});document.getElementById('code').textContent=result.code;message.textContent='请核对 Desktop 上显示的验证码，并在 Desktop 点击“允许配对”。';const until=Date.now()+300000;while(Date.now()<until){await new Promise(r=>setTimeout(r,2000));const state=await post('/pair/finish',{proof:result.proof});if(state.connected){location.replace('/mobile');return;}}throw Error('配对已过期，请重新扫码。');}catch(e){message.textContent=e.message;}};
</script></html>
