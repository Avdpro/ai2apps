schema: ai2apps.capability-profiles/v1
app_id: ai2apps.messager
version: 1
capabilities:
  audio.speech_generation:
    trigger: on_feature_request
    presentation:
      eyebrow: AI2APPS BOT VOICE SETUP
      title: 配置语音合成
      description: 需要下载并配置语音合成模型后才能朗读回复。确认前不会下载或启动模型。
      icon: volume-2
      confirm_label: 同意并配置
      ready_label: 语音合成已经可用
      steps:
        runtime: 配置音频推理 Runtime
        provider: 安装语音合成 Package
        checkpoint: 下载语音合成模型
        verify: 启动并验证语音合成
    requirements:
      operations:
      - speech_generation
    profiles:
    - id: apple-metal-qwen3-tts-17b-custom-voice
      label: Qwen3 TTS 1.7B · 高质量
      description: 更高质量的多语言 CustomVoice，适合 16 GiB 及以上设备。
      priority: 110
      device:
        os:
        - macos
        architectures:
        - arm64
        accelerator:
          vendor: apple
          api: metal
          unified_memory_gib:
            minimum: 16
      recommendation_memory_gib:
        minimum: 16
      stack:
        runtime:
          package_id: ai2apps/runtime-omlx
          service_key: ai2apps.runtime.omlx
          version: '>=1.3.0,<2.0.0'
        provider:
          package_id: ai2apps/model-qwen3-tts-17b
          service_key: ai2apps.model.qwen3-tts-1.7b
          version: '>=0.1.0,<1.0.0'
        checkpoint:
          model_id: ai2apps.model.qwen3-tts-1.7b/custom-voice-8bit
    - id: apple-metal-qwen3-tts-06b-custom-voice
      label: Qwen3 TTS 0.6B · 轻量推荐
      description: 多语言角色、语速、情绪与 Instructions，适合 8–16 GiB 设备。
      priority: 100
      device:
        os:
        - macos
        architectures:
        - arm64
        accelerator:
          vendor: apple
          api: metal
          unified_memory_gib:
            minimum: 8
      recommendation_memory_gib:
        minimum: 8
        maximum_exclusive: 16
      stack:
        runtime:
          package_id: ai2apps/runtime-omlx
          service_key: ai2apps.runtime.omlx
          version: '>=1.3.0,<2.0.0'
        provider:
          package_id: ai2apps/model-qwen3-tts-06b
          service_key: ai2apps.model.qwen3-tts-0.6b
          version: '>=0.2.0,<1.0.0'
        checkpoint:
          model_id: ai2apps.model.qwen3-tts-0.6b/custom-voice-6bit
