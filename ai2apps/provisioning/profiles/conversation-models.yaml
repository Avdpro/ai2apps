schema: ai2apps.capability-profiles/v1
app_ids: [ai2apps.general-chat, ai2apps.messager]
version: 1
capabilities:
  text.chat.local:
    trigger: recommended_optional
    selection_mode: multiple
    presentation:
      eyebrow: AI2APPS LOCAL AI
      title: 选择并安装本地聊天模型
      description: 云端模型仍可继续使用；本向导只为当前设备增加离线、低延迟的本地聊天能力。
      icon: hard-drive-download
      confirm_label: 安装所选模型
      ready_label: 本地聊天模型已可用
      steps:
        runtime: 配置本地推理 Runtime
        provider: 安装本地聊天模型 Package
        checkpoint: 下载推荐模型 Checkpoint
        verify: 启动并验证本地聊天能力
    requirements:
      operations: [conversation]
    profiles:
      - id: apple-metal-deepseek-v41-flash
        label: DeepSeek V4.1 Flash · 无损 SSD Cached-MoE
        description: 当前最高质量的多模态本地模型；原始 FP4/FP8 精度，适合 96 GiB 及以上设备。
        priority: 150
        device:
          os: [macos]
          architectures: [arm64]
          accelerator:
            vendor: apple
            api: metal
            unified_memory_gib: {minimum: 96}
        recommendation_memory_gib: {minimum: 96}
        stack:
          runtime: {package_id: ai2apps/runtime-omlx, service_key: ai2apps.runtime.omlx, version: ">=1.7.13,<2.0.0"}
          provider: {package_id: ai2apps/model-deepseek-v41-flash, service_key: ai2apps.model.deepseek-v41-flash, version: ">=0.1.0,<1.0.0"}
          checkpoint: {model_id: ai2apps.model.deepseek-v41-flash/deepseek-v41-flash}
      - id: apple-metal-deepseek-v4-flash
        label: DeepSeek V4 Flash · 高质量 Cached-MoE
        description: 上一代高质量 Cached-MoE 兼容选项，至少需要 48 GiB 统一内存。
        priority: 110
        recommended: false
        device:
          os: [macos]
          architectures: [arm64]
          accelerator:
            vendor: apple
            api: metal
            unified_memory_gib: {minimum: 48}
        recommendation_memory_gib: {minimum: 64}
        stack:
          runtime: {package_id: ai2apps/runtime-omlx, service_key: ai2apps.runtime.omlx, version: ">=1.7.0,<2.0.0"}
          provider: {package_id: ai2apps/model-deepseek-v4-flash, service_key: ai2apps.model.deepseek-v4-flash, version: ">=0.3.1,<1.0.0"}
          checkpoint: {model_id: ai2apps.model.deepseek-v4-flash/deepseek-v4-flash}
      - id: apple-metal-deepseek-v4-flash-2bit
        label: DeepSeek V4 Flash 2-bit · 平衡档
        description: 上一代节省内存的 Cached-MoE 兼容选项，至少需要 32 GiB 统一内存。
        priority: 100
