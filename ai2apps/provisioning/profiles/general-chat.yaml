        label: Qwen3.8 Flash Next 4-bit · 多模态 Cached-MoE
        description: 支持聊天和图片理解的 Cached-MoE 模型；Lean 档约 41 GiB，至少需要 48 GiB 统一内存。
        priority: 97
        recommended: false
        device:
