      - id: apple-metal-ornith15-35b-vision-4bit
        label: Ornith 1.5 35B A3B 4-bit · 视觉
        description: 支持聊天和图片理解的 Cached-MoE 模型；至少需要 32 GiB 统一内存。
        priority: 98
        recommended: false
        device:
          os: [macos]
          architectures: [arm64]
