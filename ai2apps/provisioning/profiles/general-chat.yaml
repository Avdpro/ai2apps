schema: ai2apps.capability-profiles/v1
app_id: ai2apps.general-chat
version: 1
capabilities:
  text.chat.local:
    trigger: recommended_optional
    selection_mode: multiple
    presentation:
      eyebrow: AI2APPS LOCAL AI
      title: 选择并安装本地聊天模型
      description: 云端模型仍可继续使用；本向导只为当前设备增加离线、低延迟的本地聊天能力。
      icon: hard-drive-download
      confirm_label: 安装所选模型
      ready_label: 本地聊天模型已可用
      steps:
        runtime: 配置本地推理 Runtime
        provider: 安装本地聊天模型 Package
        checkpoint: 下载推荐模型 Checkpoint
        verify: 启动并验证本地聊天能力
    requirements:
      operations: [conversation]
    profiles:
      - id: apple-metal-deepseek-v4-flash
        label: DeepSeek V4 Flash · 高质量 Cached-MoE
        description: 高质量本地推理档，至少需要 48 GiB，推荐 64 GiB 及以上设备。
        priority: 120
        device:
          os: [macos]
          architectures: [arm64]
          accelerator:
            vendor: apple
            api: metal
            unified_memory_gib: {minimum: 48}
        recommendation_memory_gib: {minimum: 64}
        stack:
          runtime: {package_id: ai2apps/runtime-omlx, service_key: ai2apps.runtime.omlx, version: ">=1.0.1,<2.0.0"}
          provider: {package_id: ai2apps/model-deepseek-v4-flash, service_key: ai2apps.model.deepseek-v4-flash, version: ">=0.3.1,<1.0.0"}
          checkpoint: {model_id: ai2apps.model.deepseek-v4-flash/deepseek-v4-flash}
      - id: apple-metal-deepseek-v4-flash-2bit
        label: DeepSeek V4 Flash 2-bit · 平衡档
        description: 节省内存的 Cached-MoE 档，适合 32–64 GiB 设备。
        priority: 110
        device:
          os: [macos]
          architectures: [arm64]
          accelerator:
            vendor: apple
            api: metal
            unified_memory_gib: {minimum: 32}
        recommendation_memory_gib: {minimum: 32, maximum_exclusive: 64}
        stack:
          runtime: {package_id: ai2apps/runtime-omlx, service_key: ai2apps.runtime.omlx, version: ">=1.0.1,<2.0.0"}
          provider: {package_id: ai2apps/model-deepseek-v4-flash-2bit, service_key: ai2apps.model.deepseek-v4-flash-2bit, version: ">=0.3.1,<1.0.0"}
          checkpoint: {model_id: ai2apps.model.deepseek-v4-flash-2bit/deepseek-v4-flash-2bit}
      - id: apple-metal-qwen36-35b-4bit
        label: Qwen3.6 35B · 本地聊天
        description: Cached-MoE 4-bit，适合 16 GiB 及以上 Apple Silicon。
        priority: 100
        device:
          os: [macos]
          architectures: [arm64]
          accelerator:
            vendor: apple
            api: metal
            unified_memory_gib: {minimum: 16}
        recommendation_memory_gib: {minimum: 16, maximum_exclusive: 32}
        stack:
          runtime: {package_id: ai2apps/runtime-omlx, service_key: ai2apps.runtime.omlx, version: ">=1.0.1,<2.0.0"}
          provider: {package_id: ai2apps/model-qwen36-35b, service_key: ai2apps.model.qwen36-35b, version: ">=0.3.1,<1.0.0"}
          checkpoint: {model_id: ai2apps.model.qwen36-35b/qwen3.6-35b-a3b-4bit}
      - id: apple-metal-qwen35-2b-4bit
        label: Qwen3.5 2B 4-bit · 轻量多模态
        description: 轻量聊天和图片理解模型，适合 8 GiB 及以上 Apple Silicon。
        priority: 95
        recommended: false
        device:
          os: [macos]
          architectures: [arm64]
          accelerator:
            vendor: apple
            api: metal
            unified_memory_gib: {minimum: 8}
        stack:
          components:
            - {id: provider, kind: package, phase: provider, package_id: ai2apps/model-qwen35, service_key: ai2apps.qwen35, version: ">=0.1.1,<1.0.0"}
            - {id: checkpoint, kind: checkpoint, phase: checkpoint, model_id: ai2apps.qwen35/qwen3.5-2b-4bit}
            - {id: verify, kind: verify, phase: verify, service_key: ai2apps.qwen35, capabilities: [conversation]}
      - id: apple-metal-qwen35-08b-4bit
        label: Qwen3.5 0.8B 4-bit · 超轻量多模态
        description: 更小的聊天和图片理解模型，适合 8 GiB 设备快速启动。
