  audio.speech_recognition:
    trigger: on_feature_request
    presentation:
      eyebrow: AI2APPS VOICE SETUP
      title: 配置语音识别
      description: 需要下载并配置语音识别模型后才能使用麦克风输入。确认前不会下载或启动模型。
      icon: mic
      confirm_label: 同意并配置
      ready_label: 语音识别已经可用
      steps:
        runtime: 配置音频推理 Runtime
        provider: 安装语音识别 Package
        checkpoint: 下载语音识别模型
        verify: 启动并验证语音识别
