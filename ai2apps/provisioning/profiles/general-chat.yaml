            - {id: verify, kind: verify, phase: verify, service_key: ai2apps.qwen35, capabilities: [conversation]}
      - id: apple-metal-qwen38-27b-nvfp4
        label: Qwen3.8 27B NVFP4 · 多模态
        description: 27B 多模态本地模型，支持聊天和图片理解；新模型，暂不作为默认推荐。
        priority: 99
        recommended: false
        device:
          os: [macos]
          architectures: [arm64]
          accelerator:
            vendor: apple
            api: metal
            unified_memory_gib: {minimum: 24}
        stack:
          runtime: {package_id: ai2apps/runtime-omlx, service_key: ai2apps.runtime.omlx, version: ">=1.0.1,<2.0.0"}
          provider: {package_id: ai2apps/model-qwen38, service_key: ai2apps.model.qwen38, version: ">=0.3.2,<1.0.0"}
