schema: ai2apps.capability-profiles/v1
app_id: ai2apps.imagine-studio
version: 1
capabilities:
  image.upscaling:
    trigger: on_action
    presentation:
      eyebrow: AI2APPS CAPABILITY SETUP
      title: 配置图片 2× 放大
      description: 直接放大 PNG、JPEG、WebP 图片，复用 SoL-Refiner 权重并输出 PNG。
      icon: scan-search
      confirm_label: 下载并配置
      ready_label: 图片放大已配置
      steps:
        runtime: 配置推理 Runtime
        provider: 安装图片放大模型
        checkpoint: 下载模型权重
        verify: 验证图片放大服务
    requirements:
      operations:
      - image_upscaling
      output_formats:
      - png
    profiles:
    - id: apple-metal-sol-refiner-standard
      label: SoL-Refiner 标准 2×
      description: 默认推荐；无需自定义提示词。
      priority: 200
      device:
        os:
        - macos
        architectures:
        - arm64
        accelerator:
          vendor: apple
          api: metal
          unified_memory_gib:
            minimum: 24
      recommendation_memory_gib:
        minimum: 24
      stack:
        runtime:
          package_id: ai2apps/runtime-omlx
          service_key: ai2apps.runtime.omlx
          version: '>=1.8.8,<2.0.0'
        provider:
          package_id: ai2apps/model-sol-refiner-mlx
          service_key: ai2apps.model.sol-refiner-mlx
          version: '>=0.1.2,<1.0.0'
        checkpoint:
          model_id: ai2apps.model.sol-refiner-mlx/ltx23-one-step
    - id: apple-metal-sol-refiner-custom
      label: SoL-Refiner 自定义提示词 2×
      description: 需要自定义放大提示词时选择。
      priority: 100
      device:
        os:
        - macos
        architectures:
        - arm64
        accelerator:
          vendor: apple
          api: metal
          unified_memory_gib:
            minimum: 24
      recommendation_memory_gib:
        minimum: 24
      stack:
        runtime:
          package_id: ai2apps/runtime-omlx
          service_key: ai2apps.runtime.omlx
          version: '>=1.8.8,<2.0.0'
        provider:
          package_id: ai2apps/model-sol-refiner-mlx
          service_key: ai2apps.model.sol-refiner-mlx
          version: '>=0.1.2,<1.0.0'
        checkpoint:
          model_id: ai2apps.model.sol-refiner-mlx/ltx23-custom-prompt
