<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI2Apps</title>
    <link rel="stylesheet" href="bootstrap.css" />
  </head>
  <body>
    <main class="card" aria-live="polite">
      <div class="brand" aria-hidden="true">A</div>
      <p class="eyebrow">AI2Apps Desktop</p>
      <h1 id="title">Connecting to your AI node</h1>
      <p id="message">Checking AI2Apps node…</p>
      <div class="progress" aria-hidden="true"><span id="progress-bar"></span></div>
      <dl>
        <div><dt>Node</dt><dd id="node-url">—</dd></div>
        <div><dt>Status</dt><dd id="status">Checking</dd></div>
        <div><dt>Desktop</dt><dd id="desktop-info">—</dd></div>
      </dl>
      <div class="actions">
        <button id="retry" class="primary" type="button" hidden>Try again</button>
        <button id="manage-nodes" type="button">Manage nodes</button>
        <button id="open-logs" type="button">Open logs</button>
      </div>

      <section id="node-manager" hidden>
        <div class="section-heading">
          <div>
            <p class="eyebrow">Connections</p>
            <h2>Choose an AI2Apps node</h2>
          </div>
          <button id="close-manager" class="compact" type="button">Close</button>
        </div>
        <div id="connection-list" class="connection-list"></div>

        <form id="add-connection">
          <h3>Add a node</h3>
          <label>
            Display name
            <input id="connection-name" name="name" maxlength="120" placeholder="Office Spark" required />
          </label>
          <label>
            Node URL
            <input id="connection-url" name="url" type="url" placeholder="https://spark.example.com" required />
          </label>
          <p class="hint">Remote nodes require HTTPS. Authentication continues in that node's AI2Apps login.</p>
          <p id="connection-error" class="form-error" role="alert"></p>
          <button class="primary" type="submit">Add and connect</button>
        </form>
      </section>
    </main>
    <script src="bootstrap.js"></script>
  </body>
</html>
