name: Publish to PyPI

# Publishing a GitHub Release is the only operation that can reach PyPI.
# Manual wheel experiments stay in build-wheels.yml and have no OIDC grant.
on:
  release:
    types: [published]

concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  # Never cancel a package upload halfway through.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-wheels:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Verify release tag matches package version
        shell: bash
        run: |
          package_version="$(python -c 'from ai2apps import __version__; print(__version__)')"
          release_version="${GITHUB_REF_NAME#v}"
          if [[ "$release_version" != "$package_version" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match ai2apps $package_version"
            exit 1
          fi

      - name: Build wheel with native custom kernels
        env:
          OMLX_WITH_CUSTOM_KERNEL: "1"
        run: |
          python -m pip install --upgrade pip
          python -m pip install build "setuptools>=77.0" wheel "cmake>=3.27" "nanobind==2.13.0" "mlx==0.32.0"
          export CMAKE_ARGS="-DPython_EXECUTABLE=$(python -c 'import sys; print(sys.executable)')"
          python -m build --wheel --no-isolation

      - name: Smoke-test installed wheel and native kernels
        run: |
          unzip -l dist/*.whl | grep -E "_ext|dylib|metallib" || { echo "no native artifacts in wheel"; exit 1; }
          python -m venv /tmp/ai2apps-wheel-smoke
          /tmp/ai2apps-wheel-smoke/bin/pip install --quiet dist/*.whl
          cd /tmp
          /tmp/ai2apps-wheel-smoke/bin/python - <<'PY'
          import importlib

          import ai2apps

          failed = []
          for package in ("bonsai", "glm_moe_dsa", "minimax_m3", "qwen35_prefill"):
              fast = importlib.import_module(f"omlx.custom_kernels.{package}.fast")
              available = bool(fast.is_native_available())
              print(f"{package}: native_available={available} import_error={fast.import_error()}")
              if not available:
                  failed.append(package)
          print(f"ai2apps={ai2apps.__version__}")
          raise SystemExit(f"native kernels missing from wheel: {failed}" if failed else 0)
          PY

      - name: Upload wheel artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

  build-sdist:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Verify release tag matches package version
        shell: bash
        run: |
          package_version="$(python -c 'from ai2apps import __version__; print(__version__)')"
          release_version="${GITHUB_REF_NAME#v}"
          test "$release_version" = "$package_version"

      - name: Build and validate source distribution
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build --sdist
          python -m twine check dist/*.tar.gz

      - name: Upload source artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error

  attach-to-release:
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Attach distributions to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" dist/* \
            --repo "${{ github.repository }}" --clobber

  publish:
    name: Publish distributions to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ai2apps
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Show distributions selected for the immutable upload
        run: ls -lh dist

      - name: Publish to PyPI with a short-lived trusted token
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          verbose: true
