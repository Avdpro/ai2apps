[build-system]
requires = [
    "setuptools>=77.0",
    "wheel",
    "cmake>=3.27",
    # Pin nanobind to match the ABI version MLX 0.32.0 was built with
    # (MLX pins nanobind v2.13.0 via FetchContent in its CMakeLists.txt).
    # A mismatched nanobind isolates the `mlx` NB_DOMAIN, so custom kernel
    # extensions (omlx.custom_kernels.*) reject every mlx.core.array at the
    # type caster with `incompatible function arguments`.
    "nanobind==2.14.0",
    "mlx==0.32.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "ai2apps"
dynamic = ["version"]
description = "Local-first edge supermodel and Fusion inference runtime for Apple Silicon"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11,<3.14"
authors = [
    {name = "AI2Apps contributors"}
]
keywords = ["llm", "moe", "mlx", "apple-silicon", "inference", "expert-cache", "fusion"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Vanilla MLX v0.32.0; optional custom kernels live under
    # omlx.custom_kernels.* when built for release. The bundled kernel
    # binaries are ABI-coupled to this exact mlx version — bumping the pin
    # requires rebuilding them (OMLX_WITH_CUSTOM_KERNEL=1 setup.py build_ext).
    "mlx==0.32.0",
    # Public release dependency. Source checkouts retain the reviewed commit
    # through [tool.uv.sources] without leaking a direct URL into wheel
    # metadata (PyPI rejects direct-URL dependencies).
    "mlx-lm==0.31.3",
    # regex for mlx-lm's Gemma 4 tool parser (uses recursive patterns)
    "regex",
    "mlx-embeddings==0.1.0",
    # mlx-vlm custom processors bypass HF AutoProcessor, so torch is not required
    # Keep <5.13 until the broader dependency set gets a dedicated resolver
    # smoke test with transformers 5.13+. The mlx-lm pin above includes the
    # known NewlineTokenizer registration fix. Floor 5.12.1: AutoTokenizer's
    # fix_mistral_regex backend gate (used by get_tokenizer_config for
    # mistral-common models) first shipped in 5.12.1 — on older 5.x the kwarg
    # is silently swallowed and Tekken prompts stay corrupted.
    "transformers>=5.12.1,<5.13",
    # transformers 5.x's tokenization_mistral_common module imports
    # ReasoningEffort from mistral_common (added in 1.10). The audio extras
    # transitively pull mistral-common via mlx-audio[stt], which historically
    # resolved to 1.9.x and broke WhisperProcessor.from_pretrained() with a
    # silent "Processor not found" on every Whisper model. Pinning the
    # minimum here ensures resolution lands on a compatible version even
    # without the audio extra installed.
    # See pmarreck/omlx#1 for full repro and root cause.
    "mistral-common>=1.10",
    "tokenizers>=0.19.0",
    # The admin downloader calls snapshot_download(dry_run=True) (1.0.0+)
    # and cancels xet transfers via utils._xet.abort_xet_session, which was
    # added in 1.19.0 together with the session-based xet download path
    # (and drags in hf-xet>=1.5.1). Declare the floor directly instead of
    # leaning on transformers' transitive hub requirement.
    "huggingface-hub>=1.19.0",
    "numpy>=1.24.0,<2.4",
    "tqdm>=4.66.0",
    "pyyaml>=6.0",
    # Wheel tag, requirement, and version validation for model adapters.
    "packaging>=24",
    "itsdangerous>=2.0",
    "jinja2>=3.0",
    # mlx-lm 0.31.3 imports rich from mlx_lm.cli_ui for chat/lora entrypoints.
    "rich>=13.0.0",
    "sentencepiece",
    "tiktoken",
    "protobuf",
    "requests>=2.28.0",
    # OpenAI-compatible external endpoint client for admin benchmarks.
    # Already a transitive dep via huggingface-hub; pinned direct so
    # omlx.admin.external_api can import it unconditionally at module top.
    "httpx>=0.27.0,<1",
    # Portable encrypted Secret Vault for headless Linux/Windows deployments.
    "cryptography>=42.0.0",
    # SOCKS proxy support (used by httpx via huggingface-hub)
    "socksio>=1.0.0",
    "tabulate>=0.9.0",
    # Resource monitoring
    "psutil>=5.9.0",
    # Native process title support (shows as ai2apps-server instead of python)
    "setproctitle>=1.3.3",
    # Server
    "fastapi>=0.108.0",
    "uvicorn>=0.23.0",
    # Uvicorn's base install has no WebSocket protocol implementation. The
    # Terminal App streams PTY traffic over WebSocket, so keep one explicit.
    "websockets>=14.0,<16",
    # python-multipart is needed by audio_routes.py (File/Form uploads), which
    # server.py unconditionally imports regardless of the [audio] extra.
    "python-multipart>=0.0.5",
    # JSON Schema validation for structured output
    "jsonschema>=4.0.0",
    # RFC 8785 canonicalization for signed Model Share manifests/commitments.
    "rfc8785>=0.1.4,<0.2",
    # Harmony format parser for gpt-oss models
    "openai-harmony",
    # Cohere Command/Cohere2 output parser for reasoning and tool calls
    "cohere_melody>=0.9.0",
    # Source checkouts use reviewed commit 78b96eb via [tool.uv.sources].
    # MiniMax M3 support is vendored under
    # omlx.patches.mlx_vlm_minimax_m3_compat because upstream removed it.
    "mlx-vlm==0.6.3",
    "Pillow>=9.0.0",
    # mflux uses this on every generated-image save path. It is intentionally
    # kept while torch/opencv conversion-only dependencies remain stripped.
    "piexif>=1.1.3,<2",
    # mflux VersionUtil imports the legacy toml module on every image pipeline
    # import, even when the wheel metadata supplies the installed version.
    "toml>=0.10.2,<1",
    # Render short-lived Remote Access pairing links as SVG QR codes.
    "qrcode==8.2",
    # DFlash remains a source-development capability until its reviewed fork
    # has an index release. The server already treats it as optional; the
    # three AI2Apps release engines do not import it.
    "markitdown[pdf,docx,pptx]==0.1.6",
    # Canonical reader HTML is converted to model-friendly Markdown by the
    # managed-browser article tool. Declare this directly rather than relying
    # on markitdown's transitive dependency.
    "markdownify>=1.2.3,<2",
    "openpyxl>=3.1.2,<4",
    "reportlab>=4.2.0,<5",
    "pypdf>=5.0.0,<7",
    "zeroconf>=0.147,<1",
    "noiseprotocol>=0.3.1,<0.4",
    # Standards-compliant QUIC v1 transport for Device-to-Device Peer sessions.
    "aioquic>=1.2.0,<2",
]

[project.optional-dependencies]
# Dependencies embedded in the inference-free AI2Apps Base App. Keep native
# model runtimes (MLX, transformers, tokenizers, audio, grammar) out of this
# list: they are delivered by signed Runtime Packages and launched as managed
# Service processes.
control-plane = [
    "regex",
    # The Host video task manager inspects downloaded container metadata when
    # materializing artifacts, so PyAV is a control-plane dependency even
    # when model inference is delegated to a separately installed Runtime.
    "av==18.0.0",
    # The account Messager API is mounted by the control plane and imports its
    # Noise transport during router construction, including on headless Linux.
    "noiseprotocol>=0.3.1,<0.4",
    "aioquic>=1.2.0,<2",
    # Checkpoint discovery and downloads are Host/control-plane operations.
    # Keep the Hub client in the Base App even though inference runtimes also
    # carry it for transformers/MLX compatibility.
    "huggingface-hub>=1.19.0",
    "pyyaml>=6.0",
    "packaging>=24",
    "itsdangerous>=2.0",
    "jinja2>=3.0",
    "requests>=2.28.0",
    "httpx>=0.27.0,<1",
    "cryptography>=42.0.0",
    "socksio>=1.0.0",
    "tabulate>=0.9.0",
    "psutil>=5.9.0",
    "setproctitle>=1.3.3",
    "fastapi>=0.108.0",
    "uvicorn>=0.23.0",
    "websockets>=14.0,<16",
    "python-multipart>=0.0.5",
    "jsonschema>=4.0.0",
    "rfc8785>=0.1.4,<0.2",
    "Pillow>=9.0.0",
    "qrcode==8.2",
    "markitdown[pdf,docx,pptx]==0.1.6",
    "markdownify>=1.2.3,<2",
    "openpyxl>=3.1.2,<4",
    "reportlab>=4.2.0,<5",
    "pypdf>=5.0.0,<7",
    "zeroconf>=0.147,<1",
    "selenium>=4.35.0,<5",
    "mcp>=1.5.0",
]
knowledge-rag-runtime = [
    # Installed only through the on-demand Knowledge Runtime Package. Neither
    # LanceDB nor MLX Embeddings belongs in the inference-free Base App.
    "lancedb==0.37.1",
    "mlx==0.32.2",
    "transformers==5.15.1",
]
browser = [
    # Selenium Manager resolves the ChromeDriver matching the installed Chrome.
    # websocket-client is included by Selenium and carries the event-only BiDi
    # connection used by the managed-browser runtime.
    "selenium>=4.35.0,<5",
]
grammar = [
    # Grammar-constrained decoding for structured output (requires torch ~2GB)
    # Keep this native pair aligned with omlx/_torch_stub.py and the DMG
    # build. xgrammar 0.2.3 crashes at import with apache-tvm-ffi 0.1.13
    # on macOS arm64, so an open-ended resolver can break Homebrew installs
    # without any oMLX source change (#2428).
    "xgrammar==0.2.3",
    "apache-tvm-ffi==0.1.11",
]
mcp = [
    "mcp>=1.5.0",
]
modelscope = [
    "modelscope>=1.10.0",
]
audio = [
    # Source checkouts can retain reviewed commit 5175326 via
    # [tool.uv.sources]; published metadata resolves entirely from PyPI.
    # tts extra: misaki, num2words, spacy, phonemizer-fork, espeakng-loader, sentencepiece
    # stt extra: tiktoken, mistral-common[audio]
    # sts extra: tts deps + stt deps + webrtcvad
    "mlx-audio[tts,stt,sts]==0.4.6",
    # Small native wrapper used by the CT-Transformer punctuation Package.
    # Wheels are available for the bundled CPython 3.11/arm64 runtime.
    "sherpa-onnx==1.13.4",
    # PyPI wheel bundles FFmpeg codecs for common compressed/container audio.
    "av==18.0.0",
]
paroquant = [
    # ParoQuant runtime loader for paroquant-quantized models. Installed
    # with --no-deps semantics here because the official [mlx] extra pulls
    # torchvision, which the load path doesn't actually use (verified end
    # to end on 0.1.14). The DMG build installs the same pin via build.py.
    "paroquant==0.1.16; python_version >= '3.11'",
]
# Internal extra consumed by packaging/build.py to populate the
# venvstacks mlx-base layer's requirements list. Listed here as the
# single source of truth so the layer-template venvstacks.toml stays
# version-free. End-users don't `pip install omlx[bundle]`; this is for
# the macOS .app build pipeline.
#
# mlx-audio[tts,stt,sts]'s 12 transitive deps appear explicitly because
# venvstacks 0.7.0's internal `uv pip compile` runs with --no-config and
# doesn't propagate pyproject.toml's `tool.uv.override-dependencies`,
# so it can't resolve mlx-audio's `mlx-lm==0.31.1` pin against our
# git-pinned mlx-lm (v0.31.3). build.py installs mlx-audio + paroquant
# separately via --no-deps post-resolution.
bundle = [
    "mcp>=1.5.0",
    "modelscope>=1.10.0",
    "selenium>=4.35.0,<5",
    # mlx-audio[tts,stt,sts] transitives:
    "scipy>=1.11.0",
    "librosa>=0.10.0",
    "miniaudio>=1.59",
    "numba>=0.59.0",
    "pyloudnorm>=0.1.0",
    "sounddevice>=0.4.6",
    "misaki>=0.9.4",
    "num2words>=0.5.14",
    "spacy>=3.8.4",
    "phonemizer-fork>=3.3.2",
    "espeakng-loader>=0.2.4",
    "webrtcvad>=2.0.10",
    "sherpa-onnx==1.13.4",
    "av==18.0.0",
    # [audio] extra on top of pyproject's plain mistral-common>=1.10
    "mistral-common[audio]>=1.10",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "mcp>=1.5.0",
    "venvstacks>=0.7.0",
    # The torch-stub smoke test (tests/test_torch_stub.py) gates
    # xgrammar / tvm-ffi version bumps. It skips when these aren't
    # importable, which silently hides regressions — install no-deps
    # in the dev environment so the test actually runs.
    #
    # Held at 0.2.3: xgrammar 0.2.4/0.2.5 cap transformers at <5,
    # which conflicts with our transformers>=5.12.1 pin and makes
    # pip/uv dev installs unresolvable (#2289). Bump again once
    # upstream lifts the cap.
    "xgrammar==0.2.3",
    "apache-tvm-ffi==0.1.11",
]
# PEP 735 dependency groups — consumed by `uv sync --dev`.
# Keep in sync with [project.optional-dependencies] dev above
# (pip/legacy toolchains use that section instead).
[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "mcp>=1.5.0",
    "venvstacks>=0.7.0",
    "xgrammar==0.2.3",
    "apache-tvm-ffi==0.1.11",
    # Development-only DFlash fork. PEP 735 groups are not emitted into wheel
    # metadata; [tool.uv.sources] resolves this name to the reviewed commit.
    "dflash-mlx>=0.1.8",
]

[project.scripts]
ai2apps = "ai2apps.cli:main"
ai2apps-release-gate = "ai2apps.release_gate:main"
# Compatibility entry point for existing oMLX-based deployments.
omlx = "omlx.cli:main"

[tool.setuptools.dynamic]
version = {attr = "ai2apps._version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["ai2apps*", "omlx*"]

[tool.setuptools.package-data]
"ai2apps" = ["engines/**/*.json"]
"ai2apps.remote" = [
    "frpc-device.toml",
    "frp-ca-2026.pem",
    "bin/**/*",
    "third_party/*",
]
"ai2apps.browser" = ["readability.js"]
"ai2apps.provisioning" = ["profiles/*.yaml"]
"ai2apps.web" = [
    "templates/**/*.html",
    "static/**/*",
    "i18n/*.json",
    "src/*.css",
    "tailwind.config.js",
]
"omlx" = ["oq_calibration_data.json", "oqe_calibration_data.json"]
"omlx.admin" = [
    "bench_corpora/*",
]
"omlx.eval" = ["data/*.jsonl"]
"omlx.custom_kernels.glm_moe_dsa" = ["*.metallib", "*.dylib", "*.so"]
"omlx.custom_kernels.minimax_m3" = ["*.metallib", "*.dylib", "*.so"]
"omlx.custom_kernels.qwen35_prefill" = ["*.metallib", "*.dylib", "*.so"]

# Native files in a developer checkout are local build products.  Exclude them
# from build_py/sdist input so a stale CPython- or macOS-specific artifact can
# never leak into a nominally pure wheel.  Release wheels enable
# OMLX_WITH_CUSTOM_KERNEL; MLX's CMakeBuild writes freshly compiled outputs
# directly into build/lib after this filtering step.
[tool.setuptools.exclude-package-data]
"*" = ["*.metallib", "*.dylib", "*.so"]

[tool.uv]
# Keep the runtime ABI fixed and override older transitive mlx-lm pins.
override-dependencies = [
    "mlx==0.32.0",
    "mlx-lm==0.31.3",
]

# Development/source reproducibility belongs in uv's local source table, not
# in publishable Core Metadata. `python -m build` ignores this table, while
# `uv sync` continues to install the exact commits used by the research tree.
[tool.uv.sources]
mlx-lm = { git = "https://github.com/ml-explore/mlx-lm", rev = "ab1806e8f5d6aa035973af194a1b9198ab4754dc" }
mlx-embeddings = { git = "https://github.com/Blaizzy/mlx-embeddings", rev = "32981fa4e8064ed664b52071789dd18271fe4206" }
mlx-vlm = { git = "https://github.com/Blaizzy/mlx-vlm", rev = "78b96eb5462141447b9a6b4943ef553891da56dd" }
mlx-audio = { git = "https://github.com/Blaizzy/mlx-audio", rev = "51753266e0a4f766fd5e6fbc46652224efc23981" }
dflash-mlx = { git = "https://github.com/jundot/dflash-mlx", rev = "474f8e1ba95864f5bb0759cd1b9a13c80abc5ce3" }

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312", "py313"]

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501", "B905"]
# Vendored upstream files (mlx-vlm copies under patches) keep their
# original formatting for pin-bump diffability.
extend-exclude = ["omlx/patches/*/vendor"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
