id: voice-studio-delete-character
name: 删除语音角色
description: 验证在 Voice Studio 的“Characters/角色管理”Mini-App 中删除角色 Clone Test 1 后，界面返回角色列表且该角色不再显示。前置条件：隔离
  Test App 中已存在可供删除的角色 Clone Test 1；若不存在或存在多个同名角色而无法唯一识别，则标记为 blocked。
