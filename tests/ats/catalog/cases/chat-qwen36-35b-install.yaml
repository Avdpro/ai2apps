schemaVersion: 1
id: chat-qwen36-35b-install
name: 从 Chat 安装 Qwen3.6 35B 并完成对话
description: 验证从 Chat 模型切换菜单进入模型安装页面，安装 Qwen3.6 35B，返回 Chat 选择该模型并完成简单对话的完整流程。
