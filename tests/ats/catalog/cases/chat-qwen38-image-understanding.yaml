id: chat-qwen38-image-understanding
name: Chat 使用 Qwen 3.8 27B 识别熊猫水墨画
description: 在 Chat App Basic（chat-app-basic）按需测试组中，新建对话，使用 Qwen 3.8 27B 识别熊猫吃竹子的水墨画。执行前，用户须通过
  Test Center 的受管理上传流程补充 image-1.png 测试素材；原始素材为用户指定的本地图片。素材未补充或目标模型不可用时，记录为阻断。
