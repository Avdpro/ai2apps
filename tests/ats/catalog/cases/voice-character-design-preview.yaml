schemaVersion: 1
id: voice-character-design-preview
name: 设计生成语音角色试听
description: 在 Voice Studio 的角色管理中，通过设计生成方式配置“测试角色-1”，按需安装推荐模型并生成试听，验证右侧共享“试听与输出”栏出现新的音频文件。
groupId: voice-studio-base-test
priority: null
executor: codex-ui
timeoutSeconds: 1800
lifecycle: enabled
