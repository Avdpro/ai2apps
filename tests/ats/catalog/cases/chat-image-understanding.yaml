id: chat-image-understanding
name: Chat 默认模型识别熊猫水墨画
description: 在 Chat 新建对话，使用系统默认模型识别熊猫吃竹子的水墨画。执行前，用户须通过 Test Center 的受管理上传流程补充 image-1.png
  测试素材；未提供素材时标记为 blocked。
groupId: chat-app-basic
