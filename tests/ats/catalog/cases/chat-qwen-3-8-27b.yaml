id: chat-qwen-3-8-27b
name: 安装 Qwen 3.8 27B 并在 Chat 中对话
description: 验证从 Chat 模型切换菜单进入模型安装页面，安装 Qwen 3.8 27B 后可在 Chat 中选择该模型并完成简单对话。
