schemaVersion: 1
id: chat-ornith-install-and-talk
name: 从 Chat 安装 Ornith 模型并完成对话
description: 验证从 Chat App 模型切换菜单进入模型安装页面，安装 Ornith 1.5 35B A3B 40bit，返回 Chat 选择该模型并完成简单对话的完整流程。
