schemaVersion: 1
id: chat-install-deepseek-v4-flash-2bit
name: 从 Chat 安装 DeepSeek V4 Flash 2bit 并完成对话
description: 仅在隔离的 Test App 中，验证从 Chat 模型切换菜单进入模型安装页面，安装 DeepSeek V4 Flash 2bit，返回
  Chat 选择该模型并完成简单对话。所属按需 Group：Chat App Basic（chat-app-basic）。
groupId: chat-app-basic
priority: null
executor: codex-ui
timeoutSeconds: 3600
lifecycle: enabled
componentId: null
enabled: true
required: true
requires: []
