id: chat-install-deepseek-4-1-flash
name: 从 Chat 安装并使用 DeepSeek 4.1 Flash
description: 验证从 Chat 模型切换菜单进入模型安装页面，安装 DeepSeek 4.1 Flash 后，能够返回 Chat 选择该模型并完成简单对话。仅操作隔离的
  Test App。
groupId: chat-app-basic
