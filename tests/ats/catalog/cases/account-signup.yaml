schemaVersion: 1
id: account-signup
name: 注册新账号并验证注册成功
description: 在 Account App 基础测试按需组中，通过登录页注册入口创建新账号，接收并输入验证码，确认注册成功。仅操作隔离的 AI2Apps
  Test 实例；注册资料由用户提供，敏感输入由用户亲自完成。
groupId: account-base-test
priority: null
executor: codex-ui
timeoutSeconds: 900
lifecycle: enabled
componentId: null
enabled: true
required: true
requires: []
tags:
- codex-ui
- account
- registration
instructions:
- 使用 Computer Use 连接测试系统提供并已校验的 Test Shell，打开 Account App 登录页面。
- 点击登录页面的“注册”入口，确认出现新账号注册表单。
- 由用户使用自己控制且尚未注册的邮箱填写注册资料；需要敏感输入时交由用户亲自完成，不在测试记录中保存输入内容。
- 通过页面提供的发送验证码控件触发验证邮件，观察发送结果及验证码输入区域。
- 由用户在其邮箱中确认收到本次注册的验证邮件，并亲自在注册页面输入验证码；不读取或记录邮件中的验证码。
- 点击页面的确认注册或提交按钮，等待注册处理完成，观察成功提示和后续页面。
- 若注册后返回登录页面，由用户完成新账号登录；若已自动登录，直接进入账号页面。检查页面显示已登录状态，且账号标识与本次注册资料一致。
expectations:
- 登录页面的注册入口可见且可点击，点击后显示可操作的注册表单。
- 完成注册资料后可以请求验证码，页面显示发送成功反馈。
- 用户确认收到与本次注册请求对应的验证邮件，页面允许输入验证码。
- 提交有效验证码及完整资料后，页面显示注册成功提示或进入明确的注册成功后续流程，无注册失败提示。
- 新账号可以进入已登录状态，账号页面展示的账号标识与本次注册资料一致。
cleanup:
- 若本 Case 已创建账号且账号页面提供注销账号功能，由用户通过该功能清理本次创建的账号，并确认注销结果。
- 若未提供注销账号功能，记录本次创建的测试账号尚未清理，交由用户通过正式账号清理流程处理。
