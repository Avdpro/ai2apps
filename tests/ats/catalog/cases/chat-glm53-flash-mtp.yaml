schemaVersion: 1
id: chat-glm53-flash-mtp
name: 从 Chat 安装 GLM-5.3 Flash 4bit MTP 并完成 Chat 对话
description: 验证从 Chat App 模型切换菜单进入模型安装页面，安装 GLM-5.3 Flash 4bit MTP，返回 Chat 选择该模型并完成简单对话的完整流程。
