id: imagine-image-edit-panda-hat
name: 图片编辑：给熊猫戴上帽子
description: 验证 Imagine Studio 的“图片编辑”Mini-App 能通过素材拖拽设置主图片，并使用提示词“给熊猫带上帽子”生成保留熊猫吃竹子主体且新增帽子的图片。执行前，用户需通过
  Test Center 受管理上传流程补充最新生成的熊猫吃竹子图片；缺少素材时标记为 blocked。
