instructions:
- 使用 Computer Use 在已校验的 AI2Apps Test Shell 中打开 Imagine Studio；本 Case 的 Shell、Mini-App、拖放和原生窗口交互均使用
  Computer Use。
- 在 Mini-Apps 中选择“调整图片”，确认出现“要调整的图片”区域以及对比度、饱和度调节控件。
- 打开素材区域，依据界面可见的生成时间或最新排序定位最新生成的图片，记录其可见标识及原始外观；无法确定最新图片时记录为阻塞。
- 将该图片从素材区域拖到“要调整的图片”位置，观察是否加载出与素材一致的预览。
- 将对比度调至控件允许的最高值，记录数值或滑块端点位置，观察预览中的明暗变化。
- 保持对比度最高，将饱和度调至控件允许的最高值，记录数值或滑块端点位置，观察预览中的颜色变化。
- 点击“完成”并执行界面提供的保存操作；若“完成”直接保存，则等待保存结束。
- 检查右侧输出边栏，定位本次新增的图片并打开预览，核对其内容及调整效果。
expectations:
- “调整图片”Mini-App 正常打开，图片接收区域和两项调节控件可见且可操作。
- 最新生成的目标素材可通过界面信息明确识别，拖入后成功显示预览，图片内容与所选素材一致。
- 对比度达到最高值；对具备中间明暗层次的测试图片，预览呈现可辨认的对比度增强。
- 饱和度达到最高值且对比度仍为最高值；对具备适用颜色的测试图片，预览呈现可辨认的饱和度增强。
- 调整过程中预览保持可见，无空白、加载错误或界面卡死。
- 完成和保存操作成功，右侧输出边栏出现可明确归属于本次操作的新图片。
- 新增输出可以打开，其图片内容以及对比度、饱和度效果与保存前的最终预览一致，未保存成未调整的原图。
cleanup:
- 通过输出边栏的删除操作，仅删除本 Case 新保存的图片，保留原始素材和已有输出。
