schemaVersion: 1
id: imagine-adjust-image
name: 调整图片并保存到输出边栏
description: 验证 Imagine Studio 的“调整图片”Mini-App 能接收素材拖入，在对比度和饱和度调至最高后正确更新预览，并将完成的图片保存到右侧输出边栏。测试前需由用户通过
  Test Center 受管理上传流程补充最新生成的图片，建议使用包含多种颜色和中间明暗层次的图片；素材不可用时记录为阻塞。
groupId: imagine-studio-base-test
priority: null
executor: codex-ui
timeoutSeconds: 300
lifecycle: enabled
componentId: null
enabled: true
required: true
requires: []
tags:
