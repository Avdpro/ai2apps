id: voice-character-reference-clone
name: 克隆语音角色并验证试听
description: 在 Voice Studio 中使用参考音频创建 Clone Test 1 角色，验证试听输出、角色入库。归属按需 Group：Voice
  Studio 基础测试（voice-studio-base-test）。执行前，用户须通过 Test Center 受管理上传流程补充指定音频素材；草稿不预置
  fixture。仅操作已校验的 AI2Apps Test 实例，所有 Shell、Mini-App、原生窗口及 macOS 文件选择操作均使用 Computer
  Use。
