schemaVersion: 1
id: account-password-change
name: 修改密码并重新登录
description: 由用户在隔离测试环境的 Account App 中修改测试账号密码，随后退出并使用修改后的密码重新登录，验证密码变更生效。
groupId: account-base-test
priority: null
executor: codex-ui
timeoutSeconds: 900
lifecycle: enabled
componentId: null
enabled: true
required: true
requires:
- test-account
tags:
- codex-ui
- account-base-test
instructions:
- 使用 Computer Use 连接 Test Center 提供并校验的当前 Test App 内层 Shell，确认目标为 test 实例；无法确认时将本
  Case 标记为 blocked。
- 在 Shell 中打开 Account App，确认当前登录的是本轮专用测试账号；如未登录，交由用户完成登录。
- 进入账号安全设置，打开修改密码界面。
- 将控制权交给用户，由用户填写修改密码所需字段并提交；不读取、记录或保存秘密字段内容。
- 用户完成操作后，检查页面是否明确提示密码修改成功；若需要用户完成额外验证，交由用户完成。
- 若修改密码后仍保持登录，通过账号菜单退出登录；若已自动退出，确认当前显示登录界面。
- 交由用户使用同一测试账号及修改后的密码完成登录。
- 登录完成后重新打开 Account App，检查账号身份与修改前一致，并刷新或重新打开该 App，确认仍可访问需要登录的账号页面。
expectations:
- 操作始终发生在已校验的 test 实例中。
- Account App 可打开修改密码界面，并允许用户提交密码变更。
- 提交后出现明确的密码修改成功提示，且没有未解决的错误。
- 主动退出或自动退出后显示登录界面。
- 用户使用修改后的密码可以成功登录，无认证失败提示。
- 重新登录后的账号身份与修改前一致，重新打开账号页面后仍可正常访问。
cleanup:
- 若密码修改成功，交由用户通过 Account App 将该测试账号恢复为测试前约定的登录状态；如需恢复原密码，由用户自行完成输入与提交，不读取或记录秘密内容。
- 若本 Case 改变了初始登录状态，将测试账号恢复到开始时的登录或退出状态；恢复失败时明确记录未清理状态。
