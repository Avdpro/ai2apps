schemaVersion: 1
id: voice-studio-voice-env-setup
name: 角色管理安装模型并确认音色环境就绪
description: 在 Voice Studio 的 Characters/角色管理中配置音色环境，安装 IndexTTS 2.5 FP16 模型、确认模型许可并完成下载，验证关闭对话框后音色环境显示就绪。
